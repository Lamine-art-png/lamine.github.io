  <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
</head>
<body>
  <div id="root"></div>
  <script>
    (function () {
      var recoveryKey = "agroai_entry_boot_recovery_v1";
      window.__AGROAI_ENTRY_LOADED__ = false;

      window.setTimeout(function () {
        if (window.__AGROAI_ENTRY_LOADED__) return;

        var alreadyRecovered = false;
        try {
          alreadyRecovered = window.sessionStorage.getItem(recoveryKey) === "1";
          if (!alreadyRecovered) window.sessionStorage.setItem(recoveryKey, "1");
        } catch (_) {
          // Restricted Safari storage is non-fatal.
        }

        if (!alreadyRecovered) {
          var cleanup = [];

          if ("serviceWorker" in navigator) {
            cleanup.push(
              navigator.serviceWorker.getRegistrations()
                .then(function (registrations) {
                  return Promise.all(registrations.map(function (registration) {
                    return registration.unregister();
                  }));
                })
                .catch(function () { return undefined; })
            );
          }

          if ("caches" in window) {
            cleanup.push(
              window.caches.keys()
                .then(function (names) {
                  return Promise.all(
                    names
                      .filter(function (name) { return name.indexOf("agroai-shell-") === 0; })
                      .map(function (name) { return window.caches.delete(name); })
                  );
                })
                .catch(function () { return undefined; })
            );
          }

          Promise.all(cleanup).catch(function () { return undefined; }).then(function () {
            var url = new URL(window.location.href);
            url.searchParams.set("frontend_recovery", "entry");
            url.searchParams.set("cache_bust", String(Date.now()));
            window.location.replace(url.toString());
          });
          return;
        }

        var root = document.getElementById("root");
        if (root) {
          root.innerHTML =
            '<div style="min-height:100vh;background:#F6F4EE;color:#10231B;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;padding:48px 24px;box-sizing:border-box;">' +
              '<div style="max-width:720px;margin:0 auto;background:#FFFDF8;border:1px solid #D6DDD0;border-radius:20px;padding:28px;box-sizing:border-box;">' +
                '<div style="font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#2D6A4F;">AGRO-AI Enterprise Portal</div>' +
                '<h1 style="margin:12px 0 0;font-size:28px;">Browser compatibility recovery</h1>' +
                '<p style="margin:12px 0 0;color:#65736A;font-size:14px;line-height:1.7;">The portal entry module did not start. Refresh once. If this persists, update Safari to the newest version available for this Mac.</p>' +
              '</div>' +
            '</div>';
        }
      }, 8500);
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>

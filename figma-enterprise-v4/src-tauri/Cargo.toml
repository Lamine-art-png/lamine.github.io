[package]
name = "agroai-enterprise-portal"
version = "0.1.0"
description = "AGRO-AI Enterprise Portal desktop application"
authors = ["AGRO-AI"]
edition = "2021"

[lib]
name = "agroai_enterprise_portal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
url = "2"
webbrowser = "1"

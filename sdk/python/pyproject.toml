[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agroai-platform"
version = "0.3.0"
description = "AGRO-AI Intelligence and Platform API client (server-side)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "httpx>=0.26,<1"]

[project.scripts]
agroai = "agroai_platform.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agroai_platform*", "agroai*"]

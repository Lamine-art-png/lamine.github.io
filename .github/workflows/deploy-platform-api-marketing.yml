name: Platform API Final Production Proof

on:
  pull_request:
    paths:
      - "cloudflare/platform-api-marketing-worker/**"
      - "platform-api/**"
      - ".github/workflows/deploy-platform-api-marketing.yml"
  push:
    branches: ["main"]
    paths:
      - "cloudflare/platform-api-marketing-worker/**"
      - "platform-api/**"
      - ".github/workflows/deploy-platform-api-marketing.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: platform-api-final-production-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKER_CONFIG: cloudflare/platform-api-marketing-worker/wrangler.toml
  MARKETING_URL: https://agroai-pilot.com/platform-api
  DOCS_URL: https://agroai-pilot.com/platform-api/docs/
  INSTALLER_URL: https://agroai-pilot.com/platform-api/assets/install.sh
  UNKNOWN_URL: https://agroai-pilot.com/platform-api/not-a-real-route
  PLATFORM_URL: https://platform.agroai-pilot.com
  PLATFORM_EDGE_URL: https://platform.agroai-pilot.com/v1/edge-health
  PLATFORM_HEALTH_URL: https://platform.agroai-pilot.com/v1/health
  PLATFORM_RUNTIME_URL: https://api.agroai-pilot.com/v1/platform/health
  PLATFORM_TERMS_URL: https://api.agroai-pilot.com/v1/platform/terms
  OPS_ISSUE: "262"

jobs:
  validate:
    name: Validate Platform public-surface contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node cloudflare/platform-api-marketing-worker/tests/contract.mjs
      - run: npx --yes wrangler@4.107.0 deploy --dry-run --config "${WORKER_CONFIG}"

  deploy:
    name: Deploy and prove Platform API public surface
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.PRODUCTION_API_SERVICE_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve immutable backend deployment commit
        shell: bash
        run: |
          set -euo pipefail
          backend_sha="$(bash .github/scripts/resolve-backend-release-sha.sh)"
          echo "BACKEND_RELEASE_SHA=${backend_sha}" >> "$GITHUB_ENV"
          echo "Expected backend deployment SHA: ${backend_sha}"

      - name: Classify public/private mode from production backend truth
        shell: bash
        run: |
          set -euo pipefail
          runtime_code="$(curl -sS --max-time 15 -o /tmp/platform-runtime.json -w '%{http_code}' "$PLATFORM_RUNTIME_URL" || true)"
          terms_code="$(curl -sS --max-time 15 -o /tmp/platform-terms.json -w '%{http_code}' "$PLATFORM_TERMS_URL" || true)"
          cli_ready=false
          if [[ "$runtime_code" == "200" ]] && jq -e '.cli_device_auth.enabled == true and .cli_device_auth.secret_ready == true' /tmp/platform-runtime.json >/dev/null 2>&1; then cli_ready=true; fi
          terms_ready=false
          if [[ "$terms_code" == "200" ]] && jq -e '(.documents|type=="array") and ([.documents[].document_type]|index("api_terms")!=null) and ([.documents[].document_type]|index("acceptable_use")!=null) and ([.documents[].document_type]|index("privacy")!=null) and ([.documents[]|select(.legal_review_status!="approved_effective")]|length==0)' /tmp/platform-terms.json >/dev/null 2>&1; then terms_ready=true; fi

          public_mode=false
          if [[ -n "${RENDER_API_KEY:-}" && -n "${RENDER_SERVICE_ID:-}" ]]; then
            render_env() {
              local key="$1"
              curl --fail-with-body --silent --show-error -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/$key" | jq -r '.value // empty'
            }
            render_all=true
            for key in PLATFORM_API_ENABLED PLATFORM_API_DEVELOPER_CONTROL_PLANE_ENABLED PLATFORM_API_TEST_PROJECTS_ENABLED PLATFORM_API_SELF_SERVICE_SANDBOX_ENABLED PLATFORM_API_TEST_SELF_SERVICE_AUTO_ENROLL_ENABLED PLATFORM_API_TERMS_ENFORCEMENT_ENABLED PLATFORM_API_CLI_DEVICE_AUTH_ENABLED; do
              [[ "$(render_env "$key")" == "true" ]] || { render_all=false; break; }
            done
            if [[ "$render_all" == "true" && "$cli_ready" == "true" && "$terms_ready" == "true" ]]; then public_mode=true; fi
          elif [[ "$cli_ready" == "true" || "$terms_ready" == "true" ]]; then
            echo "Production looks partially/publicly activated, but Render env read access is unavailable; refusing to guess marketing state." >&2
            exit 1
          fi
          echo "PUBLIC_SELF_SERVICE_MODE=${public_mode}" >> "$GITHUB_ENV"
          echo "Public TEST self-service marketing mode: ${public_mode}"

      - name: Fail closed on missing Cloudflare credentials
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]]
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]

      - name: Deploy narrow production route in classified mode
        run: |
          set -euo pipefail
          npx --yes wrangler@4.107.0 deploy --config "$WORKER_CONFIG" \
            --var "MARKETING_ORIGIN:https://agroai-343.pages.dev" \
            --var "PLATFORM_API_MARKETING_ENABLED:true" \
            --var "PLATFORM_API_PUBLIC_DOCS_ENABLED:true" \
            --var "PLATFORM_API_INDEXING_ENABLED:${PUBLIC_SELF_SERVICE_MODE}" \
            --var "PLATFORM_API_PUBLIC_SELF_SERVICE_ENABLED:${PUBLIC_SELF_SERVICE_MODE}"

      - name: Probe exact production contract
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          mkdir -p proof
          for attempt in $(seq 1 30); do
            landing_code="$(curl -sS -L --max-time 15 -D proof/landing.headers -o proof/landing.html -w '%{http_code}' "$MARKETING_URL" || true)"
            docs_code="$(curl -sS -L --max-time 15 -D proof/docs.headers -o proof/docs.html -w '%{http_code}' "$DOCS_URL" || true)"
            installer_code="$(curl -sS -L --max-time 15 -o proof/install.sh -w '%{http_code}' "$INSTALLER_URL" || true)"
            unknown_code="$(curl -sS -L --max-time 15 -D proof/unknown.headers -o proof/unknown.body -w '%{http_code}' "$UNKNOWN_URL" || true)"
            platform_code="$(curl -sS -L --max-time 15 -o proof/platform.html -w '%{http_code}' "$PLATFORM_URL/" || true)"
            edge_code="$(curl -sS --max-time 15 -o proof/edge.json -w '%{http_code}' "$PLATFORM_EDGE_URL" || true)"
            health_code="$(curl -sS --max-time 15 -o proof/health.json -w '%{http_code}' "$PLATFORM_HEALTH_URL" || true)"
            runtime_code="$(curl -sS --max-time 15 -o proof/runtime.json -w '%{http_code}' "$PLATFORM_RUNTIME_URL" || true)"
            terms_code="$(curl -sS --max-time 15 -o proof/terms.json -w '%{http_code}' "$PLATFORM_TERMS_URL" || true)"
            base_ok=false
            if [[ "$landing_code" == "200" && "$docs_code" == "200" && "$installer_code" == "200" && "$unknown_code" == "404" && "$platform_code" == "200" && "$edge_code" == "200" && "$health_code" == "200" && "$runtime_code" == "200" ]] && \
               grep -F '<title>AGRO-AI Platform API</title>' proof/landing.html >/dev/null && \
               grep -F '<title>AGRO-AI Platform API Documentation</title>' proof/docs.html >/dev/null && \
               grep -F 'Next: agroai login' proof/install.sh >/dev/null && \
               grep -Fi 'x-agroai-platform-api-surface: closed' proof/unknown.headers >/dev/null && \
               grep -Fi 'x-robots-tag: noindex, nofollow' proof/unknown.headers >/dev/null && \
               jq -e '.status == "ok"' proof/edge.json >/dev/null && \
               jq -e --arg sha "$BACKEND_RELEASE_SHA" '.status == "ok" and .build_sha == $sha' proof/health.json >/dev/null && \
               jq -e '.status == "ready" and .platform_api_enabled == true and .developer_control_plane_enabled == true and .rate_limiter.ready == true and .rate_limiter.backend == "redis" and .production_vault_keyring_ready == true and .cidr_trusted_proxy_ready == true and .webhook_delivery.enabled == false and .earthdaily_status == "awaiting_partner_contract" and .valley_irrigation_status == "awaiting_partner_contract" and .physical_irrigation_commands == "disabled"' proof/runtime.json >/dev/null; then base_ok=true; fi

            mode_ok=false
            if [[ "$PUBLIC_SELF_SERVICE_MODE" == "true" ]]; then
              if grep -Fi 'x-agroai-platform-api-access: public-test-self-service' proof/landing.headers >/dev/null && \
                 ! grep -Fi 'x-robots-tag: noindex, nofollow' proof/landing.headers >/dev/null && \
                 ! grep -Fi 'x-robots-tag: noindex, nofollow' proof/docs.headers >/dev/null && \
                 grep -F 'Self-service TEST access is open to eligible verified agricultural developers.' proof/landing.html >/dev/null && \
                 grep -F 'Self-service TEST access for verified agricultural developers.' proof/docs.html >/dev/null && \
                 [[ "$terms_code" == "200" ]] && jq -e '.cli_device_auth.enabled == true and .cli_device_auth.secret_ready == true' proof/runtime.json >/dev/null && \
                 jq -e '([.documents[].document_type]|index("api_terms")!=null) and ([.documents[].document_type]|index("acceptable_use")!=null) and ([.documents[].document_type]|index("privacy")!=null) and ([.documents[]|select(.legal_review_status!="approved_effective")]|length==0)' proof/terms.json >/dev/null; then mode_ok=true; fi
            else
              if grep -Fi 'x-agroai-platform-api-access: private-beta' proof/landing.headers >/dev/null && grep -Fi 'x-robots-tag: noindex, nofollow' proof/landing.headers >/dev/null && grep -Fi 'x-robots-tag: noindex, nofollow' proof/docs.headers >/dev/null; then mode_ok=true; fi
            fi

            platform_identity=false
            if grep -F 'AGRO-AI Platform API' proof/platform.html >/dev/null; then
              platform_identity=true
            else
              rm -rf proof/assets && mkdir -p proof/assets
              grep -oE '/assets/[A-Za-z0-9._/-]+\.js' proof/platform.html | sort -u > proof/scripts.txt || true
              while IFS= read -r script; do [[ -n "$script" ]] && curl -fsS --max-time 12 "$PLATFORM_URL$script" -o "proof/assets/$(basename "$script")" || true; done < proof/scripts.txt
              if cat proof/assets/*.js 2>/dev/null | grep -F 'AGRO-AI Platform API' >/dev/null; then platform_identity=true; fi
            fi
            if [[ "$base_ok" == "true" && "$mode_ok" == "true" && "$platform_identity" == "true" ]]; then ready=1; break; fi
            sleep 8
          done
          health_exact_backend_sha="$(jq -r '.build_sha // empty' proof/health.json 2>/dev/null || true)"
          jq -n --arg release_sha "$GITHUB_SHA" --arg backend_sha "$BACKEND_RELEASE_SHA" --arg expected_backend_sha "$BACKEND_RELEASE_SHA" --arg health_exact_backend_sha "$health_exact_backend_sha" --arg mode "$PUBLIC_SELF_SERVICE_MODE" --argjson ready "$ready" '{release_sha:$release_sha,backend_release_sha:$backend_sha,expected_backend_sha:$expected_backend_sha,health_exact_backend_sha:$health_exact_backend_sha,public_test_self_service:($mode=="true"),ready:($ready==1)}' > platform-api-final-diagnostics.json
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Upload immutable production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-api-final-production-${{ github.sha }}
          path: |
            platform-api-final-diagnostics.json
            proof/
          retention-days: 30

      - name: Record production proof
        if: always()
        shell: bash
        env:
          READY: ${{ steps.smoke.outputs.ready }}
        run: |
          set -euo pipefail
          if [[ "${READY:-0}" == "1" ]]; then
            printf '## Platform API final production proof\n\n- release SHA: `%s`\n- backend deployment SHA: `%s`\n- public TEST self-service: `%s`\n- exact backend, edge, Redis, vault and safety gates: **green**\n' "$GITHUB_SHA" "$BACKEND_RELEASE_SHA" "$PUBLIC_SELF_SERVICE_MODE" > issue-comment.md
          else
            printf '## Platform API final production proof failed\n\nRun: `%s`\n' "$GITHUB_RUN_ID" > issue-comment.md
          fi
          gh issue comment "$OPS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file issue-comment.md

      - name: Enforce complete production proof
        if: always()
        env:
          READY: ${{ steps.smoke.outputs.ready }}
        run: test "${READY:-0}" = "1"

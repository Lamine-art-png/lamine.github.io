name: Portal auth latency fix

on:
  push:
    branches:
      - fix/portal-auth-latency-20260802

permissions:
  contents: write

concurrency:
  group: portal-auth-latency-fix-20260802
  cancel-in-progress: true

jobs:
  repair-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portal-auth-latency-20260802
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agroai_api/requirements.txt
      - name: Repair and validate authentication hot paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          auth_path = Path('agroai_api/app/api/v1/auth.py')
          text = auth_path.read_text()

          confirm_start = text.index('@router.post("/email-verification/confirm")')
          me_start = text.index('@router.get("/me")', confirm_start)
          confirm = text[confirm_start:me_start]

          missing_membership = (
              '    if not membership:\n'
              '        raise HTTPException(status_code=status.HTTP_403_FORBIDDEN, detail="User has no organization membership")\n'
          )
          membership_lookup = (
              '    membership = (\n'
              '        db.query(OrganizationMembership)\n'
              '        .filter(OrganizationMembership.user_id == user.id)\n'
              '        .order_by(OrganizationMembership.created_at.asc())\n'
              '        .first()\n'
              '    )\n'
          )
          if membership_lookup not in confirm:
              if missing_membership not in confirm:
                  raise SystemExit('Email verification membership guard was not found')
              confirm = confirm.replace(missing_membership, membership_lookup + missing_membership, 1)

          one_time_seed = (
              '    ensure_evaluation_context(db, membership.organization, _first_workspace(db, membership.organization_id))\n'
          )
          approval_line = '    require_approved_organization(membership.organization)\n'
          if one_time_seed not in confirm:
              if approval_line not in confirm:
                  raise SystemExit('Email verification organization approval line was not found')
              confirm = confirm.replace(approval_line, approval_line + one_time_seed, 1)

          text = text[:confirm_start] + confirm + text[me_start:]

          login_start = text.index('@router.post("/login")')
          logout_start = text.index('@router.post("/logout")', login_start)
          login = text[login_start:logout_start]
          me = text[text.index('@router.get("/me")'):]
          if 'ensure_evaluation_context' in login:
              raise SystemExit('Repeat login still seeds evaluation context')
          if 'ensure_evaluation_context' in me:
              raise SystemExit('Session lookup still seeds evaluation context')
          if membership_lookup not in confirm or one_time_seed not in confirm:
              raise SystemExit('Email verification activation flow is incomplete')

          auth_path.write_text(text)

          test_path = Path('agroai_api/tests/unit/test_auth_hot_path.py')
          test_path.write_text('''from datetime import datetime\n\nfrom app.models.saas import OrganizationMembership, User\n\n\ndef _register_account(client, email):\n    response = client.post(\n        "/v1/auth/register",\n        json={\n            "email": email,\n            "password": "strong-password",\n            "name": "Auth Hot Path",\n            "organization_name": "Auth Hot Path Farms",\n            "workspace_name": "Evaluation workspace",\n            "crop": "Grapes",\n            "region": "California",\n        },\n    )\n    assert response.status_code == 201, response.text\n    return response.json()\n\n\ndef _verified_account(client, db):\n    body = _register_account(client, "auth-hot-path@example.com")\n    membership = (\n        db.query(OrganizationMembership)\n        .filter(OrganizationMembership.organization_id == body["current_organization"]["id"])\n        .first()\n    )\n    membership.user.email_verification_status = "verified"\n    membership.user.email_verified_at = datetime.utcnow()\n    db.commit()\n    return membership.user.email\n\n\ndef test_repeat_login_and_me_never_reseed_evaluation_context(client, db, monkeypatch):\n    email = _verified_account(client, db)\n\n    first_login = client.post(\n        "/v1/auth/login",\n        json={"email": email, "password": "strong-password"},\n    )\n    assert first_login.status_code == 200, first_login.text\n\n    def fail_if_called(*_args, **_kwargs):\n        raise AssertionError("evaluation context seeding must not run in repeat auth")\n\n    monkeypatch.setattr("app.api.v1.auth.ensure_evaluation_context", fail_if_called)\n\n    repeat_login = client.post(\n        "/v1/auth/login",\n        json={"email": email, "password": "strong-password"},\n    )\n    assert repeat_login.status_code == 200, repeat_login.text\n    token = repeat_login.json()["access_token"]\n\n    me = client.get(\n        "/v1/auth/me",\n        headers={"Authorization": f"Bearer {token}"},\n    )\n    assert me.status_code == 200, me.text\n    assert me.json()["user"]["email"] == email\n\n\ndef test_email_verification_confirm_keeps_one_time_activation_seed(client, db, monkeypatch):\n    email = "verification-activation@example.com"\n    _register_account(client, email)\n    user = db.query(User).filter(User.email == email).one()\n    seed_calls = []\n\n    def fake_confirm(active_db, _token):\n        user.email_verification_status = "verified"\n        user.email_verified_at = datetime.utcnow()\n        active_db.flush()\n        return user\n\n    def capture_seed(*args, **kwargs):\n        seed_calls.append((args, kwargs))\n        return {}\n\n    monkeypatch.setattr("app.api.v1.auth.confirm_verification", fake_confirm)\n    monkeypatch.setattr("app.api.v1.auth.ensure_evaluation_context", capture_seed)\n\n    response = client.post(\n        "/v1/auth/email-verification/confirm",\n        json={"token": "verification-test-token-20260802"},\n    )\n    assert response.status_code == 200, response.text\n    assert response.json()["status"] == "verified"\n    assert len(seed_calls) == 1\n''')
          PY
      - name: Install backend dependencies
        working-directory: agroai_api
        run: pip install -r requirements.txt pytest
      - name: Run authentication regression tests
        working-directory: agroai_api
        env:
          APP_ENV: test
          ACCOUNT_VERIFICATION_MODE: disabled
        run: pytest -q tests/unit/test_auth_hot_path.py tests/unit/test_saas_foundation.py tests/unit/test_account_verification_security.py
      - name: Commit tested source fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Source already repaired and tested.'
            exit 0
          fi
          git config user.name 'AGRO-AI Production Fix'
          git config user.email 'contact@agroai-pilot.com'
          git add agroai_api/app/api/v1/auth.py agroai_api/tests/unit/test_auth_hot_path.py
          git commit -m 'Fix portal authentication latency hot path'
          git fetch origin fix/portal-auth-latency-20260802
          git rebase origin/fix/portal-auth-latency-20260802
          git push origin HEAD:fix/portal-auth-latency-20260802

name: Apply Platform Enterprise Hardening

on:
  push:
    branches:
      - hardening/platform-api-enterprise-2026
    paths:
      - ops/platform-enterprise-hardening.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: platform-enterprise-hardening
  cancel-in-progress: false

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: agroai_enterprise_hardening
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/platform-api-enterprise-2026
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic patch
        run: python scripts/apply_platform_enterprise_hardening.py
      - name: Install backend test dependencies
        working-directory: agroai_api
        run: python -m pip install -q -r requirements.txt pytest
      - name: Compile changed Python
        run: >-
          python -m compileall -q
          agroai_api/app/main.py
          agroai_api/scripts/platform_api_load_probe.py
          agroai_api/tests/unit/test_runtime_security_hardening.py
      - name: Run focused runtime and enterprise tests
        working-directory: agroai_api
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/agroai_enterprise_hardening
        run: |
          alembic upgrade head
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q --tb=short \
            tests/unit/test_runtime_security_hardening.py \
            tests/unit/test_platform_api_enterprise_hardening.py \
            tests/unit/test_platform_billing_runtime_diagnostics.py
      - name: Verify SDK packages
        run: |
          python -m pip install -q build
          python -m build sdk/python
          cd sdk/typescript
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          npm pack --dry-run
      - name: Commit validated hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            agroai_api/app/main.py \
            agroai_api/scripts/platform_api_load_probe.py \
            agroai_api/tests/unit/test_runtime_security_hardening.py \
            agroai_api/docs/ENTERPRISE_READINESS_ROADMAP.md \
            agroai_api/ENTERPRISE_DELIVERY_SUMMARY.md \
            sdk/python/pyproject.toml \
            sdk/typescript/package.json \
            developers/index.html \
            .github/dependabot.yml \
            SECURITY.md \
            docs/platform-api-slo-policy.md \
            docs/platform-api-disaster-recovery.md \
            docs/platform-api-incident-response.md \
            docs/platform-api-security-baseline.md \
            docs/platform-api-enterprise-readiness-2026.md
          if git diff --cached --quiet; then
            echo 'No patch changes detected'
            exit 0
          fi
          git commit -m 'Harden Platform API for controlled enterprise launch [skip ci]'
          git push origin HEAD:hardening/platform-api-enterprise-2026

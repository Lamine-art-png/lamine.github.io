name: Deploy News Articles

on:
  push:
    branches: ["main"]
    paths:
      - "client/public/news/agro-ai-assurance-enterprise-portal/**"
      - "client/public/news/agro-ai-field-intelligence-upgrade/**"
      - "client/public/news/agro-ai-platform-api-launch/**"
      - "client/public/news/introducing-agro-ai-field-intelligence/**"
      - "client/public/news/agro-ai-connected-john-deere-operations-center/**"
      - "cloudflare/field-intelligence-launch-worker/**"
      - ".github/workflows/deploy-field-intelligence-launch-article.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agroai-news-article-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish and verify all managed News articles
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEWSROOM_URL: https://agroai-pilot.com/news
      NEWSROOM_ORIGIN_URL: https://agroai-343.pages.dev/news
      NEWSROOM_SCRIPT_URL: https://agroai-pilot.com/news/agroai-news-card-restore.js
      ASSURANCE_ARTICLE_URL: https://agroai-pilot.com/news/agro-ai-assurance-enterprise-portal
      ASSURANCE_COVER_URL: https://agroai-pilot.com/news/agro-ai-assurance-enterprise-portal/cover.svg
      ASSURANCE_LOGO_URL: https://agroai-pilot.com/news/agro-ai-assurance-enterprise-portal/agro-ai-logo.png
      FIELD_UPDATE_ARTICLE_URL: https://agroai-pilot.com/news/agro-ai-field-intelligence-upgrade
      FIELD_UPDATE_COVER_URL: https://agroai-pilot.com/news/agro-ai-field-intelligence-upgrade/cover.svg
      FIELD_UPDATE_LOGO_URL: https://agroai-pilot.com/news/agro-ai-field-intelligence-upgrade/agro-ai-logo.png
      PLATFORM_ARTICLE_URL: https://agroai-pilot.com/news/agro-ai-platform-api-launch
      FIELD_ARTICLE_URL: https://agroai-pilot.com/news/introducing-agro-ai-field-intelligence
      JOHN_DEERE_ARTICLE_URL: https://agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center
    steps:
      - uses: actions/checkout@v4

      - name: Require production Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Validate exact News sources and route boundaries
        shell: bash
        run: |
          set -euo pipefail

          assurance_article="client/public/news/agro-ai-assurance-enterprise-portal/index.html"
          assurance_cover="client/public/news/agro-ai-assurance-enterprise-portal/cover.svg"
          field_update_article="client/public/news/agro-ai-field-intelligence-upgrade/index.html"
          field_update_cover="client/public/news/agro-ai-field-intelligence-upgrade/cover.svg"
          platform_article="client/public/news/agro-ai-platform-api-launch/index.html"
          field_article="client/public/news/introducing-agro-ai-field-intelligence/index.html"
          deere_article="client/public/news/agro-ai-connected-john-deere-operations-center/index.html"
          worker="cloudflare/field-intelligence-launch-worker/src/index.ts"
          routes="cloudflare/field-intelligence-launch-worker/wrangler.toml"

          for file in \
            "$assurance_article" "$assurance_cover" \
            "$field_update_article" "$field_update_cover" \
            "$platform_article" "$field_article" "$deere_article" \
            "$worker" "$routes"; do
            test -s "$file"
          done

          grep -F "AGRO-AI launches Assurance in the Enterprise Portal" "$assurance_article" >/dev/null
          grep -F "Tuesday, August 25, 2026" "$assurance_article" >/dev/null
          grep -F '"@type":"NewsArticle"' "$assurance_article" >/dev/null
          grep -F 'rel="canonical" href="https://agroai-pilot.com/news/agro-ai-assurance-enterprise-portal"' "$assurance_article" >/dev/null

          grep -F "Field Intelligence now connects the field visit to the operating decision." "$field_update_article" >/dev/null
          grep -F "Wednesday, August 26, 2026" "$field_update_article" >/dev/null
          grep -F '"@type":"NewsArticle"' "$field_update_article" >/dev/null
          grep -F 'rel="canonical" href="https://agroai-pilot.com/news/agro-ai-field-intelligence-upgrade"' "$field_update_article" >/dev/null

          grep -F 'ASSURANCE_ARTICLE_PATH = "/news/agro-ai-assurance-enterprise-portal"' "$worker" >/dev/null
          grep -F 'FIELD_INTELLIGENCE_UPDATE_ARTICLE_PATH = "/news/agro-ai-field-intelligence-upgrade"' "$worker" >/dev/null
          grep -F 'PLATFORM_API_ARTICLE_PATH = "/news/agro-ai-platform-api-launch"' "$worker" >/dev/null

          grep -F 'pattern = "agroai-pilot.com/news"' "$routes" >/dev/null
          grep -F 'pattern = "agroai-pilot.com/news/"' "$routes" >/dev/null
          grep -F 'pattern = "agroai-pilot.com/news/agro-ai-assurance-enterprise-portal"' "$routes" >/dev/null
          grep -F 'pattern = "agroai-pilot.com/news/agro-ai-assurance-enterprise-portal/*"' "$routes" >/dev/null
          grep -F 'pattern = "agroai-pilot.com/news/agro-ai-field-intelligence-upgrade"' "$routes" >/dev/null
          grep -F 'pattern = "agroai-pilot.com/news/agro-ai-field-intelligence-upgrade/*"' "$routes" >/dev/null
          ! grep -F 'pattern = "agroai-pilot.com/*"' "$routes"
          ! grep -F 'pattern = "agroai-pilot.com/news*"' "$routes"
          ! grep -F 'pattern = "agroai-pilot.com/news/*"' "$routes"

      - name: Validate Worker bundle
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.107.0 deploy --dry-run --config cloudflare/field-intelligence-launch-worker/wrangler.toml

      - name: Deploy exact production News routes
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.107.0 deploy --config cloudflare/field-intelligence-launch-worker/wrangler.toml

      - name: Prove native newsroom is preserved and new cards are loaded
        shell: bash
        run: |
          set -euo pipefail

          # Cloudflare route matching includes the query string. The exact News
          # routes intentionally do not use broad wildcards, so production
          # verification must exercise the same clean URLs that visitors use.
          for attempt in $(seq 1 24); do
            origin_status="$(curl -sS -L -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o origin-newsroom.html -w '%{http_code}' --max-time 25 "${NEWSROOM_ORIGIN_URL}" || true)"
            live_status="$(curl -sS -L -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -D live-newsroom.headers -o live-newsroom.html -w '%{http_code}' --max-time 25 "${NEWSROOM_URL}" || true)"
            script_status="$(curl -sS -L -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o newsroom-script.js -w '%{http_code}' --max-time 25 "${NEWSROOM_SCRIPT_URL}" || true)"

            if [ "$origin_status" = "200" ] && [ "$live_status" = "200" ] && [ "$script_status" = "200" ] && \
               grep -Fi 'x-agroai-newsroom-source: native-pages-origin' live-newsroom.headers >/dev/null && \
               grep -F 'agroai-news-card-restore.js' live-newsroom.html >/dev/null && \
               grep -F 'AGRO-AI launches its Enterprise Portal globally' live-newsroom.html >/dev/null && \
               grep -F '/news/agro-ai-assurance-enterprise-portal' newsroom-script.js >/dev/null && \
               grep -F '/news/agro-ai-field-intelligence-upgrade' newsroom-script.js >/dev/null; then
              python3 - <<'PY'
          from pathlib import Path
          import re

          origin = Path("origin-newsroom.html").read_text()
          live = Path("live-newsroom.html").read_text()
          pattern = r'<script src="/news/agroai-news-card-restore\.js" defer data-agroai-news-card-restoration="exact-native-grid-v2"></script>'
          clean, count = re.subn(pattern, "", live, count=1)
          if count != 1:
              raise SystemExit("Expected exactly one managed newsroom script tag")
          if clean != origin:
              raise SystemExit("Native newsroom markup changed beyond the managed script tag")
          PY
              echo "native_newsroom_markup=unchanged"
              echo "enterprise_portal_launch_feature=preserved"
              echo "new_managed_news_cards=loaded"
              exit 0
            fi
            sleep 5
          done

          echo "Native newsroom preservation did not verify"
          printf 'origin_status=%s live_status=%s script_status=%s\n' "$origin_status" "$live_status" "$script_status"
          cat live-newsroom.headers || true
          exit 1

      - name: Prove Assurance article and official assets live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            article_status="$(curl -sS -L -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -D assurance.headers -o assurance.html -w '%{http_code}' --max-time 25 "${ASSURANCE_ARTICLE_URL}" || true)"
            cover_status="$(curl -sS -L -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -D assurance-cover.headers -o assurance-cover.svg -w '%{http_code}' --max-time 25 "${ASSURANCE_COVER_URL}" || true)"
            logo_status="$(curl -sS -L -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -D assurance-logo.headers -o assurance-logo.bin -w '%{http_code}' --max-time 25 "${ASSURANCE_LOGO_URL}" || true)"

            if [ "$article_status" = "200" ] && [ "$cover_status" = "200" ] && [ "$logo_status" = "200" ] && \
               grep -F "AGRO-AI launches Assurance in the Enterprise Portal" assurance.html >/dev/null && \
               grep -F "Tuesday, August 25, 2026" assurance.html >/dev/null && \
               grep -F '"@type":"NewsArticle"' assurance.html >/dev/null && \
               grep -Fi 'x-robots-tag: index, follow, max-image-preview:large' assurance.headers >/dev/null && \
               grep -Fi 'x-agroai-asset-source: reviewed-assurance-cover' assurance-cover.headers >/dev/null && \
               grep -Fi 'x-agroai-asset-source: official-repository-logo' assurance-logo.headers >/dev/null; then
              echo "assurance_article=verified_live"
              exit 0
            fi
            sleep 5
          done

          echo "Assurance article did not verify live"
          printf 'article_status=%s cover_status=%s logo_status=%s\n' "$article_status" "$cover_status" "$logo_status"
          exit 1

      - name: Prove Field Intelligence update and official assets live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            article_status="$(curl -sS -L -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -D field-update.headers -o field-update.html -w '%{http_code}' --max-time 25 "${FIELD_UPDATE_ARTICLE_URL}" || true)"
            cover_status="$(curl -sS -L -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -D field-update-cover.headers -o field-update-cover.svg -w '%{http_code}' --max-time 25 "${FIELD_UPDATE_COVER_URL}" || true)"
            logo_status="$(curl -sS -L -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -D field-update-logo.headers -o field-update-logo.bin -w '%{http_code}' --max-time 25 "${FIELD_UPDATE_LOGO_URL}" || true)"

            if [ "$article_status" = "200" ] && [ "$cover_status" = "200" ] && [ "$logo_status" = "200" ] && \
               grep -F "Field Intelligence now connects the field visit to the operating decision." field-update.html >/dev/null && \
               grep -F "Wednesday, August 26, 2026" field-update.html >/dev/null && \
               grep -F '"@type":"NewsArticle"' field-update.html >/dev/null && \
               grep -Fi 'x-robots-tag: index, follow, max-image-preview:large' field-update.headers >/dev/null && \
               grep -Fi 'x-agroai-asset-source: reviewed-field-intelligence-update-cover' field-update-cover.headers >/dev/null && \
               grep -Fi 'x-agroai-asset-source: official-repository-logo' field-update-logo.headers >/dev/null; then
              echo "field_intelligence_update_article=verified_live"
              exit 0
            fi
            sleep 5
          done

          echo "Field Intelligence update article did not verify live"
          printf 'article_status=%s cover_status=%s logo_status=%s\n' "$article_status" "$cover_status" "$logo_status"
          exit 1

      - name: Prove existing managed articles remain live
        shell: bash
        run: |
          set -euo pipefail

          platform_status="$(curl -sS -L -H 'Cache-Control: no-cache' -o platform.html -w '%{http_code}' --max-time 25 "${PLATFORM_ARTICLE_URL}" || true)"
          field_status="$(curl -sS -L -H 'Cache-Control: no-cache' -o field.html -w '%{http_code}' --max-time 25 "${FIELD_ARTICLE_URL}" || true)"
          deere_status="$(curl -sS -L -H 'Cache-Control: no-cache' -o deere.html -w '%{http_code}' --max-time 25 "${JOHN_DEERE_ARTICLE_URL}" || true)"

          test "$platform_status" = "200"
          test "$field_status" = "200"
          test "$deere_status" = "200"
          grep -F "AGRO-AI launches the Platform API for agriculture builders" platform.html >/dev/null
          grep -F "Introducing AGRO-AI Field Intelligence" field.html >/dev/null
          grep -F "AGRO-AI connects with John Deere Operations Center™" deere.html >/dev/null
          echo "existing_managed_articles=verified_live"

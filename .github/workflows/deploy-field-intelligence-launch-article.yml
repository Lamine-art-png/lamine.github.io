name: Deploy News Articles

on:
  push:
    branches: ["main"]
    paths:
      - "client/public/news/agro-ai-platform-api-launch/**"
      - "client/public/news/introducing-agro-ai-field-intelligence/**"
      - "client/public/news/agro-ai-connected-john-deere-operations-center/**"
      - "cloudflare/field-intelligence-launch-worker/**"
      - ".github/workflows/deploy-field-intelligence-launch-article.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agroai-news-article-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish and verify all managed News articles
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEWSROOM_URL: https://agroai-pilot.com/news
      NEWSROOM_ORIGIN_URL: https://agroai-343.pages.dev/news
      NEWSROOM_SCRIPT_URL: https://agroai-pilot.com/news/agroai-news-card-restore.js
      PLATFORM_ARTICLE_URL: https://agroai-pilot.com/news/agro-ai-platform-api-launch
      PLATFORM_COVER_URL: https://agroai-pilot.com/news/agro-ai-platform-api-launch/cover.svg
      PLATFORM_LOGO_URL: https://agroai-pilot.com/news/agro-ai-platform-api-launch/agro-ai-logo.png
      FIELD_ARTICLE_URL: https://agroai-pilot.com/news/introducing-agro-ai-field-intelligence
      FIELD_COVER_URL: https://agroai-pilot.com/news/introducing-agro-ai-field-intelligence/cover.webp
      FIELD_LOGO_URL: https://agroai-pilot.com/news/introducing-agro-ai-field-intelligence/agro-ai-logo.png
      JOHN_DEERE_ARTICLE_URL: https://agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center
      JOHN_DEERE_COVER_URL: https://agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center/cover.webp
    steps:
      - uses: actions/checkout@v4

      - name: Require production Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Validate exact News sources and route boundaries
        shell: bash
        run: |
          set -euo pipefail
          platform_article="client/public/news/agro-ai-platform-api-launch/index.html"
          platform_cover="client/public/news/agro-ai-platform-api-launch/cover.svg"
          field_article="client/public/news/introducing-agro-ai-field-intelligence/index.html"
          deere_article="client/public/news/agro-ai-connected-john-deere-operations-center/index.html"
          deere_cover="client/public/news/agro-ai-connected-john-deere-operations-center/cover.webp"
          worker="cloudflare/field-intelligence-launch-worker/src/index.ts"
          routes="cloudflare/field-intelligence-launch-worker/wrangler.toml"

          test -s "$platform_article"
          test -s "$platform_cover"
          test -s "$field_article"
          test -s "$deere_article"
          test -s "$deere_cover"
          test -s "$worker"
          test -s "$routes"

          grep -F "AGRO-AI launches the Platform API for agriculture builders" "$platform_article" >/dev/null
          grep -F "Build agricultural products on the AGRO-AI intelligence layer." "$platform_article" >/dev/null
          grep -F "Introducing AGRO-AI Field Intelligence" "$field_article" >/dev/null
          grep -F "GiM6WZY0HG0" "$field_article" >/dev/null
          grep -F "AGRO-AI connects with John Deere Operations Center™" "$deere_article" >/dev/null
          ! grep -Eiq "partnered with John Deere|partnership with John Deere|endorsed by John Deere" "$deere_article"

          grep -F 'PLATFORM_API_ARTICLE_PATH = "/news/agro-ai-platform-api-launch"' "$worker" >/dev/null
          grep -F 'AGRO-AI launches the Platform API' "$worker" >/dev/null
          grep -F 'Introducing AGRO-AI Field Intelligence' "$worker" >/dev/null
          grep -F 'AGRO-AI connects with John Deere Operations Center™' "$worker" >/dev/null

          grep -F 'pattern = "agroai-pilot.com/news"' "$routes" >/dev/null
          grep -F 'pattern = "agroai-pilot.com/news/"' "$routes" >/dev/null
          grep -F 'pattern = "agroai-pilot.com/news/agroai-news-card-restore.js"' "$routes" >/dev/null
          grep -F 'pattern = "agroai-pilot.com/news/agro-ai-platform-api-launch"' "$routes" >/dev/null
          grep -F 'pattern = "agroai-pilot.com/news/agro-ai-platform-api-launch/*"' "$routes" >/dev/null
          grep -F 'pattern = "agroai-pilot.com/news/introducing-agro-ai-field-intelligence*"' "$routes" >/dev/null
          grep -F 'pattern = "agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center"' "$routes" >/dev/null
          ! grep -F 'pattern = "agroai-pilot.com/news*"' "$routes"
          ! grep -F 'pattern = "agroai-pilot.com/news/*"' "$routes"

      - name: Validate Worker bundle
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.107.0 deploy --dry-run --config cloudflare/field-intelligence-launch-worker/wrangler.toml

      - name: Deploy exact production News routes
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.107.0 deploy --config cloudflare/field-intelligence-launch-worker/wrangler.toml

      - name: Prove native newsroom and managed cards
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            bust="$(date +%s)-${attempt}"
            origin_status="$(curl -sS -L -H 'Cache-Control: no-cache' -o origin-newsroom.html -w '%{http_code}' --max-time 25 "${NEWSROOM_ORIGIN_URL}?verify=${bust}" || true)"
            live_status="$(curl -sS -L -H 'Cache-Control: no-cache' -D live-newsroom.headers -o live-newsroom.html -w '%{http_code}' --max-time 25 "${NEWSROOM_URL}?verify=${bust}" || true)"
            script_status="$(curl -sS -L -H 'Cache-Control: no-cache' -o newsroom-script.js -w '%{http_code}' --max-time 25 "${NEWSROOM_SCRIPT_URL}?verify=${bust}" || true)"

            if [ "$origin_status" = "200" ] && [ "$live_status" = "200" ] && [ "$script_status" = "200" ] && \
               grep -Fi 'x-agroai-newsroom-source: native-pages-origin' live-newsroom.headers >/dev/null && \
               grep -F 'agroai-news-card-restore.js' live-newsroom.html >/dev/null && \
               grep -F '/news/agro-ai-platform-api-launch' newsroom-script.js >/dev/null && \
               grep -F 'AGRO-AI launches the Platform API' newsroom-script.js >/dev/null && \
               grep -F 'Introducing AGRO-AI Field Intelligence' newsroom-script.js >/dev/null && \
               grep -F 'AGRO-AI connects with John Deere Operations Center™' newsroom-script.js >/dev/null; then
              python3 - <<'PY'
from pathlib import Path
import re
origin = Path('origin-newsroom.html').read_text()
live = Path('live-newsroom.html').read_text()
pattern = r'<script src="/news/agroai-news-card-restore\.js" defer data-agroai-news-card-restoration="exact-native-grid-v2"></script>'
clean, count = re.subn(pattern, '', live, count=1)
if count != 1:
    raise SystemExit('Expected exactly one managed newsroom script tag')
if clean != origin:
    raise SystemExit('Native newsroom markup changed beyond the managed script tag')
PY
              echo "native_newsroom_markup=unchanged"
              echo "three_managed_news_cards=loaded"
              exit 0
            fi
            sleep 5
          done

          echo "Native newsroom and card restoration did not verify"
          cat live-newsroom.headers || true
          exit 1

      - name: Prove Platform API article and assets live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            bust="$(date +%s)-${attempt}"
            article_status="$(curl -sS -L -H 'Cache-Control: no-cache' -D platform.headers -o platform.html -w '%{http_code}' --max-time 25 "${PLATFORM_ARTICLE_URL}?verify=${bust}" || true)"
            cover_status="$(curl -sS -L -H 'Cache-Control: no-cache' -D platform-cover.headers -o platform-cover.svg -w '%{http_code}' --max-time 25 "${PLATFORM_COVER_URL}?verify=${bust}" || true)"
            logo_status="$(curl -sS -L -H 'Cache-Control: no-cache' -D platform-logo.headers -o platform-logo.bin -w '%{http_code}' --max-time 25 "${PLATFORM_LOGO_URL}?verify=${bust}" || true)"

            if [ "$article_status" = "200" ] && [ "$cover_status" = "200" ] && [ "$logo_status" = "200" ] && \
               grep -F "AGRO-AI launches the Platform API for agriculture builders" platform.html >/dev/null && \
               grep -F "Build agricultural products on the AGRO-AI intelligence layer." platform.html >/dev/null && \
               ! grep -F "Article not found" platform.html >/dev/null && \
               grep -Fi 'content-type: image/svg+xml' platform-cover.headers >/dev/null && \
               grep -Fi 'x-agroai-asset-source: reviewed-platform-api-cover' platform-cover.headers >/dev/null && \
               grep -Fi 'x-agroai-asset-source: official-repository-logo' platform-logo.headers >/dev/null; then
              echo "platform_api_article=verified_live"
              exit 0
            fi
            sleep 5
          done

          echo "Platform API article did not verify live"
          cat platform.headers || true
          head -80 platform.html || true
          cat platform-cover.headers || true
          cat platform-logo.headers || true
          exit 1

      - name: Prove existing John Deere article remains live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            bust="$(date +%s)-${attempt}"
            article_status="$(curl -sS -L -H 'Cache-Control: no-cache' -D deere.headers -o deere.html -w '%{http_code}' --max-time 25 "${JOHN_DEERE_ARTICLE_URL}?verify=${bust}" || true)"
            cover_status="$(curl -sS -L -H 'Cache-Control: no-cache' -D deere-cover.headers -o deere-cover.webp -w '%{http_code}' --max-time 25 "${JOHN_DEERE_COVER_URL}?verify=${bust}" || true)"
            if [ "$article_status" = "200" ] && [ "$cover_status" = "200" ] && \
               grep -F "AGRO-AI connects with John Deere Operations Center™" deere.html >/dev/null && \
               grep -Fi 'x-agroai-asset-source: reviewed-john-deere-cover' deere-cover.headers >/dev/null; then
              echo "john_deere_article=verified_live"
              exit 0
            fi
            sleep 5
          done
          echo "John Deere article regression check failed"
          exit 1

      - name: Prove existing Field Intelligence article remains live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            article_status="$(curl -sS -L -o field.html -w '%{http_code}' --max-time 25 "${FIELD_ARTICLE_URL}?verify=${attempt}" || true)"
            cover_status="$(curl -sS -L -D field-cover.headers -o field-cover.bin -w '%{http_code}' --max-time 25 "${FIELD_COVER_URL}?verify=${attempt}" || true)"
            logo_status="$(curl -sS -L -o field-logo.bin -w '%{http_code}' --max-time 25 "${FIELD_LOGO_URL}?verify=${attempt}" || true)"
            if [ "$article_status" = "200" ] && [ "$cover_status" = "200" ] && [ "$logo_status" = "200" ] && \
               grep -F "Introducing AGRO-AI Field Intelligence" field.html >/dev/null && \
               grep -F "GiM6WZY0HG0" field.html >/dev/null && \
               grep -Fi 'x-agroai-cover-target: 3840x2160' field-cover.headers >/dev/null; then
              echo "field_intelligence_article=verified_live"
              exit 0
            fi
            sleep 5
          done
          echo "Field Intelligence article regression check failed"
          exit 1

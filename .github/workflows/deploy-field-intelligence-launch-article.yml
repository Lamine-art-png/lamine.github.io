name: Deploy News Articles

on:
  push:
    branches: ["main"]
    paths:
      - "client/public/news/introducing-agro-ai-field-intelligence/**"
      - "client/public/news/agro-ai-connected-john-deere-operations-center/**"
      - "cloudflare/field-intelligence-launch-worker/**"
      - ".github/workflows/deploy-field-intelligence-launch-article.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agroai-news-article-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy isolated article routes
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEWSROOM_URL: https://agroai-pilot.com/news
      FIELD_ARTICLE_URL: https://agroai-pilot.com/news/introducing-agro-ai-field-intelligence
      FIELD_COVER_URL: https://agroai-pilot.com/news/introducing-agro-ai-field-intelligence/cover.webp
      FIELD_LOGO_URL: https://agroai-pilot.com/news/introducing-agro-ai-field-intelligence/agro-ai-logo.png
      JOHN_DEERE_ARTICLE_URL: https://agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center
      JOHN_DEERE_PUBLISH_AT: 2026-07-28T08:00:00-07:00
    steps:
      - uses: actions/checkout@v4

      - name: Fail closed on missing Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Validate isolated article sources and routes
        shell: bash
        run: |
          set -euo pipefail
          field_article="client/public/news/introducing-agro-ai-field-intelligence/index.html"
          john_deere_article="client/public/news/agro-ai-connected-john-deere-operations-center/index.html"
          worker="cloudflare/field-intelligence-launch-worker/src/index.ts"
          routes="cloudflare/field-intelligence-launch-worker/wrangler.toml"

          test -s "$field_article"
          test -s "$john_deere_article"
          test -s "$worker"
          test -s "$routes"

          grep -F "Introducing AGRO-AI Field Intelligence" "$field_article" >/dev/null
          grep -F "Glacial Indifference" "$field_article" >/dev/null
          grep -F "GiM6WZY0HG0" "$field_article" >/dev/null
          grep -F "AGRO-AI is now connected with John Deere Operations Center™." "$john_deere_article" >/dev/null
          grep -F '<meta name="author" content="AGRO-AI"' "$john_deere_article" >/dev/null
          grep -F "2026-07-28T08:00:00-07:00" "$john_deere_article" >/dev/null
          grep -F "Access is initiated through the user's Operations Center connection." "$john_deere_article" >/dev/null
          grep -F "AGRO-AI is now visible within Connections in John Deere Operations Center™." "$john_deere_article" >/dev/null
          grep -F "eligible AGRO-AI users can initiate the connection from the AGRO-AI integrations experience." "$john_deere_article" >/dev/null
          ! grep -Eiq "through John Deere API|partnered with John Deere|partnership with John Deere|endorsed by John Deere" "$john_deere_article"

          grep -F 'JOHN_DEERE_PUBLISH_AT = "2026-07-28T08:00:00-07:00"' "$worker" >/dev/null
          grep -F 'pattern = "agroai-pilot.com/news/introducing-agro-ai-field-intelligence*"' "$routes" >/dev/null
          grep -F 'pattern = "agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center"' "$routes" >/dev/null

          ! grep -F 'pattern = "agroai-pilot.com/news"' "$routes"
          ! grep -F 'pattern = "agroai-pilot.com/news/"' "$routes"
          ! grep -F "MARKETING_ORIGIN" "$worker"
          ! grep -F "newsroomResponse" "$worker"
          ! grep -F "NEWSROOM_SCRIPT" "$worker"

      - name: Validate Worker bundle
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.107.0 deploy --dry-run --config cloudflare/field-intelligence-launch-worker/wrangler.toml

      - name: Deploy isolated production article routes
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.107.0 deploy --config cloudflare/field-intelligence-launch-worker/wrangler.toml

      - name: Delete every stale newsroom interception route
        shell: bash
        run: |
          set -euo pipefail
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          api="https://api.cloudflare.com/client/v4"

          zone_response="$(curl -fsS -H "$auth_header" -H 'Content-Type: application/json' \
            "${api}/zones?name=agroai-pilot.com&account.id=${CLOUDFLARE_ACCOUNT_ID}")"
          zone_id="$(jq -r '.result[0].id // empty' <<<"$zone_response")"
          test -n "$zone_id"

          route_response="$(curl -fsS -H "$auth_header" -H 'Content-Type: application/json' \
            "${api}/zones/${zone_id}/workers/routes")"

          jq -r '.result[] | select(
              .pattern == "agroai-pilot.com/news" or
              .pattern == "agroai-pilot.com/news/" or
              .pattern == "agroai-pilot.com/news*" or
              .pattern == "agroai-pilot.com/news/*" or
              .pattern == "agroai-pilot.com/news/field-intelligence-newsroom.js" or
              .pattern == "agroai-pilot.com/news/field-intelligence-newsroom.css"
            ) | [.id, .pattern] | @tsv' <<<"$route_response" > stale-newsroom-routes.tsv

          while IFS=$'\t' read -r route_id route_pattern; do
            [ -n "${route_id:-}" ] || continue
            echo "Deleting stale route: ${route_pattern} (${route_id})"
            delete_response="$(curl -fsS -X DELETE -H "$auth_header" -H 'Content-Type: application/json' \
              "${api}/zones/${zone_id}/workers/routes/${route_id}")"
            test "$(jq -r '.success' <<<"$delete_response")" = "true"
          done < stale-newsroom-routes.tsv

          remaining_response="$(curl -fsS -H "$auth_header" -H 'Content-Type: application/json' \
            "${api}/zones/${zone_id}/workers/routes")"
          remaining="$(jq -r '.result[] | select(
              .pattern == "agroai-pilot.com/news" or
              .pattern == "agroai-pilot.com/news/" or
              .pattern == "agroai-pilot.com/news*" or
              .pattern == "agroai-pilot.com/news/*" or
              .pattern == "agroai-pilot.com/news/field-intelligence-newsroom.js" or
              .pattern == "agroai-pilot.com/news/field-intelligence-newsroom.css"
            ) | .pattern' <<<"$remaining_response")"
          test -z "$remaining"

      - name: Prove the native newsroom is restored
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            cache_buster="$(date +%s)-${attempt}"
            status="$(curl -sS -L -H 'Cache-Control: no-cache' -D newsroom.headers \
              -o newsroom.html -w '%{http_code}' --max-time 25 "${NEWSROOM_URL}?restore=${cache_buster}" || true)"
            bytes="$(wc -c < newsroom.html 2>/dev/null || echo 0)"
            if [ "$status" = "200" ] && [ "$bytes" -gt 1000 ] && \
               grep -Eiq '<!doctype html|<html' newsroom.html && \
               ! grep -Fxq 'Not found' newsroom.html && \
               ! grep -Fi 'x-agroai-newsroom-field-intelligence: visible' newsroom.headers >/dev/null; then
              echo "native_newsroom=verified_live"
              echo "newsroom_bytes=${bytes}"
              exit 0
            fi
            sleep 5
          done
          echo "Native newsroom was not restored"
          echo "status=${status:-unknown}"
          cat newsroom.headers || true
          head -c 500 newsroom.html || true
          exit 1

      - name: Prove scheduled Operations Center publication gate
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -D john-deere.headers -o john-deere.html -w '%{http_code}' --max-time 25 "${JOHN_DEERE_ARTICLE_URL}" || true)"
          now_epoch="$(date -u +%s)"
          publish_epoch="$(date -u -d '2026-07-28T15:00:00Z' +%s)"
          if [ "$now_epoch" -lt "$publish_epoch" ]; then
            test "$status" = "404"
            grep -Fi "x-agroai-scheduled-publication: ${JOHN_DEERE_PUBLISH_AT}" john-deere.headers >/dev/null
            grep -Fi "x-robots-tag: noindex, nofollow" john-deere.headers >/dev/null
          else
            test "$status" = "200"
            grep -F "AGRO-AI is now connected with John Deere Operations Center™." john-deere.html >/dev/null
            grep -F '<meta name="author" content="AGRO-AI"' john-deere.html >/dev/null
          fi

      - name: Prove existing Field Intelligence article remains healthy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            article_status="$(curl -sS -L -o field-article.html -w '%{http_code}' --max-time 25 "${FIELD_ARTICLE_URL}" || true)"
            cover_status="$(curl -sS -L -D field-cover.headers -o field-cover.bin -w '%{http_code}' --max-time 25 "${FIELD_COVER_URL}" || true)"
            logo_status="$(curl -sS -L -D field-logo.headers -o field-logo.bin -w '%{http_code}' --max-time 25 "${FIELD_LOGO_URL}" || true)"
            if [ "$article_status" = "200" ] && [ "$cover_status" = "200" ] && [ "$logo_status" = "200" ] && \
               grep -F "Introducing AGRO-AI Field Intelligence" field-article.html >/dev/null && \
               grep -F "GiM6WZY0HG0" field-article.html >/dev/null && \
               grep -Fi "x-agroai-cover-target: 3840x2160" field-cover.headers >/dev/null && \
               grep -Fi "x-agroai-logo-source: official-repository-asset" field-logo.headers >/dev/null; then
              echo "isolated_article_routes=verified_live"
              exit 0
            fi
            sleep 5
          done
          echo "Article routes did not become healthy"
          exit 1

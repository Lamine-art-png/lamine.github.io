name: AWS Marketplace Integration Contract CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'agroai_api/app/**/aws_marketplace*.py'
      - 'agroai_api/app/core/config.py'
      - 'agroai_api/requirements.txt'
      - 'agroai_api/app/models/aws_marketplace.py'
      - 'agroai_api/alembic/versions/043_aws_marketplace_registration.py'
      - 'agroai_api/alembic/versions/044_aws_marketplace_linking.py'
      - 'agroai_api/alembic/versions/046_aws_marketplace_plan_mapping.py'
      - 'agroai_api/scripts/process_aws_marketplace_events.py'
      - 'agroai_api/scripts/reconcile_aws_marketplace.py'
      - 'agroai_api/scripts/bootstrap_aws_marketplace_oidc.sh'
      - 'agroai_api/app/api/v1/platform_billing.py'
      - 'agroai_api/app/platform_api/programs.py'
      - 'agroai_api/app/platform_api/deps.py'
      - 'agroai_api/tests/unit/test_aws_marketplace*'
      - 'agroai_api/deploy/aws-marketplace-events.yaml'
      - '.github/workflows/aws-marketplace-contract-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  marketplace-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agroai_api
    env:
      DATABASE_URL: 'sqlite://'
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install pytest boto3==1.43.108 fastapi==0.109.0 pydantic==2.5.3 pydantic-settings==2.1.0 sqlalchemy==2.0.25 httpx==0.26.0 slowapi==0.1.9 email-validator==2.1.0.post1 alembic==1.13.1 python-jose==3.3.0 passlib==1.7.4 bcrypt==4.0.1 prometheus-client==0.19.0 stripe==8.11.0 python-multipart==0.0.6 redis==5.0.1 cryptography==44.0.3 apscheduler==3.10.4
      - name: Verify registration, license lifecycle and revision contracts
        run: python -m pytest --confcutdir=tests/unit tests/unit/test_aws_marketplace_identity.py tests/unit/test_aws_marketplace_registration.py tests/unit/test_aws_marketplace_events.py tests/unit/test_aws_marketplace_worker.py tests/unit/test_aws_marketplace_runtime_worker.py tests/unit/test_aws_marketplace_reconciliation.py tests/unit/test_alembic_revision_contract.py -q
      - name: Validate AWS OIDC bootstrap shell
        run: bash -n scripts/bootstrap_aws_marketplace_oidc.sh
      - name: Scan for committed secrets
        working-directory: .
        run: python agroai_api/scripts/scan_repository_secrets.py

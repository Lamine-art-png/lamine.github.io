name: AWS Marketplace Integration Contract CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'agroai_api/app/**/aws_marketplace*.py'
      - 'agroai_api/app/core/config.py'
      - 'agroai_api/requirements.txt'
      - 'agroai_api/app/models/aws_marketplace.py'
      - 'agroai_api/alembic/versions/042_aws_marketplace_registration.py'
      - 'agroai_api/scripts/process_aws_marketplace_events.py'
      - 'agroai_api/tests/unit/test_aws_marketplace*'
      - 'agroai_api/deploy/aws-marketplace-events.yaml'
      - '.github/workflows/aws-marketplace-contract-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  marketplace-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agroai_api
    env:
      DATABASE_URL: 'sqlite://'
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install pytest boto3==1.43.108 fastapi==0.109.0 pydantic==2.5.3 pydantic-settings==2.1.0 sqlalchemy==2.0.25 httpx==0.26.0 slowapi==0.1.9 email-validator==2.1.0.post1
      - name: Verify registration, license lifecycle and revision contracts
        run: python -m pytest --confcutdir=tests/unit tests/unit/test_aws_marketplace_identity.py tests/unit/test_aws_marketplace_registration.py tests/unit/test_aws_marketplace_events.py tests/unit/test_aws_marketplace_worker.py tests/unit/test_alembic_revision_contract.py -q
      - name: Scan for committed secrets
        working-directory: .
        run: python agroai_api/scripts/scan_repository_secrets.py

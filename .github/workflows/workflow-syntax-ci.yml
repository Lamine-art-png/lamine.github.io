name: Workflow Syntax CI

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install verified actionlint release
        shell: bash
        run: |
          set -euo pipefail
          archive=actionlint_1.7.12_linux_amd64.tar.gz
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
      - name: Validate every workflow and GitHub expression
        shell: bash
        run: '"${RUNNER_TEMP}/actionlint" -shellcheck="" -pyflakes=""'

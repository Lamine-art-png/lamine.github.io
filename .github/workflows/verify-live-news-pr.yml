name: Verify Live News Production

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/live-news-verification-trigger"

permissions:
  contents: read

concurrency:
  group: agroai-news-live-verification
  cancel-in-progress: true

jobs:
  verify:
    name: Deploy and verify live newsroom
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEWSROOM_URL: https://agroai-pilot.com/news
      NEWSROOM_ORIGIN_URL: https://agroai-343.pages.dev/news
      NEWSROOM_SCRIPT_URL: https://agroai-pilot.com/news/agroai-news-card-restore.js
      FIELD_ARTICLE_URL: https://agroai-pilot.com/news/introducing-agro-ai-field-intelligence
      FIELD_COVER_URL: https://agroai-pilot.com/news/introducing-agro-ai-field-intelligence/cover.webp
      JOHN_DEERE_ARTICLE_URL: https://agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center
      JOHN_DEERE_COVER_URL: https://agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center/cover.webp
    steps:
      - uses: actions/checkout@v4

      - name: Require production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Deploy current production Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.107.0 deploy --config cloudflare/field-intelligence-launch-worker/wrangler.toml

      - name: Verify native newsroom and restoration script
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            bust="$(date +%s)-${attempt}"
            origin_status="$(curl -sS -L -H 'Cache-Control: no-cache' -o origin.html -w '%{http_code}' --max-time 25 "${NEWSROOM_ORIGIN_URL}?verify=${bust}" || true)"
            live_status="$(curl -sS -L -H 'Cache-Control: no-cache' -D live.headers -o live.html -w '%{http_code}' --max-time 25 "${NEWSROOM_URL}?verify=${bust}" || true)"
            script_status="$(curl -sS -L -H 'Cache-Control: no-cache' -o restore.js -w '%{http_code}' --max-time 25 "${NEWSROOM_SCRIPT_URL}?verify=${bust}" || true)"
            if [ "$origin_status" = "200" ] && [ "$live_status" = "200" ] && [ "$script_status" = "200" ] && \
               grep -Fi 'x-agroai-newsroom-source: native-pages-origin' live.headers >/dev/null && \
               grep -F 'agroai-news-card-restore.js' live.html >/dev/null && \
               grep -F 'Introducing AGRO-AI Field Intelligence' restore.js >/dev/null && \
               grep -F 'AGRO-AI connects with John Deere Operations Center™' restore.js >/dev/null; then
              python3 - <<'PY'
from pathlib import Path
import re
origin = Path('origin.html').read_text()
live = Path('live.html').read_text()
clean = re.sub(r'<script src="/news/agroai-news-card-restore\.js" defer data-agroai-news-card-restoration="true"></script>', '', live, count=1)
if clean != origin:
    raise SystemExit('Native newsroom markup differs beyond the single restoration script tag')
PY
              echo "NEWSROOM_OK"
              exit 0
            fi
            sleep 5
          done
          echo "NEWSROOM_FAILED"
          cat live.headers || true
          exit 1

      - name: Verify reviewed John Deere article and supplied cover
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            bust="$(date +%s)-${attempt}"
            article_status="$(curl -sS -L -H 'Cache-Control: no-cache' -D jd.headers -o jd.html -w '%{http_code}' --max-time 25 "${JOHN_DEERE_ARTICLE_URL}?verify=${bust}" || true)"
            cover_status="$(curl -sS -L -H 'Cache-Control: no-cache' -D jd-cover.headers -o jd-cover.webp -w '%{http_code}' --max-time 25 "${JOHN_DEERE_COVER_URL}?verify=${bust}" || true)"
            if [ "$article_status" = "200" ] && [ "$cover_status" = "200" ] && \
               grep -F 'AGRO-AI connects with John Deere Operations Center™' jd.html >/dev/null && \
               grep -F 'Agricultural operations do not suffer from a shortage of data.' jd.html >/dev/null && \
               grep -F "Access is initiated through the user's Operations Center connection." jd.html >/dev/null && \
               grep -F '<meta name="author" content="AGRO-AI"' jd.html >/dev/null && \
               grep -Fi 'content-type: image/webp' jd-cover.headers >/dev/null && \
               grep -Fi 'x-agroai-asset-source: reviewed-john-deere-cover' jd-cover.headers >/dev/null; then
              test "$(wc -c < jd-cover.webp)" -gt 10000
              echo "JOHN_DEERE_OK"
              exit 0
            fi
            sleep 5
          done
          echo "JOHN_DEERE_FAILED"
          cat jd.headers || true
          cat jd-cover.headers || true
          exit 1

      - name: Verify Field Intelligence article and cover
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            article_status="$(curl -sS -L -o field.html -w '%{http_code}' --max-time 25 "${FIELD_ARTICLE_URL}?verify=${attempt}" || true)"
            cover_status="$(curl -sS -L -D field-cover.headers -o field-cover.bin -w '%{http_code}' --max-time 25 "${FIELD_COVER_URL}?verify=${attempt}" || true)"
            if [ "$article_status" = "200" ] && [ "$cover_status" = "200" ] && \
               grep -F 'Introducing AGRO-AI Field Intelligence' field.html >/dev/null && \
               grep -F 'GiM6WZY0HG0' field.html >/dev/null && \
               grep -Fi 'x-agroai-cover-target: 3840x2160' field-cover.headers >/dev/null; then
              echo "FIELD_INTELLIGENCE_OK"
              exit 0
            fi
            sleep 5
          done
          echo "FIELD_INTELLIGENCE_FAILED"
          exit 1

name: Field Intelligence Canonical Context Fix

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: field-intelligence-canonical-context-fix
  cancel-in-progress: false

jobs:
  patch-test-commit:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 405 &&
      github.event.comment.user.login == 'Lamine-art-png' &&
      contains(github.event.comment.body, '/fix-fi-context')
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Announce guarded run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/issues/405/comments -f body="Field Intelligence canonical context fix started. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: actions/checkout@v4
        with:
          ref: fix/field-intelligence-canonical-context
          fetch-depth: 0

      - name: Apply deterministic canonical fix
        run: python3 scripts/fix_field_intelligence_canonical_context.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: figma-enterprise-v4/package-lock.json

      - name: Install exact portal dependencies
        working-directory: figma-enterprise-v4
        run: npm ci --no-audit --no-fund

      - name: Verify canonical Field Intelligence contracts
        working-directory: figma-enterprise-v4
        run: |
          node tests/field-intelligence-canonical-context-contract.mjs
          npm run test:field-intelligence
          npm run test:i18n

      - name: Build exact production portal
        working-directory: figma-enterprise-v4
        env:
          VITE_API_BASE_URL: https://api.agroai-pilot.com
          VITE_DEPLOYMENT_ENVIRONMENT: production
        run: npm run build

      - name: Commit verified product changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/fix_field_intelligence_canonical_context.py
          git add figma-enterprise-v4/src/app/components/FieldIntelligenceV2.tsx \
                  figma-enterprise-v4/src/app/components/Intelligence.tsx \
                  figma-enterprise-v4/tests/field-intelligence-canonical-context-contract.mjs \
                  scripts/fix_field_intelligence_canonical_context.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make Field Intelligence context and task actions canonical"
          git push origin HEAD:fix/field-intelligence-canonical-context

      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          gh api repos/${{ github.repository }}/issues/405/comments -f body="✅ Canonical Field Intelligence context/task gates passed and verified product changes were committed at \`${head_sha}\`. Ask AGRO-AI now carries the exact observation directly in the route and intelligence request, and task creation shows the returned linked task."

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/issues/405/comments -f body="❌ Canonical Field Intelligence context fix failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

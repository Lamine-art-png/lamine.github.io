name: Deploy and Prove Platform API Edge

on:
  push:
    branches:
      - main
    paths:
      - wrangler.toml
      - cloudflare/edge-gateway/src/index.ts
      - cloudflare/edge-gateway/src/edge-main-v3.ts
      - cloudflare/edge-gateway/src/queue-policy.ts
      - .github/workflows/deploy-platform-api-edge.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: platform-api-edge-production
  cancel-in-progress: true

jobs:
  deploy-and-prove:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EVIDENCE_ISSUE: "359"
      EXPECTED_EDGE_VERSION: cloudflare-edge-v1
      CF_API: https://api.cloudflare.com/client/v4
      ZONE_NAME: agroai-pilot.com
      API_HOST: api.agroai-pilot.com
      WORKER_SERVICE: agroai-api-edge

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/edge-gateway/package-lock.json

      - name: Record edge migration start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${EVIDENCE_ISSUE}/comments" \
            -f body="Platform API edge migration started for release \`${GITHUB_SHA}\`. The API hostname will move from the legacy origin CNAME boundary to the \`agroai-api-edge\` Worker Custom Domain with automatic rollback protection."

      - name: Validate exact Worker bundle
        working-directory: cloudflare/edge-gateway
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check

      - name: Fail closed on missing Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Back up and remove only the legacy API DNS record
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')

          curl --fail --silent --show-error "${auth[@]}" \
            "${CF_API}/zones?name=${ZONE_NAME}&account.id=${CLOUDFLARE_ACCOUNT_ID}&status=active" \
            -o zones.json
          zone_id="$(jq -er '.result | map(select(.name == env.ZONE_NAME and .status == "active")) | first | .id' zones.json)"
          echo "ZONE_ID=${zone_id}" >> "$GITHUB_ENV"

          curl --fail --silent --show-error "${auth[@]}" \
            "${CF_API}/zones/${zone_id}/dns_records?name=${API_HOST}&per_page=100" \
            -o api-dns-backup.json
          curl --fail --silent --show-error "${auth[@]}" \
            "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -o worker-domains-before.json

          domain_owner="$(jq -r --arg host "$API_HOST" '.result[]? | select(.hostname == $host) | .service // empty' worker-domains-before.json | head -1)"
          if [ -n "$domain_owner" ] && [ "$domain_owner" != "$WORKER_SERVICE" ]; then
            echo "Refusing migration: ${API_HOST} is already attached to Worker service ${domain_owner}" >&2
            exit 78
          fi

          dns_count="$(jq -r '.result | length' api-dns-backup.json)"
          if [ "$dns_count" -gt 1 ]; then
            echo "Refusing migration: multiple DNS records exist at ${API_HOST}" >&2
            jq '{result:[.result[]|{id,type,name,content,proxied}]}' api-dns-backup.json
            exit 78
          fi

          if [ "$domain_owner" = "$WORKER_SERVICE" ]; then
            echo "API Custom Domain already belongs to ${WORKER_SERVICE}; no DNS deletion required."
            echo "API_DNS_REMOVED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ "$dns_count" -eq 1 ]; then
            record_id="$(jq -er '.result[0].id' api-dns-backup.json)"
            record_type="$(jq -er '.result[0].type' api-dns-backup.json)"
            case "$record_type" in
              CNAME|A|AAAA) ;;
              *) echo "Refusing migration: unsupported API DNS type ${record_type}" >&2; exit 78 ;;
            esac
            curl --fail --silent --show-error "${auth[@]}" -X DELETE \
              "${CF_API}/zones/${zone_id}/dns_records/${record_id}" \
              -o dns-delete-result.json
            jq -e '.success == true' dns-delete-result.json >/dev/null
            echo "API_DNS_REMOVED=true" >> "$GITHUB_ENV"
          else
            echo "API_DNS_REMOVED=false" >> "$GITHUB_ENV"
          fi

      - name: Deploy Worker and establish the API Custom Domain
        working-directory: cloudflare/edge-gateway
        run: |
          set -euo pipefail
          npx wrangler deploy --config ../../wrangler.toml

      - name: Prove edge health on every production hostname
        shell: bash
        run: |
          set -euo pipefail
          : > edge-hosts.jsonl
          for host in api.agroai-pilot.com platform.agroai-pilot.com app.agroai-pilot.com; do
            ready=0
            for attempt in $(seq 1 100); do
              status="$(curl --silent --show-error --max-time 25 -D headers.txt -o body.json -w '%{http_code}' \
                "https://${host}/v1/edge-health" || true)"
              marker="$(tr -d '\r' < headers.txt | sed -n 's/^x-agroai-edge:[[:space:]]*//Ip' | head -1)"
              if [ "$status" = "200" ] \
                && [ "$marker" = "$EXPECTED_EDGE_VERSION" ] \
                && jq -e '.status == "ok" and .service == "agroai-api-edge"' body.json >/dev/null 2>&1; then
                jq -nc --arg host "$host" --arg status "$status" --arg marker "$marker" \
                  '{host:$host,edge_health_status:$status,edge_version:$marker}' >> edge-hosts.jsonl
                ready=1
                break
              fi
              sleep 3
            done
            if [ "$ready" -ne 1 ]; then
              echo "Edge health did not converge for ${host}"
              cat headers.txt || true
              cat body.json || true
              exit 1
            fi
          done

      - name: Prove public Platform API pricing on every hostname
        shell: bash
        run: |
          set -euo pipefail
          : > pricing-hosts.jsonl
          for host in api.agroai-pilot.com platform.agroai-pilot.com app.agroai-pilot.com; do
            status="$(curl --silent --show-error --max-time 30 -D headers.txt -o pricing.json -w '%{http_code}' \
              "https://${host}/v1/platform/pricing" || true)"
            marker="$(tr -d '\r' < headers.txt | sed -n 's/^x-agroai-edge:[[:space:]]*//Ip' | head -1)"
            test "$status" = "200"
            test "$marker" = "$EXPECTED_EDGE_VERSION"
            HOST="$host" STATUS="$status" MARKER="$marker" python3 - <<'PY'
          import json
          import os
          value = json.load(open("pricing.json", encoding="utf-8"))
          assert value.get("catalog_version") == "2026-07-provisional", value
          plans = {item.get("identifier"): item for item in value.get("plans", [])}
          expected = {
              "developer": (14900, 143000, 250000, 75),
              "scale": (74900, 719000, 2000000, 35),
          }
          for identifier, contract in expected.items():
              plan = plans.get(identifier)
              assert plan, f"missing {identifier}"
              actual = (
                  plan.get("monthly_price_cents"),
                  plan.get("annual_price_cents"),
                  plan.get("included_credits"),
                  plan.get("overage_price_per_1000_cents"),
              )
              assert actual == contract, (identifier, actual, contract)
          with open("pricing-hosts.jsonl", "a", encoding="utf-8") as handle:
              handle.write(json.dumps({
                  "host": os.environ["HOST"],
                  "pricing_status": os.environ["STATUS"],
                  "edge_version": os.environ["MARKER"],
                  "plans": sorted(plans),
              }, sort_keys=True) + "\n")
          PY
          done

      - name: Prove Stripe webhook route and signature boundary
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 30 -D webhook-headers.txt -o webhook-body.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' --data '{}' \
            'https://api.agroai-pilot.com/v1/platform/billing/stripe-webhook' || true)"
          marker="$(tr -d '\r' < webhook-headers.txt | sed -n 's/^x-agroai-edge:[[:space:]]*//Ip' | head -1)"
          test "$status" = "400"
          test "$marker" = "$EXPECTED_EDGE_VERSION"

      - name: Prove API Custom Domain ownership
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -o worker-domains-after.json
          jq -e --arg host "$API_HOST" --arg service "$WORKER_SERVICE" \
            '.result[] | select(.hostname == $host and .service == $service)' \
            worker-domains-after.json >/dev/null

      - name: Roll back the legacy DNS only if the API Custom Domain is not healthy
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 20 -D rollback-probe.headers -o rollback-probe.body -w '%{http_code}' \
            "https://${API_HOST}/v1/edge-health" || true)"
          marker="$(tr -d '\r' < rollback-probe.headers | sed -n 's/^x-agroai-edge:[[:space:]]*//Ip' | head -1)"
          if [ "$status" = "200" ] && [ "$marker" = "$EXPECTED_EDGE_VERSION" ]; then
            echo "API Custom Domain is healthy; preserving it despite a later proof failure."
            exit 0
          fi

          if [ "${API_DNS_REMOVED:-false}" != "true" ] || [ ! -s api-dns-backup.json ]; then
            echo "No legacy DNS record was removed; nothing to restore."
            exit 0
          fi

          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          curl --silent --show-error "${auth[@]}" \
            "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -o rollback-domains.json
          domain_id="$(jq -r --arg host "$API_HOST" --arg service "$WORKER_SERVICE" \
            '.result[]? | select(.hostname == $host and .service == $service) | .id // empty' \
            rollback-domains.json | head -1)"
          if [ -n "$domain_id" ]; then
            curl --fail --silent --show-error "${auth[@]}" -X DELETE \
              "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains/${domain_id}" \
              -o rollback-domain-delete.json
          fi

          current_count="$(curl --fail --silent --show-error "${auth[@]}" \
            "${CF_API}/zones/${ZONE_ID}/dns_records?name=${API_HOST}&per_page=100" | jq -r '.result | length')"
          if [ "$current_count" -eq 0 ]; then
            jq '.result[0] | {type,name,content,ttl,proxied,comment} | with_entries(select(.value != null))' \
              api-dns-backup.json > rollback-dns-payload.json
            curl --fail --silent --show-error "${auth[@]}" -X POST \
              --data @rollback-dns-payload.json \
              "${CF_API}/zones/${ZONE_ID}/dns_records" \
              -o rollback-dns-create.json
            jq -e '.success == true' rollback-dns-create.json >/dev/null
            echo "Legacy API DNS record restored after failed migration."
          fi

      - name: Record edge deployment success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${EVIDENCE_ISSUE}/comments" \
            -f body="✅ **Platform API production edge GREEN**\n\n- edge release: \`${GITHUB_SHA}\`\n- \`api.agroai-pilot.com\` is owned by the \`agroai-api-edge\` Worker Custom Domain\n- \`api.agroai-pilot.com/v1/*\`: green\n- \`platform.agroai-pilot.com/v1/*\`: green\n- \`app.agroai-pilot.com/v1/*\`: green\n- Developer and Scale pricing returned correctly on all three hosts\n- Stripe webhook reached the backend and rejected an unsigned request with HTTP 400\n- legacy direct-to-Render API routing is removed"

      - name: Record edge deployment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${EVIDENCE_ISSUE}/comments" \
            -f body="❌ Platform API API-host Custom Domain migration/proof failed for release \`${GITHUB_SHA}\`. Automatic rollback protection ran. Review Actions run \`${GITHUB_RUN_ID}\`; public billing remains unconfirmed until the proof passes."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-api-edge-proof-${{ github.sha }}
          path: |
            zones.json
            api-dns-backup.json
            worker-domains-before.json
            worker-domains-after.json
            dns-delete-result.json
            edge-hosts.jsonl
            pricing-hosts.jsonl
            headers.txt
            body.json
            pricing.json
            webhook-headers.txt
            webhook-body.json
            rollback-probe.headers
            rollback-probe.body
            rollback-domains.json
            rollback-domain-delete.json
            rollback-dns-payload.json
            rollback-dns-create.json
          if-no-files-found: ignore
          retention-days: 30

name: Deploy and Prove Platform API Edge

on:
  push:
    branches:
      - main
    paths:
      - wrangler.toml
      - cloudflare/edge-gateway/src/index.ts
      - cloudflare/edge-gateway/src/edge-main-v3.ts
      - cloudflare/edge-gateway/src/queue-policy.ts
      - agroai_api/start-production.sh
      - .github/workflows/deploy-platform-api-edge.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: platform-api-edge-production
  cancel-in-progress: true

jobs:
  deploy-and-prove:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EVIDENCE_ISSUE: "359"
      EXPECTED_EDGE_VERSION: cloudflare-edge-v1
      BACKEND_ORIGIN: https://api-preview.agroai-pilot.com

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the exact Render release expected from this commit
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(bash .github/scripts/resolve-backend-release-sha.sh)"
          test -n "$expected_sha"
          echo "EXPECTED_BACKEND_SHA=${expected_sha}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/edge-gateway/package-lock.json

      - name: Record deployment start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${EVIDENCE_ISSUE}/comments" \
            -f body="Platform API production boundary verification started for release \`${GITHUB_SHA}\`. Expected Render backend: \`${EXPECTED_BACKEND_SHA}\`. The canonical app, developer-console, and machine API Worker routes will be deployed before the exact backend release is proven."

      - name: Validate exact Worker bundle
        working-directory: cloudflare/edge-gateway
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check

      - name: Fail closed on missing Worker credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Deploy the canonical app, developer-console, and machine API routes
        working-directory: cloudflare/edge-gateway
        run: |
          set -euo pipefail
          npx wrangler deploy --config ../../wrangler.toml

      - name: Wait for the exact Render backend release
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 120); do
            code="$(curl --silent --show-error --max-time 40 -o backend-health.json -w '%{http_code}' \
              "${BACKEND_ORIGIN}/v1/health" || true)"
            if [ "$code" = "200" ] && EXPECTED="$EXPECTED_BACKEND_SHA" python3 - <<'PY'
          import json
          import os
          value = json.load(open("backend-health.json", encoding="utf-8"))
          assert value.get("status") == "ok", value
          assert value.get("build_sha") == os.environ["EXPECTED"], value
          PY
            then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1

      - name: Prove Worker routes
        shell: bash
        run: |
          set -euo pipefail
          : > edge-hosts.jsonl
          for host in app.agroai-pilot.com platform.agroai-pilot.com; do
            ready=0
            for attempt in $(seq 1 100); do
              code="$(curl --silent --show-error --max-time 30 -D headers.txt -o body.json -w '%{http_code}' \
                "https://${host}/v1/edge-health" || true)"
              marker="$(tr -d '\r' < headers.txt | sed -n 's/^x-agroai-edge:[[:space:]]*//Ip' | head -1)"
              if [ "$code" = "200" ] \
                && [ "$marker" = "$EXPECTED_EDGE_VERSION" ] \
                && jq -e '.status == "ok" and .service == "agroai-api-edge"' body.json >/dev/null 2>&1; then
                jq -nc --arg host "$host" --arg code "$code" --arg marker "$marker" \
                  '{host:$host,http_status:$code,edge_version:$marker}' >> edge-hosts.jsonl
                ready=1
                break
              fi
              sleep 3
            done
            test "$ready" -eq 1
          done

      - name: Prove live pricing through every supported customer origin
        shell: bash
        run: |
          set -euo pipefail
          : > pricing-hosts.jsonl
          for host in api.agroai-pilot.com app.agroai-pilot.com platform.agroai-pilot.com; do
            ready=0
            for attempt in $(seq 1 120); do
              code="$(curl --silent --show-error --max-time 40 -D headers.txt -o pricing.json -w '%{http_code}' \
                "https://${host}/v1/platform/pricing" || true)"
              if [ "$code" = "200" ] && HOST="$host" python3 - <<'PY'
          import json
          value = json.load(open("pricing.json", encoding="utf-8"))
          assert value.get("catalog_version") == "2026-07-provisional", value
          plans = {item.get("identifier"): item for item in value.get("plans", [])}
          expected = {
              "developer": (14900, 143000, 250000, 75),
              "scale": (74900, 719000, 2000000, 35),
          }
          for identifier, contract in expected.items():
              plan = plans.get(identifier)
              assert plan, f"missing {identifier}"
              assert plan.get("status") == "private_preview", plan
              assert plan.get("overages_allowed") is True, plan
              actual = (
                  plan.get("monthly_price_cents"),
                  plan.get("annual_price_cents"),
                  plan.get("included_credits"),
                  plan.get("overage_price_per_1000_cents"),
              )
              assert actual == contract, (identifier, actual, contract)
          PY
              then
                marker="$(tr -d '\r' < headers.txt | sed -n 's/^x-agroai-edge:[[:space:]]*//Ip' | head -1)"
                runtime="$(tr -d '\r' < headers.txt | sed -n 's/^x-agroai-runtime:[[:space:]]*//Ip' | head -1)"
                jq -nc --arg host "$host" --arg code "$code" --arg marker "$marker" --arg runtime "$runtime" \
                  '{host:$host,http_status:$code,edge_version:$marker,runtime:$runtime}' >> pricing-hosts.jsonl
                ready=1
                break
              fi
              sleep 5
            done
            test "$ready" -eq 1
          done

      - name: Prove public API exact release, readiness, and webhook boundary
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 120); do
            health_code="$(curl --silent --show-error --max-time 40 -o public-health.json -w '%{http_code}' \
              'https://api.agroai-pilot.com/v1/health' || true)"
            readiness_code="$(curl --silent --show-error --max-time 40 -o public-readiness.json -w '%{http_code}' \
              'https://api.agroai-pilot.com/v1/readiness' || true)"
            if [ "$health_code" = "200" ] && [ "$readiness_code" = "200" ] \
              && EXPECTED="$EXPECTED_BACKEND_SHA" python3 - <<'PY'
          import json
          import os
          health = json.load(open("public-health.json", encoding="utf-8"))
          readiness = json.load(open("public-readiness.json", encoding="utf-8"))
          assert health.get("status") == "ok", health
          assert health.get("build_sha") == os.environ["EXPECTED"], health
          assert readiness.get("status") == "ready", readiness
          assert (readiness.get("schema") or {}).get("ready") is True, readiness
          assert (readiness.get("production") or {}).get("ready") is True, readiness
          PY
            then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1

          webhook_code="$(curl --silent --show-error --max-time 40 -o webhook-body.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' --data '{}' \
            'https://api.agroai-pilot.com/v1/platform/billing/stripe-webhook' || true)"
          test "$webhook_code" = "400"

      - name: Record production boundary success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_sha="$(jq -r '.build_sha' public-health.json)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${EVIDENCE_ISSUE}/comments" \
            -f body="✅ **Platform API production boundary GREEN**\n\n- release commit: \`${GITHUB_SHA}\`\n- exact public backend: \`${build_sha}\`\n- \`api.agroai-pilot.com\`: health, readiness, Developer/Scale pricing, and webhook signature boundary green\n- \`app.agroai-pilot.com/v1/*\`: Cloudflare edge green\n- \`platform.agroai-pilot.com/v1/*\`: Cloudflare edge green\n- live pricing returned correctly through all three supported customer origins"

      - name: Record production boundary failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${EVIDENCE_ISSUE}/comments" \
            -f body="❌ Platform API production boundary verification failed for release \`${GITHUB_SHA}\` with expected backend \`${EXPECTED_BACKEND_SHA}\`. Review Actions run \`${GITHUB_RUN_ID}\`; do not declare the billing launch green until this proof passes."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-api-production-boundary-${{ github.sha }}
          path: |
            backend-health.json
            edge-hosts.jsonl
            pricing-hosts.jsonl
            public-health.json
            public-readiness.json
            pricing.json
            webhook-body.json
          if-no-files-found: ignore
          retention-days: 30

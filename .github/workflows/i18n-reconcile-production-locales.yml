name: Reconcile production localization readiness

# Read-only release gate. Recomputes which locales are production-ready from
# the committed catalogs, transactional catalogs and legal snapshots, and fails
# if the committed manifest/release matrix does not match. It never writes to
# the repository: generated commits pushed with GITHUB_TOKEN are attributed to
# github-actions[bot] and hold PR workflows at action_required.
on:
  pull_request:
    paths:
      - "shared/localization/**"
      - "shared/supported-locales.json"
      - "platform-api/legal/localized/**"
      - "scripts/i18n-reconcile-production-locales.py"
      - "scripts/i18n_quality.py"
      - "agroai_api/app/api/v1/auth.py"
      - "agroai_api/app/api/v1/billing.py"
      - ".github/workflows/i18n-reconcile-production-locales.yml"
  push:
    branches: ["main"]
    paths:
      - "shared/localization/**"
      - "shared/supported-locales.json"
      - "platform-api/legal/localized/**"
      - "scripts/i18n-reconcile-production-locales.py"
      - "scripts/i18n_quality.py"
      - "agroai_api/app/api/v1/auth.py"
      - "agroai_api/app/api/v1/billing.py"
      - ".github/workflows/i18n-reconcile-production-locales.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i18n-readiness-reconcile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Recompute production-ready locale set
        run: python3 scripts/i18n-reconcile-production-locales.py
      - name: Committed manifest and release matrix must match the release gate
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- shared/supported-locales.json shared/localization/release-matrix.json; then
            echo "::error::Run python3 scripts/i18n-reconcile-production-locales.py and commit the result."
            exit 1
          fi
      - name: Validate advertised static catalog contract
        working-directory: figma-enterprise-v4
        run: node tests/static-locale-catalog-contract.mjs

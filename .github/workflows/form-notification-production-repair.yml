name: Form notification production repair

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/form-notification-production-repair.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify Careers production recipient
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: agroai
      TARGET_EMAIL: contact@agroai-pilot.com
    steps:
      - uses: actions/checkout@v4

      - name: Verify corrected Cloudflare recipient binding
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl -fsS -H "$auth" -H 'Content-Type: application/json' "$api" > project.json
          jq -e --arg target "$TARGET_EMAIL" '
            .success == true and
            .result.deployment_configs.production.env_vars.APPLICATION_TO_EMAIL.type == "plain_text" and
            .result.deployment_configs.production.env_vars.APPLICATION_TO_EMAIL.value == $target and
            .result.deployment_configs.production.env_vars.RESEND_API_KEY.type == "secret_text"
          ' project.json >/dev/null
          echo 'Correct Careers recipient binding is present.'

      - name: Submit an exact live Careers application
        shell: bash
        run: |
          set -euo pipefail
          marker="careers-recipient-repair-${GITHUB_RUN_ID}"
          printf '%s\n' \
            '%PDF-1.4' \
            '1 0 obj<< /Type /Catalog /Pages 2 0 R >>endobj' \
            '2 0 obj<< /Type /Pages /Kids [3 0 R] /Count 1 >>endobj' \
            '3 0 obj<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>endobj' \
            '4 0 obj<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>endobj' \
            '5 0 obj<< /Length 98 >>stream' \
            'BT /F1 12 Tf 72 720 Td (AGRO-AI internal Careers notification diagnostic. No follow-up required.) Tj ET' \
            'endstream endobj' \
            'trailer<< /Root 1 0 R /Size 6 >>' \
            '%%EOF' > diagnostic-resume.pdf

          code="$(curl -sS --connect-timeout 10 --max-time 45 \
            -o careers-response.json -w '%{http_code}' \
            -X POST https://agroai-pilot.com/api/apply \
            -H 'accept: application/json' \
            -F 'name=AGRO-AI Careers recipient repair' \
            -F 'fullName=AGRO-AI Careers recipient repair' \
            -F 'email=contact@agroai-pilot.com' \
            -F 'role=Internal diagnostic' \
            -F 'position=Internal diagnostic' \
            -F 'location=San Francisco, California' \
            -F 'availability=Immediate' \
            -F 'eligibility=Authorized to work in the United States' \
            -F 'linkedin=https://www.linkedin.com/company/agro-ai-inc/' \
            -F 'roleContribution=Verify the production Careers application notification path end to end.' \
            -F 'proofOfWork=https://agroai-pilot.com' \
            -F "aiWorkflow=Automated internal production verification. No follow-up required. ${marker}" \
            -F 'toolsUsed=GitHub Actions and curl' \
            -F 'proudestWork=Reliable production notification delivery' \
            -F 'workingStyle=Fast, clear, reliable, and evidence driven' \
            -F 'agroAiImprovement=Ensure every application reaches contact@agroai-pilot.com' \
            -F 'whyAgroAi=Internal production verification only' \
            -F 'relevantExperience=Production delivery verification' \
            -F 'resume=@diagnostic-resume.pdf;type=application/pdf')"
          echo "HTTP ${code}"
          cat careers-response.json; echo
          test "$code" = "200"
          jq -e '.ok == true and .emailNotification.sent == true' careers-response.json >/dev/null
          echo "CAREERS_NOTIFICATION_MARKER=${marker}"

      - name: Confirm Book a Demo remains healthy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://api.agroai-pilot.com/v1/health | jq -e '.status == "ok"' >/dev/null

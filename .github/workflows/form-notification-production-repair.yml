name: Form notification production repair

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/form-notification-production-repair.yml"
      - "cloudflare/careers-notification-bridge/**"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy and verify Careers notification bridge
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: agroai
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot exact public website assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p before
          curl -fsS -L https://agroai-pilot.com/ -o before/home.html
          curl -fsS -L https://agroai-pilot.com/careers -o before/careers.html
          curl -fsS -L https://agroai-pilot.com/book-a-demo -o before/book-a-demo.html
          sha256sum before/* | sort > before.sha256
          cat before.sha256

      - name: Prepare current manifest and endpoint-only Worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          curl -fsS -H "$auth" "${api}/deployments?env=production&per_page=1" > deployments.json
          current_id="$(jq -r '.result[0].id // empty' deployments.json)"
          test -n "$current_id"
          curl -fsS -H "$auth" "${api}/deployments/${current_id}" > current.json
          jq -e '.success == true and .result.environment == "production" and (.result.files | type) == "object" and (.result.files | length) > 0' current.json >/dev/null

          origin="$(jq -r '.result.url // empty' current.json)"
          python3 - "$origin" <<'PY'
import sys
from urllib.parse import urlparse
u = urlparse(sys.argv[1])
assert u.scheme == "https"
assert u.hostname and u.hostname.endswith(".pages.dev")
assert not u.username and not u.password and not u.query and not u.fragment
PY
          jq -c '.result.files' current.json > manifest.json
          cp cloudflare/careers-notification-bridge/worker.js worker.js
          python3 - "$origin" <<'PY'
from pathlib import Path
import sys
path = Path("worker.js")
text = path.read_text()
assert text.count("__APPLICATION_ORIGIN__") == 1
path.write_text(text.replace("__APPLICATION_ORIGIN__", sys.argv[1]))
PY
          cp cloudflare/careers-notification-bridge/_routes.json _routes.json
          cp worker.js worker.mjs
          node --check worker.mjs
          jq -e '.version == 1 and .include == ["/api/apply"] and .exclude == []' _routes.json >/dev/null
          echo "CURRENT_DEPLOYMENT_ID=${current_id}" >> "$GITHUB_ENV"
          echo "APPLICATION_ORIGIN=${origin}" >> "$GITHUB_ENV"
          echo "Current manifest entries: $(jq 'length' manifest.json)"

      - name: Create production deployment with identical assets
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}/deployments"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          manifest="$(cat manifest.json)"
          response_code="$(curl -sS -X POST \
            -H "$auth" \
            -o deployment-create.json -w '%{http_code}' \
            -F 'branch=main' \
            -F 'commit_dirty=false' \
            -F "commit_hash=${GITHUB_SHA}" \
            -F 'commit_message=Activate contact inbox for Careers notifications' \
            -F 'pages_build_output_dir=.' \
            -F "manifest=${manifest}" \
            -F '_worker.js=@worker.js;type=application/javascript' \
            -F '_routes.json=@_routes.json;type=application/json' \
            "$api")"
          echo "Create deployment HTTP ${response_code}"
          if [ "$response_code" != "200" ]; then
            jq '{success, errors, messages}' deployment-create.json || cat deployment-create.json
            exit 1
          fi
          jq -e '.success == true and (.result.id | length > 0)' deployment-create.json >/dev/null
          new_id="$(jq -r '.result.id' deployment-create.json)"
          echo "NEW_DEPLOYMENT_ID=${new_id}" >> "$GITHUB_ENV"
          echo "Created deployment ${new_id} from unchanged asset manifest."

      - name: Wait for deployment and exact bridge route
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}/deployments/${NEW_DEPLOYMENT_ID}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          for attempt in $(seq 1 90); do
            curl -fsS -H "$auth" "$api" > status.json
            stage="$(jq -r '.result.latest_stage.name // empty' status.json)"
            state="$(jq -r '.result.latest_stage.status // empty' status.json)"
            echo "Attempt ${attempt}: ${stage:-unknown}/${state:-unknown}"
            if [ "$state" = "success" ]; then
              break
            fi
            if [ "$state" = "failure" ]; then
              jq '{success, errors, messages, result: {id: .result.id, latest_stage: .result.latest_stage}}' status.json
              exit 1
            fi
            sleep 5
          done
          jq -e '.result.latest_stage.status == "success" and .result.uses_functions == true' status.json >/dev/null

          ready=0
          for attempt in $(seq 1 60); do
            code="$(curl -sS --connect-timeout 10 --max-time 30 \
              -D apply.headers -o apply.json -w '%{http_code}' \
              https://agroai-pilot.com/api/apply || true)"
            if [ "$code" = "200" ] && \
               grep -Fi 'x-agroai-careers-bridge: active' apply.headers >/dev/null && \
               jq -e '.ok == true and .endpoint == "/api/apply"' apply.json >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = "1"

      - name: Prove visible website stayed byte-identical
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p after
          curl -fsS -L https://agroai-pilot.com/ -o after/home.html
          curl -fsS -L https://agroai-pilot.com/careers -o after/careers.html
          curl -fsS -L https://agroai-pilot.com/book-a-demo -o after/book-a-demo.html
          cmp before/home.html after/home.html
          cmp before/careers.html after/careers.html
          cmp before/book-a-demo.html after/book-a-demo.html
          echo 'Homepage, Careers page, and Book a Demo page are byte-identical.'

      - name: Submit live Careers application and prove notification handoff
        shell: bash
        run: |
          set -euo pipefail
          marker="careers-live-verification-${GITHUB_RUN_ID}"
          printf '%s\n' \
            '%PDF-1.4' \
            '1 0 obj<< /Type /Catalog /Pages 2 0 R >>endobj' \
            '2 0 obj<< /Type /Pages /Kids [3 0 R] /Count 1 >>endobj' \
            '3 0 obj<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>endobj' \
            '4 0 obj<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>endobj' \
            '5 0 obj<< /Length 98 >>stream' \
            'BT /F1 12 Tf 72 720 Td (AGRO-AI Careers live notification verification. No follow-up required.) Tj ET' \
            'endstream endobj' \
            'trailer<< /Root 1 0 R /Size 6 >>' \
            '%%EOF' > diagnostic-resume.pdf

          code="$(curl -sS --connect-timeout 10 --max-time 60 \
            -D careers.headers -o careers-response.json -w '%{http_code}' \
            -X POST https://agroai-pilot.com/api/apply \
            -H 'accept: application/json' \
            -F 'name=AGRO-AI Careers live verification' \
            -F 'fullName=AGRO-AI Careers live verification' \
            -F 'email=contact@agroai-pilot.com' \
            -F 'role=Internal diagnostic' \
            -F 'position=Internal diagnostic' \
            -F 'location=San Francisco, California' \
            -F 'availability=Immediate' \
            -F 'eligibility=Authorized to work in the United States' \
            -F 'linkedin=https://www.linkedin.com/company/agro-ai-inc/' \
            -F 'roleContribution=Verify the production Careers notification path.' \
            -F 'proofOfWork=https://agroai-pilot.com' \
            -F "aiWorkflow=Automated internal verification. No follow-up required. ${marker}" \
            -F 'toolsUsed=GitHub Actions and curl' \
            -F 'proudestWork=Reliable notification delivery' \
            -F 'workingStyle=Fast, clear, reliable, and evidence driven' \
            -F 'agroAiImprovement=Ensure applications reach contact@agroai-pilot.com' \
            -F 'whyAgroAi=Internal production verification only' \
            -F 'relevantExperience=Production delivery verification' \
            -F 'resume=@diagnostic-resume.pdf;type=application/pdf')"
          echo "HTTP ${code}"
          cat careers-response.json; echo
          test "$code" = "200"
          grep -Fi 'x-agroai-careers-bridge: active' careers.headers >/dev/null
          grep -Fi 'x-agroai-careers-notification: delivered' careers.headers >/dev/null
          jq -e '.ok == true' careers-response.json >/dev/null
          echo "CAREERS_LIVE_MARKER=${marker}" >> "$GITHUB_ENV"
          echo "CAREERS_LIVE_MARKER=${marker}"

      - name: Confirm Book a Demo endpoint remains healthy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://api.agroai-pilot.com/v1/health | jq -e '.status == "ok"' >/dev/null

name: Form notification production repair

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/form-notification-production-repair.yml"

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Direct Upload file manifest
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: agroai
    steps:
      - uses: actions/checkout@v4

      - name: Inspect current production file inventory without downloading assets
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl -fsS -H "$auth" "${api}/deployments?env=production&per_page=1" > deployments.json
          deployment_id="$(jq -r '.result[0].id // empty' deployments.json)"
          test -n "$deployment_id"
          curl -fsS -H "$auth" "${api}/deployments/${deployment_id}" > deployment.json

          echo '=== DEPLOYMENT ==='
          jq -r '[.result.id, .result.uses_functions, (.result.files | type), (.result.files | length)] | @tsv' deployment.json
          echo '=== FILES SHAPE ==='
          jq -r '
            if (.result.files | type) == "object" then
              .result.files | to_entries[:25][] | [.key, (.value | type), (.value | tostring)] | @tsv
            elif (.result.files | type) == "array" then
              .result.files[:25][] | [(. | type), (. | tostring)] | @tsv
            else
              [.result.files | type, (.result.files | tostring)] | @tsv
            end
          ' deployment.json
          echo '=== FUNCTION-RELATED FILES ==='
          jq -r '
            if (.result.files | type) == "object" then
              .result.files | to_entries[] | select(.key | test("_worker|functions|routes|apply|manifest"; "i")) | [.key, (.value | tostring)] | @tsv
            elif (.result.files | type) == "array" then
              .result.files[] | select((. | tostring) | test("_worker|functions|routes|apply|manifest"; "i")) | tostring
            else empty end
          ' deployment.json
          echo '=== PROJECT SCRIPT/FUNCTION FLAGS ==='
          curl -fsS -H "$auth" "$api" > project.json
          jq -r '[.result.uses_functions, (.result.production_script_name // ""), (.result.preview_script_name // "")] | @tsv' project.json

      - name: Confirm exact live endpoints remain available
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L https://agroai-pilot.com/ -o home.html
          curl -fsS -L https://agroai-pilot.com/careers -o careers.html
          curl -fsS https://agroai-pilot.com/api/apply | jq -e '.ok == true and .endpoint == "/api/apply"' >/dev/null
          test -s home.html
          test -s careers.html

name: Form notification production repair

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/form-notification-production-repair.yml"

permissions:
  contents: read

jobs:
  diagnose:
    name: Inspect Careers production recipient
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Cloudflare Pages project without exposing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/agroai" \
            > project.json
          jq -e '.success == true' project.json >/dev/null
          echo '=== PRODUCTION BINDING NAMES AND TYPES ==='
          jq -r '
            (.result.deployment_configs.production.env_vars // {})
            | to_entries[]
            | [.key, (.value.type // "unknown"), (if (.value.value // "") == "contact@agroai-pilot.com" then "TARGET_MATCH=true" else "TARGET_MATCH=false" end)]
            | @tsv
          ' project.json
          echo '=== PREVIEW BINDING NAMES AND TYPES ==='
          jq -r '
            (.result.deployment_configs.preview.env_vars // {})
            | to_entries[]
            | [.key, (.value.type // "unknown"), (if (.value.value // "") == "contact@agroai-pilot.com" then "TARGET_MATCH=true" else "TARGET_MATCH=false" end)]
            | @tsv
          ' project.json
          echo '=== LIKELY RECIPIENT BINDINGS ==='
          jq -r '
            ["production", "preview"][] as $scope
            | (.result.deployment_configs[$scope].env_vars // {})
            | to_entries[]
            | select(.key | test("EMAIL|RECIPIENT|APPLICATION|CAREER|TO"; "i"))
            | [$scope, .key, (.value.type // "unknown"), (if (.value.value // "") == "contact@agroai-pilot.com" then "TARGET_MATCH=true" else "TARGET_MATCH=false" end)]
            | @tsv
          ' project.json

      - name: Confirm live endpoints remain healthy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://agroai-pilot.com/api/apply | jq -e '.ok == true and .endpoint == "/api/apply"' >/dev/null
          curl -fsS https://api.agroai-pilot.com/v1/health | jq -e '.status == "ok"' >/dev/null

name: Academy Registration Diagnostic
on:
  push:
    branches: [main]
    paths: [.github/workflows/academy-registration-e2e-diagnostic.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test internal Academy form submission
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 45 -o response.json -w '%{http_code}' -X POST 'https://agroai-pilot.com/academy/early-access' -H 'content-type: application/json' --data '{"name":"AGRO-AI Academy Diagnostic","email":"contact@agroai-pilot.com","role":"other","language":"en","consent":"yes"}' || true)"
          echo "form_http=$code"
          head -c 450 response.json || true
          echo
      - name: Inspect underlying API status
        run: |
          set -euo pipefail
          curl -sSL --max-time 30 'https://api.agroai-pilot.com/v1/auth/email-delivery/status' | head -c 500
          echo
      - name: Test canonical Academy registration backend with internal account
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 45 -o upstream.json -w '%{http_code}' -X POST 'https://api.agroai-pilot.com/v1/sales/contact' -H 'content-type: application/json' --data '{"type":"sales","priority":"low","name":"AGRO-AI Academy Diagnostic","email":"contact@agroai-pilot.com","role":"other","subject":"AGRO-AI Academy registration internal diagnostic","message":"Internal verification only, not a customer.","source_page":"academy/early-access","metadata":{"campaign":"agro_ai_academy","kind":"internal_test","email_opt_in":true,"language":"en"}}' || true)"
          echo "backend_http=$code"
          head -c 650 upstream.json || true
          echo

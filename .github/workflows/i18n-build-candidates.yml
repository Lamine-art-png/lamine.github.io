name: Deterministic locale catalog build

on:
  workflow_dispatch:
  push:
    branches: [fix/deterministic-localization-release]
    paths:
      - .github/workflows/i18n-build-candidates.yml
      - scripts/i18n-generate-catalogs.py
      - shared/localization/source.json

permissions:
  contents: write

concurrency:
  group: deterministic-i18n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      locales: ${{ steps.matrix.outputs.locales }}
      locales_csv: ${{ steps.matrix.outputs.locales_csv }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        name: Resolve production locale matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          manifest=json.load(open("shared/supported-locales.json"))
          locales=[]
          for code in manifest.get("targetUiLocales") or manifest["enabledUiLocales"]:
              if code in ("auto","en"):
                  continue
              code="pt-BR" if code=="pt" else code
              if code not in locales:
                  locales.append(code)
          print("locales="+json.dumps(locales,separators=(",",":")))
          print("locales_csv="+",".join(locales))
          PY

  author:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        locale: ${{ fromJSON(needs.prepare.outputs.locales) }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      I18N_AUTHORING_ENDPOINT: http://127.0.0.1:8787/api/chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start isolated Workers AI authoring fallback
        shell: bash
        run: |
          set -euo pipefail
          nohup npx --yes wrangler@4.107.0 dev --remote --config wrangler.i18n-authoring.toml --port 8787 > /tmp/i18n-authoring.log 2>&1 &
          echo $! > /tmp/i18n-authoring.pid
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:8787/health | jq -e '.status=="ok" and .provider=="cloudflare-workers-ai"' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/i18n-authoring.log
          exit 1

      - name: Generate complete source-fingerprinted catalog
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 10); do
            if python3 scripts/i18n-generate-catalogs.py \
              --locales "${{ matrix.locale }}" \
              --outdir locale-out; then
              ok=1
              break
            fi
            echo "${{ matrix.locale }} authoring interrupted (attempt $attempt/10); resuming in 12s..."
            sleep 12
          done
          test "$ok" = "1"

      - name: Stop isolated Workers AI authoring fallback
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/i18n-authoring.pid ]; then
            kill "$(cat /tmp/i18n-authoring.pid)" 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: locale-${{ matrix.locale }}
          path: locale-out/${{ matrix.locale }}.json
          if-no-files-found: error
          retention-days: 3

  validate-and-promote:
    needs: [prepare, author]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: locale-*
          path: shared/localization/catalogs
          merge-multiple: true
      - name: Validate every advertised catalog before enabling it
        run: |
          python3 scripts/i18n-generate-catalogs.py \
            --locales "${{ needs.prepare.outputs.locales_csv }}" \
            --validate-dir shared/localization/catalogs
      - name: Commit complete deterministic UI matrix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AGRO-AI Release Bot"
          git config user.email "release-bot@agroai-pilot.com"
          git add shared/localization/catalogs
          if git diff --cached --quiet; then
            echo "UI catalogs already current"
            exit 0
          fi
          git commit -m "Generate complete deterministic locale catalogs"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

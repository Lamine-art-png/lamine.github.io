name: Emergency Publish News

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/emergency-publish-news.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: agroai-emergency-news-publish
  cancel-in-progress: true

jobs:
  publish:
    name: Publish and prove live news
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: "335"
    steps:
      - name: Check out merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm runner and credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            gh issue comment "$ISSUE_NUMBER" --body '❌ Emergency production runner started, but repository-level Cloudflare credentials are unavailable outside the protected environment.'
            exit 1
          fi
          gh issue comment "$ISSUE_NUMBER" --body '⏳ Emergency production runner started with Cloudflare credentials. Deploying the reviewed John Deere article and restoring the Field Intelligence newsroom card now.'

      - name: Deploy merged Worker and exact news routes
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.107.0 deploy --config cloudflare/field-intelligence-launch-worker/wrangler.toml

      - name: Remove obsolete broad newsroom routes
        shell: bash
        run: |
          set -euo pipefail
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          api="https://api.cloudflare.com/client/v4"
          zone_response="$(curl -fsS -H "$auth_header" -H 'Content-Type: application/json' "${api}/zones?name=agroai-pilot.com&account.id=${CLOUDFLARE_ACCOUNT_ID}")"
          zone_id="$(ZONE_RESPONSE="$zone_response" python3 - <<'PY'
import json, os
payload = json.loads(os.environ['ZONE_RESPONSE'])
print((payload.get('result') or [{}])[0].get('id', ''))
PY
          )"
          test -n "$zone_id"
          route_response="$(curl -fsS -H "$auth_header" -H 'Content-Type: application/json' "${api}/zones/${zone_id}/workers/routes")"
          ROUTE_RESPONSE="$route_response" python3 - <<'PY' > obsolete-newsroom-routes.tsv
import json, os
payload = json.loads(os.environ['ROUTE_RESPONSE'])
obsolete = {
    'agroai-pilot.com/news*',
    'agroai-pilot.com/news/*',
    'agroai-pilot.com/news/field-intelligence-newsroom.js',
    'agroai-pilot.com/news/field-intelligence-newsroom.css',
}
for route in payload.get('result', []):
    if route.get('pattern') in obsolete:
        print(f"{route.get('id', '')}\t{route.get('pattern', '')}")
PY
          while IFS=$'\t' read -r route_id route_pattern; do
            [ -n "${route_id:-}" ] || continue
            delete_response="$(curl -fsS -X DELETE -H "$auth_header" -H 'Content-Type: application/json' "${api}/zones/${zone_id}/workers/routes/${route_id}")"
            DELETE_RESPONSE="$delete_response" python3 - <<'PY'
import json, os
assert json.loads(os.environ['DELETE_RESPONSE']).get('success') is True
PY
          done < obsolete-newsroom-routes.tsv

      - name: Prove live newsroom and both announcements
        shell: bash
        run: |
          set -euo pipefail
          verified=0
          for attempt in $(seq 1 48); do
            bust="$(date +%s)-${attempt}"
            origin_status="$(curl -sS -L -H 'Cache-Control: no-cache' -o origin.html -w '%{http_code}' --max-time 25 "https://agroai-343.pages.dev/news?verify=${bust}" || true)"
            news_status="$(curl -sS -L -H 'Cache-Control: no-cache' -D news.headers -o news.html -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news?verify=${bust}" || true)"
            script_status="$(curl -sS -L -H 'Cache-Control: no-cache' -o restore.js -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news/agroai-news-card-restore.js?verify=${bust}" || true)"
            jd_status="$(curl -sS -L -H 'Cache-Control: no-cache' -o jd.html -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center?verify=${bust}" || true)"
            jd_cover_status="$(curl -sS -L -H 'Cache-Control: no-cache' -D jd-cover.headers -o jd-cover.webp -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center/cover.webp?verify=${bust}" || true)"
            field_status="$(curl -sS -L -o field.html -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news/introducing-agro-ai-field-intelligence?verify=${bust}" || true)"
            field_cover_status="$(curl -sS -L -D field-cover.headers -o field-cover.bin -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news/introducing-agro-ai-field-intelligence/cover.webp?verify=${bust}" || true)"

            if [ "$origin_status" = "200" ] && [ "$news_status" = "200" ] && [ "$script_status" = "200" ] && [ "$jd_status" = "200" ] && [ "$jd_cover_status" = "200" ] && [ "$field_status" = "200" ] && [ "$field_cover_status" = "200" ] && \
               grep -Fi 'x-agroai-newsroom-source: native-pages-origin' news.headers >/dev/null && \
               grep -F 'agroai-news-card-restore.js' news.html >/dev/null && \
               grep -F 'Introducing AGRO-AI Field Intelligence' restore.js >/dev/null && \
               grep -F '/news/introducing-agro-ai-field-intelligence' restore.js >/dev/null && \
               grep -F 'AGRO-AI connects with John Deere Operations Center™' restore.js >/dev/null && \
               grep -F '/news/agro-ai-connected-john-deere-operations-center' restore.js >/dev/null && \
               grep -F 'AGRO-AI connects with John Deere Operations Center™' jd.html >/dev/null && \
               grep -F 'Agricultural operations do not suffer from a shortage of data.' jd.html >/dev/null && \
               grep -F "Access is initiated through the user's Operations Center connection." jd.html >/dev/null && \
               grep -F '<meta name="author" content="AGRO-AI"' jd.html >/dev/null && \
               grep -F 'Tuesday, July 28, 2026 at 8:00 AM PDT' jd.html >/dev/null && \
               grep -F 'San Francisco, California' jd.html >/dev/null && \
               grep -Fi 'content-type: image/webp' jd-cover.headers >/dev/null && \
               grep -Fi 'x-agroai-asset-source: reviewed-john-deere-cover' jd-cover.headers >/dev/null && \
               grep -F 'Introducing AGRO-AI Field Intelligence' field.html >/dev/null && \
               grep -F 'GiM6WZY0HG0' field.html >/dev/null && \
               grep -Fi 'x-agroai-cover-target: 3840x2160' field-cover.headers >/dev/null; then
              test "$(wc -c < jd-cover.webp)" -gt 10000
              python3 - <<'PY'
from pathlib import Path
import re
origin = Path('origin.html').read_text()
live = Path('news.html').read_text()
clean = re.sub(r'<script src="/news/agroai-news-card-restore\.js" defer data-agroai-news-card-restoration="true"></script>', '', live, count=1)
assert clean == origin
PY
              verified=1
              break
            fi
            sleep 5
          done
          test "$verified" = "1"

      - name: Report verified live publication
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --body $'✅ **Production publication verified live.**\n\n- The reviewed John Deere article is public with the supplied cover.\n- The Field Intelligence article is public and its newsroom card is restored.\n- The native newsroom markup and existing links remain intact.'

      - name: Report failure
        if: ${{ failure() }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --body '❌ Emergency deployment or live verification failed. The production issue remains open.'

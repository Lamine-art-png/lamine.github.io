name: Deploy Form Notification Gateway

on:
  push:
    branches: ["main"]
    paths:
      - "cloudflare/form-notification-gateway/**"
      - ".github/workflows/deploy-form-notification-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: form-notification-gateway-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate gateway source
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/form-notification-gateway/src/index.js
          grep -F 'agroai-pilot.com/api/apply"' cloudflare/form-notification-gateway/wrangler.toml >/dev/null
          grep -F 'agroai-pilot.com/api/consultation-requests"' cloudflare/form-notification-gateway/wrangler.toml >/dev/null
          grep -F 'agroai-pilot.com/api/demo-request"' cloudflare/form-notification-gateway/wrangler.toml >/dev/null

      - name: Deploy dedicated form routes
        shell: bash
        run: npx --yes wrangler@4.107.0 deploy --config cloudflare/form-notification-gateway/wrangler.toml

      - name: Smoke exact production routes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            careers_code="$(curl -sS --max-time 20 -D careers.headers -o careers.json -w '%{http_code}' https://agroai-pilot.com/api/apply || true)"
            demo_code="$(curl -sS --max-time 20 -D demo.headers -o demo.json -w '%{http_code}' https://agroai-pilot.com/api/consultation-requests || true)"
            if [ "$careers_code" = "200" ] && \
               grep -Fi 'x-agroai-form-gateway: active' careers.headers >/dev/null && \
               jq -e '.ok == true and .notification_recipient == "contact@agroai-pilot.com"' careers.json >/dev/null 2>&1 && \
               [ "$demo_code" = "405" ] && \
               grep -Fi 'x-agroai-form-gateway: active' demo.headers >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Careers HTTP ${careers_code:-unknown}"
          cat careers.headers || true
          cat careers.json || true
          echo "Demo HTTP ${demo_code:-unknown}"
          cat demo.headers || true
          cat demo.json || true
          exit 1

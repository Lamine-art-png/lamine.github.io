name: API Edge Domain Repair

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/api-edge-domain-repair.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: api-edge-domain-repair
  cancel-in-progress: false

env:
  CF_API: https://api.cloudflare.com/client/v4
  ZONE_NAME: agroai-pilot.com
  API_HOST: api.agroai-pilot.com
  WORKER_SERVICE: agroai-api-edge
  EVIDENCE_ISSUE: "128"

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Fail closed on missing Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Resolve active zone
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          curl --fail --silent --show-error "${auth[@]}"             "${CF_API}/zones?name=${ZONE_NAME}&account.id=${CLOUDFLARE_ACCOUNT_ID}&status=active" -o zone.json
          zone_id="$(jq -er '.result | map(select(.name == env.ZONE_NAME and .status == "active")) | first | .id' zone.json)"
          echo "ZONE_ID=${zone_id}" >> "$GITHUB_ENV"

      # Keep the existing origin and activate the route declared in wrangler.toml.
      - name: Verify existing API Worker route and inspect DNS
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          curl --fail-with-body --silent --show-error "${auth[@]}" \
            "$CF_API/zones/$ZONE_ID/workers/routes" -o routes.json
          jq -e --arg pattern "$API_HOST/v1/*" --arg service "$WORKER_SERVICE" \
            '.success == true and ([.result[] | select(.pattern == $pattern and .script == $service)] | length) == 1' routes.json >/dev/null
          curl --fail-with-body --silent --show-error "${auth[@]}" \
            "$CF_API/zones/$ZONE_ID/dns_records?name=$API_HOST&per_page=100" -o dns-before.json
          jq -e --arg host "$API_HOST" \
            '.success == true and (.result | length) > 0 and
             all(.result[]; .name == $host) and
             ([.result[] | select(.type == "A" or .type == "AAAA" or .type == "CNAME")] | length) > 0 and
             all(.result[] | select(.type == "A" or .type == "AAAA" or .type == "CNAME"); .proxiable == true)' \
            dns-before.json >/dev/null
          jq '{success,result:[.result[]|{id,name,type,content,proxied,ttl}],errors}' dns-before.json > dns-before.safe.json
          jq '{success,result:[.result[]|{id,pattern,script}],errors}' routes.json > routes.safe.json

      - name: Enable proxy on existing API address records
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          touch changed-dns-ids.txt
          while IFS= read -r record_id; do
            # Record the attempt first so an interrupted response is reversible.
            echo "$record_id" >> changed-dns-ids.txt
            curl --fail-with-body --silent --show-error -X PATCH "${auth[@]}" \
              --data '{"proxied":true}' \
              "$CF_API/zones/$ZONE_ID/dns_records/$record_id" -o dns-patch.json
            jq -e --arg id "$record_id" --arg host "$API_HOST" \
              '.success == true and .result.id == $id and .result.name == $host and .result.proxied == true' dns-patch.json >/dev/null
          done < <(jq -r '.result[] | select((.type == "A" or .type == "AAAA" or .type == "CNAME") and .proxied == false) | .id' dns-before.json)

      - name: Wait for edge routing to become authoritative
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 40); do
            status="$(curl --silent --show-error --max-time 20 -o edge-health.json -w '%{http_code}'               "https://${API_HOST}/v1/edge-health" || true)"
            if [ "$status" = "200" ] && jq -e '.status=="ok" and .service=="agroai-api-edge"' edge-health.json >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1

          curl --fail --silent --show-error --max-time 30 "https://${API_HOST}/v1/health"             | jq -e '.status=="ok"' >/dev/null

      - name: Verify DNS target preservation
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$CF_API/zones/$ZONE_ID/dns_records?name=$API_HOST&per_page=100" -o dns-after.json
          jq -e --slurpfile before dns-before.json \
            '.success == true and
             ([.result[]|{id,name,type,content}]|sort_by(.id)) ==
             ([$before[0].result[]|{id,name,type,content}]|sort_by(.id)) and
             all(.result[]|select(.type=="A" or .type=="AAAA" or .type=="CNAME"); .proxied==true)' dns-after.json >/dev/null
          jq '{success,result:[.result[]|{id,name,type,content,proxied,ttl}],errors}' dns-after.json > dns-after.safe.json

      - name: Restore previous proxy settings if verification fails
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s changed-dns-ids.txt ]; then exit 0; fi
          while IFS= read -r record_id; do
            payload="$(jq -ec --arg id "$record_id" '.result[]|select(.id==$id)|{proxied,ttl}' dns-before.json)"
            curl --fail-with-body --silent --show-error -X PATCH \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data "$payload" "$CF_API/zones/$ZONE_ID/dns_records/$record_id" -o dns-rollback.json
            jq -e '.success == true' dns-rollback.json >/dev/null
          done < changed-dns-ids.txt

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-edge-domain-repair-${{ github.sha }}
          path: |
            routes.safe.json
            dns-before.safe.json
            dns-after.safe.json
            edge-health.json
          if-no-files-found: warn
          retention-days: 90

      - name: Publish success
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(printf 'API edge hostname repaired and verified.\\n\\napi.agroai-pilot.com now routes through agroai-api-edge.\\n/v1/edge-health: 200\\n/v1/health: 200\\nrun: %s\\nrelease: %s' "$GITHUB_RUN_ID" "$GITHUB_SHA")"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${EVIDENCE_ISSUE}/comments" -f body="$body"

      - name: Publish blocker
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          errors="$(jq -c '.errors // []' dns-patch.json 2>/dev/null || echo '[]')"
          body="$(printf 'API edge hostname repair blocked.\\n\\nCloudflare DNS repair errors: %s\\nrun: %s\\nrelease: %s' "$errors" "$GITHUB_RUN_ID" "$GITHUB_SHA")"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${EVIDENCE_ISSUE}/comments" -f body="$body"

name: Portal Language Release

on:
  push:
    branches: ["main"]
    paths:
      - "figma-enterprise-v4/**"
      - "shared/ui-*.json"
      - ".github/workflows/deploy-portal-language.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agroai-portal-language-production
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PORTAL_PROJECT: agroai-portal
  PORTAL_URL: https://app.agroai-pilot.com
  API_URL: https://app.agroai-pilot.com

jobs:
  deploy:
    # Verification only. The portal has exactly one production deployer (the
    # Cloudflare Production Release workflow, deploy.yml); a second deployer
    # built a different bundle and raced it for the live deployment.
    name: Validate and smoke production portal languages
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: figma-enterprise-v4/package-lock.json

      - name: Validate 59-language portal source
        working-directory: figma-enterprise-v4
        run: |
          set -euo pipefail
          npm ci
          npm run test:i18n

      - name: Wait for the authoritative release of this commit
        id: release
        run: echo "state=$(.github/scripts/wait-for-portal-release.sh "${PORTAL_URL}" "${GITHUB_SHA}")" >> "$GITHUB_OUTPUT"

      - name: Smoke production language bundle
        if: steps.release.outputs.state == 'current'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf portal-smoke
          mkdir -p portal-smoke/assets

          cache_key="${GITHUB_SHA}-$(date +%s)"
          curl --fail --silent --show-error --location --max-time 20 --retry 5 --retry-all-errors --retry-delay 2 \
            "${PORTAL_URL}/?portal_release=${cache_key}" -o portal-smoke/index.html
          printf '%s\n' "$cache_key" > portal-smoke/release-cache-key.txt
          grep -oE '/assets/[A-Za-z0-9._/-]+\.js' portal-smoke/index.html \
            | sed 's#^/##' \
            | sort -u > portal-smoke/production-assets.txt
          test -s portal-smoke/production-assets.txt

          cp portal-smoke/production-assets.txt portal-smoke/queue.txt
          : > portal-smoke/seen.txt
          for pass in 1 2 3 4; do
            sort -u portal-smoke/queue.txt -o portal-smoke/queue.txt
            cp portal-smoke/queue.txt portal-smoke/pass-queue.txt
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              grep -Fx "$asset" portal-smoke/seen.txt >/dev/null 2>&1 && continue
              echo "$asset" >> portal-smoke/seen.txt
              target="portal-smoke/assets/$(printf '%s' "$asset" | tr '/' '_')"
              cache_key="$(cat portal-smoke/release-cache-key.txt)"
              curl --fail --silent --show-error --max-time 20 --retry 5 --retry-all-errors --retry-delay 2 \
                "${PORTAL_URL}/${asset}?portal_release=${cache_key}" -o "$target"
              grep -oE 'assets/[A-Za-z0-9._/-]+\.js' "$target" >> portal-smoke/queue.txt || true
              grep -oE '\./[A-Za-z0-9._/-]+\.js' "$target" \
                | sed 's#^\./#assets/#' >> portal-smoke/queue.txt || true
            done < portal-smoke/pass-queue.txt
          done

          compgen -G 'portal-smoke/assets/*' >/dev/null
          cat portal-smoke/assets/* > portal-smoke/all-js.txt
          for marker in \
            'agroai_ui_catalog_v4:' \
            'commercialBoundary.title.upgrade' \
            'Kiswahili' \
            'Українська' \
            '日本語' \
            'Ελληνικά'; do
            grep -F "$marker" portal-smoke/all-js.txt >/dev/null
          done
          printf 'production_portal_language_bundle=ok\n'

name: Portal Language Release

on:
  push:
    branches: ["main"]
    paths:
      - "figma-enterprise-v4/**"
      - "shared/ui-*.json"
      - ".github/workflows/deploy-portal-language.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agroai-portal-language-production
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PORTAL_PROJECT: agroai-portal
  PORTAL_URL: https://app.agroai-pilot.com
  API_URL: https://app.agroai-pilot.com

jobs:
  deploy:
    name: Build, deploy, and smoke portal languages
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: figma-enterprise-v4/package-lock.json

      - name: Build exact 59-language portal
        working-directory: figma-enterprise-v4
        env:
          VITE_API_BASE_URL: ${{ env.API_URL }}
        run: |
          set -euo pipefail
          npm ci
          npm run test:i18n
          npm run build

      - name: Deploy exact portal bundle
        run: |
          set -euo pipefail
          npx --yes wrangler@4.107.0 pages deploy figma-enterprise-v4/dist \
            --project-name "${PORTAL_PROJECT}" \
            --branch main \
            --commit-hash "${GITHUB_SHA}"

      - name: Smoke exact production language bundle after deployment convergence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf portal-smoke
          mkdir -p portal-smoke/assets

          grep -oE '/assets/[A-Za-z0-9._/-]+\.js' figma-enterprise-v4/dist/index.html \
            | sed 's#^/##' \
            | sort -u > portal-smoke/expected-assets.txt
          test -s portal-smoke/expected-assets.txt

          ready=0
          for attempt in $(seq 1 60); do
            cache_key="${GITHUB_SHA}-${attempt}-$(date +%s)"
            if ! curl --fail --silent --show-error --location --max-time 20 \
              "${PORTAL_URL}/?portal_release=${cache_key}" -o portal-smoke/index.html; then
              sleep 5
              continue
            fi

            title="$(sed -n 's:.*<title>\(.*\)</title>.*:\1:p' portal-smoke/index.html | head -1)"
            if [ "$title" != "AGRO-AI Enterprise Portal" ]; then
              sleep 5
              continue
            fi

            grep -oE '/assets/[A-Za-z0-9._/-]+\.js' portal-smoke/index.html \
              | sed 's#^/##' \
              | sort -u > portal-smoke/production-assets.txt || true

            exact=1
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              if ! grep -Fx "$asset" portal-smoke/production-assets.txt >/dev/null 2>&1; then
                exact=0
                break
              fi
            done < portal-smoke/expected-assets.txt

            if [ "$exact" -eq 1 ]; then
              printf '%s\n' "$cache_key" > portal-smoke/release-cache-key.txt
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1

          cp portal-smoke/production-assets.txt portal-smoke/queue.txt
          : > portal-smoke/seen.txt
          for pass in 1 2 3 4; do
            sort -u portal-smoke/queue.txt -o portal-smoke/queue.txt
            cp portal-smoke/queue.txt portal-smoke/pass-queue.txt
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              grep -Fx "$asset" portal-smoke/seen.txt >/dev/null 2>&1 && continue
              echo "$asset" >> portal-smoke/seen.txt
              target="portal-smoke/assets/$(printf '%s' "$asset" | tr '/' '_')"
              cache_key="$(cat portal-smoke/release-cache-key.txt)"
              curl --fail --silent --show-error --max-time 20 \
                "${PORTAL_URL}/${asset}?portal_release=${cache_key}" -o "$target"
              grep -oE 'assets/[A-Za-z0-9._/-]+\.js' "$target" >> portal-smoke/queue.txt || true
              grep -oE '\./[A-Za-z0-9._/-]+\.js' "$target" \
                | sed 's#^\./#assets/#' >> portal-smoke/queue.txt || true
            done < portal-smoke/pass-queue.txt
          done

          compgen -G 'portal-smoke/assets/*' >/dev/null
          cat portal-smoke/assets/* > portal-smoke/all-js.txt
          for marker in \
            'agroai_ui_catalog_v4:' \
            'commercialBoundary.title.upgrade' \
            'Kiswahili' \
            'Українська' \
            '日本語' \
            'Ελληνικά'; do
            grep -F "$marker" portal-smoke/all-js.txt >/dev/null
          done
          printf 'production_portal_language_bundle=ok\n'

name: diag-oidc

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diag.yml"

jobs:
  oidc:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Debug refs
        run: |
          echo "REPO=$GITHUB_REPOSITORY"
          echo "REF=$GITHUB_REF"

      - name: Inspect safe OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsSL             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          OIDC_RESPONSE="$RESPONSE" python - <<'PY'
          import base64
          import json
          import os

          token = json.loads(os.environ["OIDC_RESPONSE"])["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload.encode()))

          safe_keys = (
              "sub",
              "aud",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "ref",
              "ref_type",
              "job_workflow_ref",
          )
          for key in safe_keys:
              if key in claims:
                  value = claims[key]
                  if isinstance(value, list):
                      value = ",".join(str(v) for v in value)
                  print(f"OIDC_{key.upper()}={value}")
          PY

      - name: Verify configured AWS target
        shell: bash
        env:
          ROLE_ARN: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          ROLE_ACCOUNT="$(printf '%s' "$ROLE_ARN" | cut -d: -f5)"
          if [ "$ROLE_ACCOUNT" = "987432215840" ]; then
            echo "ROLE_ACCOUNT_MATCH=true"
          else
            echo "ROLE_ACCOUNT_MATCH=false"
          fi

          if [ "$AWS_REGION_VALUE" = "us-east-1" ]; then
            echo "AWS_REGION_MATCH=true"
          else
            echo "AWS_REGION_MATCH=false"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Who am I?
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          echo "AWS_CALLER_ACCOUNT=$ACCOUNT"
          test "$ACCOUNT" = "987432215840"

name: diag-oidc

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diag.yml"

jobs:
  oidc:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Debug refs
        run: |
          echo "REPO=$GITHUB_REPOSITORY"
          echo "REF=$GITHUB_REF"

      - name: Inspect safe OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsSL             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          OIDC_RESPONSE="$RESPONSE" python - <<'PY'
          import base64
          import json
          import os

          token = json.loads(os.environ["OIDC_RESPONSE"])["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload.encode()))

          safe_keys = (
              "sub",
              "aud",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "ref",
              "ref_type",
              "job_workflow_ref",
          )
          for key in safe_keys:
              if key in claims:
                  value = claims[key]
                  if isinstance(value, list):
                      value = ",".join(str(v) for v in value)
                  print(f"OIDC_{key.upper()}={value}")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::987432215840:role/AgroAIMarketplaceGitHubVerifier
          aws-region: us-east-1

      - name: Who am I?
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          echo "AWS_CALLER_ACCOUNT=$ACCOUNT"
          test "$ACCOUNT" = "987432215840"

      - name: Verify AWS Marketplace infrastructure read-only
        shell: bash
        run: |
          set -euo pipefail
          REGION="us-east-1"
          STACK="agroai-marketplace-events"
          PRODUCT_ID="prod-rrjrdndw2eptq"

          aws cloudformation describe-stacks             --region "$REGION"             --stack-name "$STACK"             --output json > "$RUNNER_TEMP/stack.json"
          aws cloudformation list-stack-resources             --region "$REGION"             --stack-name "$STACK"             --output json > "$RUNNER_TEMP/resources.json"

          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          stack = json.loads((root / "stack.json").read_text())["Stacks"][0]
          print("CFN_STACK_STATUS=" + stack["StackStatus"])
          if not stack["StackStatus"].endswith("_COMPLETE"):
              raise SystemExit("CloudFormation stack is not complete")
          resources = json.loads((root / "resources.json").read_text())["StackResourceSummaries"]
          for item in resources:
              rtype = item.get("ResourceType", "")
              if rtype in {"AWS::SQS::Queue", "AWS::Events::Rule"}:
                  print("CFN_RESOURCE=" + json.dumps({
                      "logical_id": item.get("LogicalResourceId"),
                      "type": rtype,
                      "status": item.get("ResourceStatus"),
                      "physical_id": item.get("PhysicalResourceId"),
                  }, sort_keys=True))
          PY

          python - <<'PY' > "$RUNNER_TEMP/queues.txt"
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          resources = json.loads((root / "resources.json").read_text())["StackResourceSummaries"]
          for item in resources:
              if item.get("ResourceType") == "AWS::SQS::Queue" and item.get("PhysicalResourceId"):
                  print(item["PhysicalResourceId"])
          PY
          while IFS= read -r queue_url; do
            [ -n "$queue_url" ] || continue
            aws sqs get-queue-attributes               --region "$REGION"               --queue-url "$queue_url"               --attribute-names QueueArn KmsMasterKeyId RedrivePolicy VisibilityTimeout SqsManagedSseEnabled               --output json
          done < "$RUNNER_TEMP/queues.txt"

          python - <<'PY' > "$RUNNER_TEMP/rules.txt"
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          resources = json.loads((root / "resources.json").read_text())["StackResourceSummaries"]
          for item in resources:
              if item.get("ResourceType") == "AWS::Events::Rule" and item.get("PhysicalResourceId"):
                  print(item["PhysicalResourceId"])
          PY
          while IFS= read -r rule_name; do
            [ -n "$rule_name" ] || continue
            aws events describe-rule --region "$REGION" --name "$rule_name"               --query '{Name:Name,State:State,EventPattern:EventPattern}' --output json
            aws events list-targets-by-rule --region "$REGION" --rule "$rule_name"               --query 'Targets[].{Id:Id,Arn:Arn}' --output json
          done < "$RUNNER_TEMP/rules.txt"

          aws marketplace-catalog describe-entity             --region "$REGION"             --catalog AWSMarketplace             --entity-id "$PRODUCT_ID"             --output json > "$RUNNER_TEMP/product.json"
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          doc = json.loads((root / "product.json").read_text())
          for key in ("EntityType", "EntityIdentifier", "LastModifiedDate"):
              if key in doc:
                  print(f"MARKETPLACE_{key.upper()}={doc[key]}")
          details = doc.get("DetailsDocument")
          if details is None and doc.get("Details"):
              try:
                  details = json.loads(doc["Details"])
              except Exception:
                  details = None
          wanted = {"ProductCode", "ProductId", "Title", "Visibility", "Status", "Dimensions"}
          def walk(value):
              if isinstance(value, dict):
                  for k, v in value.items():
                      if k in wanted:
                          print("MARKETPLACE_DETAIL=" + json.dumps({k: v}, sort_keys=True))
                      walk(v)
              elif isinstance(value, list):
                  for item in value:
                      walk(item)
          walk(details)
          PY

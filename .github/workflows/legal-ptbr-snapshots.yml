name: Brazilian Portuguese legal snapshots
# retry: rebase-safe static legal artifact promotion

on:
  push:
    branches: [fix/deterministic-localization-release]
    paths:
      - ".github/workflows/legal-ptbr-snapshots.yml"
      - "cloudflare/ollama-compat/src/index.js"
      - "wrangler.i18n-authoring.toml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legal-ptbr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser renderer
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Render current canonical legal DOM
        shell: bash
        run: |
          mkdir -p legal-rendered
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          for (const slug of ["terms-of-service", "privacy-policy"]) {
            const page = await browser.newPage({ locale: "en-US" });
            await page.goto(`https://agroai-pilot.com/${slug}`, { waitUntil: "networkidle", timeout: 60000 });
            await page.waitForTimeout(1200);
            fs.writeFileSync(`legal-rendered/${slug}.html`, await page.content());
            await page.close();
          }
          await browser.close();
          NODE

      - name: Start isolated Workers AI authoring preview
        shell: bash
        run: |
          set -euo pipefail
          nohup npx --yes wrangler@4.107.0 dev --remote --config wrangler.i18n-authoring.toml --port 8787 > /tmp/legal-authoring.log 2>&1 &
          echo $! > /tmp/legal-authoring.pid
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:8787/health | jq -e '.status=="ok" and .provider=="cloudflare-workers-ai"' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/legal-authoring.log
          exit 1
      - name: Generate pt-BR snapshots from current canonical production legal HTML
        run: |
          python3 scripts/legal-i18n-generate.py --locale pt-BR --endpoint http://127.0.0.1:8787/api/chat --source-dir legal-rendered
      - name: Stop authoring preview
        if: always()
        run: |
          if [ -f /tmp/legal-authoring.pid ]; then kill "$(cat /tmp/legal-authoring.pid)" 2>/dev/null || true; fi
      - name: Validate generated legal snapshots
        shell: bash
        run: |
          set -euo pipefail
          for slug in terms-of-service privacy-policy; do
            html="platform-api/legal/localized/pt-BR/${slug}.html"
            meta="platform-api/legal/localized/pt-BR/${slug}.meta.json"
            test -s "$html"
            test -s "$meta"
            grep -F 'name="agroai-legal-locale" content="pt-BR"' "$html" >/dev/null
            jq -e '.status=="complete-generated" and .locale=="pt-BR" and .translatedTextNodes >= 10 and (.sourceSha256|length)==64' "$meta" >/dev/null
          done
      - name: Commit localized legal snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AGRO-AI Release Bot"
          git config user.email "release-bot@agroai-pilot.com"
          git add platform-api/legal/localized/pt-BR
          git commit -m "Generate Brazilian Portuguese legal snapshots"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

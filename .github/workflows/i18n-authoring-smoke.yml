name: Localization authoring API smoke

on:
  push:
    branches: [fix/deterministic-localization-release]
    paths:
      - ".github/workflows/i18n-authoring-smoke.yml"
      - "scripts/i18n-generate-catalogs.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prove Brazilian Portuguese authoring through the production-authorized provider chain
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/i18n-generate-catalogs.py --locales pt-BR --preflight

name: Assurance Portal Visibility Release

on:
  push:
    branches: ["main"]
    paths:
      - "figma-enterprise-v4/**"
      - "shared/ui-*.json"
      - ".github/workflows/assurance-portal-visibility-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: assurance-portal-visibility-production
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PORTAL_PROJECT: agroai-portal
  PORTAL_URL: https://app.agroai-pilot.com
  API_URL: https://app.agroai-pilot.com

jobs:
  deploy-and-prove:
    name: Deploy and prove visible Assurance navigation
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: figma-enterprise-v4/package-lock.json

      - name: Prove source contains visible Assurance sidebar item
        shell: bash
        run: |
          set -euo pipefail
          file="figma-enterprise-v4/src/app/components/MainLayout.tsx"
          grep -F 'const canAssurance = capabilityEnabled(entitlements, "assurance.readiness", false);' "$file" >/dev/null
          grep -F '{ name: tx("Assurance"), path: "/assurance", icon: Shield, locked: !canAssurance' "$file" >/dev/null
          route="figma-enterprise-v4/src/app/routes.tsx"
          grep -F 'path: "assurance"' "$route" >/dev/null
          grep -F 'import("./components/Assurance")' "$route" >/dev/null
          printf 'assurance_sidebar_source=ok\n'

      - name: Publish source-contract success
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc '{state:"success",context:"assurance-portal-visibility/source",description:"Assurance sidebar source contract present"}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Capture exact deterministic UI literal mismatch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          root = Path('figma-enterprise-v4').resolve()
          sys.path.insert(0, str(root))
          from scripts.check_ui_literal_inventory import build_catalog, load_parts
          expected = build_catalog()
          current, paths = load_parts()
          missing = {k: expected[k] for k in sorted(set(expected) - set(current))}
          extra = {k: current[k] for k in sorted(set(current) - set(expected))}
          changed = {
              k: {"current": current[k], "expected": expected[k]}
              for k in sorted(set(current).intersection(expected))
              if current[k] != expected[k]
          }
          payload = {
              "expected_count": len(expected),
              "current_count": len(current),
              "catalog_parts": [str(p) for p in paths],
              "missing": missing,
              "extra": extra,
              "changed": changed,
          }
          Path('diagnostics').mkdir(exist_ok=True)
          Path('diagnostics/assurance-literal-inventory.json').write_text(
              json.dumps(payload, indent=2, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8'
          )
          Path('diagnostics/assurance-literal-summary.txt').write_text(
              f"expected={len(expected)} current={len(current)} missing={len(missing)} extra={len(extra)} changed={len(changed)}\n",
              encoding='utf-8',
          )
          PY
          cat diagnostics/assurance-literal-summary.txt
          short="${GITHUB_SHA:0:12}"
          branch="diagnostics/assurance-live-literal-${short}"
          git config user.name "AGRO-AI Release Diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add diagnostics/assurance-literal-inventory.json diagnostics/assurance-literal-summary.txt
          git commit -m "diagnostics: capture live Assurance literal mismatch"
          git push origin "$branch"
          git checkout --detach "$GITHUB_SHA"
          summary="$(cat diagnostics/assurance-literal-summary.txt 2>/dev/null || true)"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc --arg description "${summary:-Literal mismatch captured}" '{state:"success",context:"assurance-portal-visibility/literal-delta",description:$description}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Build exact current portal
        working-directory: figma-enterprise-v4
        env:
          VITE_API_BASE_URL: ${{ env.API_URL }}
          VITE_DEPLOYMENT_ENVIRONMENT: production
          VITE_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm ci
          npm run test:i18n
          node tests/assurance-route-isolation-contract.mjs
          npm run build
          grep -Fx 'AGROAI_ASSURANCE_SIDEBAR_V2_VISIBLE' dist/assurance-sidebar-v2-release.txt >/dev/null

      - name: Publish build success
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc '{state:"success",context:"assurance-portal-visibility/build",description:"Exact Assurance portal bundle built"}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Deploy exact portal bundle to authoritative Pages project
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          npx --yes wrangler@4.107.0 pages deploy figma-enterprise-v4/dist \
            --project-name "${PORTAL_PROJECT}" \
            --branch main \
            --commit-hash "${GITHUB_SHA}"

      - name: Publish Cloudflare deploy success
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc '{state:"success",context:"assurance-portal-visibility/deploy",description:"Exact bundle uploaded to agroai-portal"}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Prove production is serving this portal release
        shell: bash
        run: |
          set -euo pipefail
          cache_bust="assurance_sidebar_release=${GITHUB_SHA}"
          marker_ok=0
          for attempt in $(seq 1 60); do
            marker="$(curl --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "${PORTAL_URL}/assurance-sidebar-v2-release.txt?${cache_bust}&attempt=${attempt}" 2>/dev/null || true)"
            if [[ "$marker" == "AGROAI_ASSURANCE_SIDEBAR_V2_VISIBLE" ]]; then
              marker_ok=1
              break
            fi
            sleep 5
          done
          [[ "$marker_ok" == "1" ]] || { echo "Production marker never became current" >&2; exit 1; }

          bundle_ok=0
          for attempt in $(seq 1 60); do
            rm -rf portal-smoke
            mkdir -p portal-smoke/assets
            if ! curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "${PORTAL_URL}/?${cache_bust}&bundle_attempt=${attempt}" -o portal-smoke/index.html; then
              sleep 5
              continue
            fi
            title="$(sed -n 's:.*<title>\(.*\)</title>.*:\1:p' portal-smoke/index.html | head -1)"
            if [[ "$title" != "AGRO-AI Enterprise Portal" ]]; then
              sleep 5
              continue
            fi
            grep -oE '/assets/[A-Za-z0-9._/-]+\.js' portal-smoke/index.html | sed 's#^/##' > portal-smoke/queue.txt || true
            : > portal-smoke/seen.txt
            for pass in 1 2 3 4 5 6; do
              sort -u portal-smoke/queue.txt -o portal-smoke/queue.txt
              while IFS= read -r asset; do
                [ -n "$asset" ] || continue
                grep -Fx "$asset" portal-smoke/seen.txt >/dev/null 2>&1 && continue
                echo "$asset" >> portal-smoke/seen.txt
                target="portal-smoke/assets/$(basename "$asset")"
                curl --fail --silent --show-error --max-time 20 \
                  -H 'Cache-Control: no-cache' \
                  "${PORTAL_URL}/${asset}" -o "$target" || continue
                grep -oE 'assets/[A-Za-z0-9._/-]+\.js' "$target" >> portal-smoke/queue.txt || true
                grep -oE '\./[A-Za-z0-9._/-]+\.js' "$target" | sed 's#^\./#assets/#' >> portal-smoke/queue.txt || true
              done < portal-smoke/queue.txt
            done
            if compgen -G 'portal-smoke/assets/*.js' >/dev/null; then
              cat portal-smoke/assets/*.js > portal-smoke/all-js.txt
              if grep -F 'assurance.readiness' portal-smoke/all-js.txt >/dev/null \
                && grep -F '/assurance' portal-smoke/all-js.txt >/dev/null; then
                bundle_ok=1
                break
              fi
            fi
            sleep 5
          done
          [[ "$bundle_ok" == "1" ]] || { echo "Production JavaScript never exposed Assurance bundle markers" >&2; exit 1; }

          route_ok=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "${PORTAL_URL}/assurance?${cache_bust}&route_attempt=${attempt}" -o portal-smoke/assurance.html; then
              assurance_title="$(sed -n 's:.*<title>\(.*\)</title>.*:\1:p' portal-smoke/assurance.html | head -1)"
              if [[ "$assurance_title" == "AGRO-AI Enterprise Portal" ]]; then
                route_ok=1
                break
              fi
            fi
            sleep 5
          done
          [[ "$route_ok" == "1" ]] || { echo "Production /assurance route never became current" >&2; exit 1; }
          printf 'production_assurance_sidebar_bundle=ok\n'

      - name: Publish production visibility status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == "success" ]]; then
            state=success
            description="Assurance sidebar release is live in production portal"
          else
            state=failure
            description="Assurance sidebar production release failed"
          fi
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc --arg state "$state" --arg context assurance-portal-visibility-production --arg description "$description" '{state:$state,context:$context,description:$description}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

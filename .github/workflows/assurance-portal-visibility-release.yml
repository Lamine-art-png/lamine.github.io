name: Assurance Portal Visibility Release

on:
  push:
    branches: ["main"]
    paths:
      - "figma-enterprise-v4/**"
      - "shared/ui-*.json"
      - ".github/workflows/assurance-portal-visibility-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: assurance-portal-visibility-production
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PORTAL_PROJECT: agroai-portal
  PORTAL_URL: https://app.agroai-pilot.com
  API_URL: https://api.agroai-pilot.com

jobs:
  deploy-and-prove:
    name: Deploy and prove visible Assurance navigation
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: figma-enterprise-v4/package-lock.json

      - name: Prove source contains Assurance navigation and route
        shell: bash
        run: |
          set -euo pipefail
          layout="figma-enterprise-v4/src/app/components/MainLayout.tsx"
          routes="figma-enterprise-v4/src/app/routes.tsx"
          grep -F 'const canAssurance = capabilityEnabled(entitlements, "assurance.readiness", false);' "$layout" >/dev/null
          grep -F '{ name: tx("Assurance"), path: "/assurance", icon: Shield, locked: !canAssurance' "$layout" >/dev/null
          grep -F 'path: "assurance"' "$routes" >/dev/null
          grep -F 'import("./components/Assurance")' "$routes" >/dev/null

      - name: Publish source-contract success
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc '{state:"success",context:"assurance-portal-visibility/source",description:"Assurance navigation and route are present in source"}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Canonicalize deterministic UI literal inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          portal = Path("figma-enterprise-v4").resolve()
          repo = portal.parent
          sys.path.insert(0, str(portal))
          from scripts.check_ui_literal_inventory import build_catalog

          expected = build_catalog()
          shared = repo / "shared"

          def part_number(path: Path) -> int:
              match = re.fullmatch(r"ui-literals\.en\.(\d+)\.json", path.name)
              return int(match.group(1)) if match else 10**9

          parts = sorted(shared.glob("ui-literals.en.*.json"), key=part_number)
          if not parts:
              raise SystemExit("No static UI literal catalog parts found")

          seen = set()
          normalized = {}
          duplicate_count = 0
          stale_count = 0

          for path in parts:
              raw = json.loads(path.read_text(encoding="utf-8"))
              clean = {}
              for key, value in raw.items():
                  if key in seen:
                      duplicate_count += 1
                      continue
                  if key not in expected or expected[key] != value:
                      stale_count += 1
                      continue
                  clean[key] = value
                  seen.add(key)
              normalized[path] = clean

          missing = sorted(set(expected) - seen)
          target = parts[-1]
          for key in missing:
              normalized[target][key] = expected[key]
              seen.add(key)

          for path in parts:
              path.write_text(
                  json.dumps(normalized[path], ensure_ascii=False, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

          combined = {}
          for path in parts:
              data = json.loads(path.read_text(encoding="utf-8"))
              overlap = set(combined).intersection(data)
              if overlap:
                  raise SystemExit(f"Canonicalization left duplicate keys: {sorted(overlap)[:8]}")
              combined.update(data)

          if combined != expected:
              missing_after = sorted(set(expected) - set(combined))[:8]
              extra_after = sorted(set(combined) - set(expected))[:8]
              changed_after = sorted(
                  key for key in set(expected).intersection(combined) if expected[key] != combined[key]
              )[:8]
              raise SystemExit(
                  f"Canonical inventory mismatch remains: missing={missing_after} extra={extra_after} changed={changed_after}"
              )

          Path("literal-normalization-summary.txt").write_text(
              f"expected={len(expected)} duplicates_removed={duplicate_count} stale_removed={stale_count} missing_added={len(missing)}\n",
              encoding="utf-8",
          )
          print(Path("literal-normalization-summary.txt").read_text(encoding="utf-8").strip())
          PY
          python3 figma-enterprise-v4/scripts/check_ui_literal_inventory.py --check

      - name: Publish literal inventory success
        shell: bash
        run: |
          set -euo pipefail
          summary="$(cat literal-normalization-summary.txt)"
          description="$(printf '%s' "$summary" | cut -c1-140)"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc --arg description "$description" '{state:"success",context:"assurance-portal-visibility/literal-inventory",description:$description}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Build exact current portal
        working-directory: figma-enterprise-v4
        env:
          VITE_API_BASE_URL: ${{ env.API_URL }}
          VITE_DEPLOYMENT_ENVIRONMENT: production
          VITE_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm ci
          npm run test:i18n
          node tests/assurance-route-isolation-contract.mjs
          npm run build
          grep -Fx 'AGROAI_ASSURANCE_SIDEBAR_V2_VISIBLE' dist/assurance-sidebar-v2-release.txt >/dev/null

      - name: Publish build success
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc '{state:"success",context:"assurance-portal-visibility/build",description:"Exact current portal passed full i18n and production build"}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Deploy exact portal bundle to authoritative Pages project
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          npx --yes wrangler@4.107.0 pages deploy figma-enterprise-v4/dist \
            --project-name "${PORTAL_PROJECT}" \
            --branch main \
            --commit-hash "${GITHUB_SHA}"

      - name: Publish Cloudflare deploy success
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc '{state:"success",context:"assurance-portal-visibility/deploy",description:"Exact portal bundle uploaded to production agroai-portal"}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Prove production is serving Assurance navigation bundle
        shell: bash
        run: |
          set -euo pipefail
          cache_bust="assurance_sidebar_release=${GITHUB_SHA}"

          marker_ok=0
          for attempt in $(seq 1 60); do
            marker="$(curl --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "${PORTAL_URL}/assurance-sidebar-v2-release.txt?${cache_bust}&attempt=${attempt}" 2>/dev/null || true)"
            if [[ "$marker" == "AGROAI_ASSURANCE_SIDEBAR_V2_VISIBLE" ]]; then
              marker_ok=1
              break
            fi
            sleep 5
          done
          [[ "$marker_ok" == "1" ]] || { echo "Production release marker never became current" >&2; exit 1; }

          bundle_ok=0
          for attempt in $(seq 1 60); do
            rm -rf portal-smoke
            mkdir -p portal-smoke/assets
            if ! curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "${PORTAL_URL}/?${cache_bust}&bundle_attempt=${attempt}" -o portal-smoke/index.html; then
              sleep 5
              continue
            fi
            title="$(sed -n 's:.*<title>\(.*\)</title>.*:\1:p' portal-smoke/index.html | head -1)"
            [[ "$title" == "AGRO-AI Enterprise Portal" ]] || { sleep 5; continue; }

            grep -oE '/assets/[A-Za-z0-9._/-]+\.js' portal-smoke/index.html | sed 's#^/##' > portal-smoke/queue.txt || true
            : > portal-smoke/seen.txt
            for pass in 1 2 3 4 5 6; do
              sort -u portal-smoke/queue.txt -o portal-smoke/queue.txt
              while IFS= read -r asset; do
                [ -n "$asset" ] || continue
                grep -Fx "$asset" portal-smoke/seen.txt >/dev/null 2>&1 && continue
                echo "$asset" >> portal-smoke/seen.txt
                target="portal-smoke/assets/$(basename "$asset")"
                curl --fail --silent --show-error --max-time 20 \
                  -H 'Cache-Control: no-cache' \
                  "${PORTAL_URL}/${asset}" -o "$target" || continue
                grep -oE 'assets/[A-Za-z0-9._/-]+\.js' "$target" >> portal-smoke/queue.txt || true
                grep -oE '\./[A-Za-z0-9._/-]+\.js' "$target" | sed 's#^\./#assets/#' >> portal-smoke/queue.txt || true
              done < portal-smoke/queue.txt
            done

            if compgen -G 'portal-smoke/assets/*.js' >/dev/null; then
              cat portal-smoke/assets/*.js > portal-smoke/all-js.txt
              if grep -F 'assurance.readiness' portal-smoke/all-js.txt >/dev/null \
                && grep -F '/assurance' portal-smoke/all-js.txt >/dev/null; then
                bundle_ok=1
                break
              fi
            fi
            sleep 5
          done
          [[ "$bundle_ok" == "1" ]] || { echo "Production JavaScript never exposed Assurance markers" >&2; exit 1; }

          route_ok=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "${PORTAL_URL}/assurance?${cache_bust}&route_attempt=${attempt}" -o portal-smoke/assurance.html; then
              assurance_title="$(sed -n 's:.*<title>\(.*\)</title>.*:\1:p' portal-smoke/assurance.html | head -1)"
              if [[ "$assurance_title" == "AGRO-AI Enterprise Portal" ]]; then
                route_ok=1
                break
              fi
            fi
            sleep 5
          done
          [[ "$route_ok" == "1" ]] || { echo "Production /assurance route never became current" >&2; exit 1; }

      - name: Persist normalized literal catalog to repair branch
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- shared/ui-literals.en.*.json; then
            echo "No catalog persistence change required"
            exit 0
          fi
          short="${GITHUB_SHA:0:12}"
          repair_branch="fix/normalized-portal-literals-${short}"
          git config user.name "AGRO-AI Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$repair_branch"
          git add shared/ui-literals.en.*.json
          git commit -m "fix(portal): persist canonical UI literal inventory"
          git push origin "HEAD:refs/heads/$repair_branch"
          printf '%s\n' "$repair_branch" > /tmp/assurance_literal_repair_branch.txt

      - name: Publish production visibility status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == "success" ]]; then
            state=success
            description="Assurance sidebar is live in the production portal"
          else
            state=failure
            description="Assurance sidebar production release failed"
          fi
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc --arg state "$state" --arg context assurance-portal-visibility-production --arg description "$description" '{state:$state,context:$context,description:$description}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

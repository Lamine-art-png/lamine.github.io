name: Publish Platform API Article Refinements

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: publish-platform-api-article-refinements
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.actor == github.repository_owner && github.event.issue.title == '[ops] Publish Platform API article refinements' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ARTICLE_URL: https://agroai-pilot.com/news/agro-ai-platform-api-launch
      NEWS_URL: https://agroai-pilot.com/news
      SCRIPT_URL: https://agroai-pilot.com/news/agroai-news-card-restore.js
      FIELD_URL: https://agroai-pilot.com/news/introducing-agro-ai-field-intelligence
      DEERE_URL: https://agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center
    steps:
      - name: Check out merged main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate exact merged article and narrow Worker routes
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

          article="client/public/news/agro-ai-platform-api-launch/index.html"
          worker="cloudflare/field-intelligence-launch-worker/src/index.ts"
          routes="cloudflare/field-intelligence-launch-worker/wrangler.toml"

          test -s "$article"
          test -s "$worker"
          test -s "$routes"

          grep -F '<time datetime="2026-08-03">August 3, 2026</time>' "$article" >/dev/null
          grep -F 'href="https://app.agroai-pilot.com">Open Enterprise Portal</a>' "$article" >/dev/null
          grep -F 'href="https://agroai-pilot.com/book-a-demo">Book a Demo</a>' "$article" >/dev/null
          grep -F '<section class="enterprise-portal">' "$article" >/dev/null
          grep -F 'Run your operation through the AGRO-AI Enterprise Portal.' "$article" >/dev/null
          grep -F 'date:"San Francisco, California — August 3, 2026"' "$worker" >/dev/null

          python3 - <<'PY'
from pathlib import Path
html = Path('client/public/news/agro-ai-platform-api-launch/index.html').read_text()
closing = html.index('<section class="closing">')
enterprise = html.index('<section class="enterprise-portal">')
if enterprise <= closing:
    raise SystemExit('Enterprise Portal section must follow the Start building section')
PY

          grep -F 'pattern = "agroai-pilot.com/news"' "$routes" >/dev/null
          grep -F 'pattern = "agroai-pilot.com/news/"' "$routes" >/dev/null
          grep -F 'pattern = "agroai-pilot.com/news/agro-ai-platform-api-launch"' "$routes" >/dev/null
          grep -F 'pattern = "agroai-pilot.com/news/agro-ai-platform-api-launch/*"' "$routes" >/dev/null
          ! grep -F 'pattern = "agroai-pilot.com/news*"' "$routes"
          ! grep -F 'pattern = "agroai-pilot.com/news/*"' "$routes"

          npx --yes wrangler@4.107.0 deploy --dry-run --config cloudflare/field-intelligence-launch-worker/wrangler.toml

      - name: Deploy the existing narrow News Worker routes
        shell: bash
        run: npx --yes wrangler@4.107.0 deploy --config cloudflare/field-intelligence-launch-worker/wrangler.toml

      - name: Verify literal live URLs and requested refinements
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 24); do
            article_status="$(curl -sS -L -H 'Cache-Control: no-cache' -D article.headers -o article.html -w '%{http_code}' --max-time 25 "${ARTICLE_URL}" || true)"
            news_status="$(curl -sS -L -H 'Cache-Control: no-cache' -o news.html -w '%{http_code}' --max-time 25 "${NEWS_URL}" || true)"
            script_status="$(curl -sS -L -H 'Cache-Control: no-cache' -o newsroom.js -w '%{http_code}' --max-time 25 "${SCRIPT_URL}" || true)"
            field_status="$(curl -sS -L -H 'Cache-Control: no-cache' -o field.html -w '%{http_code}' --max-time 25 "${FIELD_URL}" || true)"
            deere_status="$(curl -sS -L -H 'Cache-Control: no-cache' -o deere.html -w '%{http_code}' --max-time 25 "${DEERE_URL}" || true)"

            if [ "$article_status" = "200" ] && [ "$news_status" = "200" ] && [ "$script_status" = "200" ] && [ "$field_status" = "200" ] && [ "$deere_status" = "200" ] && \
               grep -F '<time datetime="2026-08-03">August 3, 2026</time>' article.html >/dev/null && \
               grep -F 'href="https://app.agroai-pilot.com">Open Enterprise Portal</a>' article.html >/dev/null && \
               grep -F 'href="https://agroai-pilot.com/book-a-demo">Book a Demo</a>' article.html >/dev/null && \
               grep -F '<section class="enterprise-portal">' article.html >/dev/null && \
               grep -F 'Run your operation through the AGRO-AI Enterprise Portal.' article.html >/dev/null && \
               grep -F 'date:"San Francisco, California — August 3, 2026"' newsroom.js >/dev/null && \
               ! grep -F 'Article not found' article.html >/dev/null && \
               grep -F 'Introducing AGRO-AI Field Intelligence' field.html >/dev/null && \
               grep -F 'AGRO-AI connects with John Deere Operations Center™' deere.html >/dev/null; then
              python3 - <<'PY'
from pathlib import Path
html = Path('article.html').read_text()
closing = html.index('<section class="closing">')
enterprise = html.index('<section class="enterprise-portal">')
if enterprise <= closing:
    raise SystemExit('Enterprise Portal section is not separate and after the builder CTA')
PY
              ready=1
              break
            fi

            echo "Attempt ${attempt}: article=${article_status} news=${news_status} script=${script_status} field=${field_status} deere=${deere_status}"
            sleep 5
          done

          test "$ready" = "1"

      - name: Report verified live publication
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --body $'✅ **Platform API article refinements verified live.**\n\n- Article and News card show August 3, 2026.\n- Open Enterprise Portal and Book a Demo are present in the article header.\n- The Enterprise Portal CTA is a separate section after Start building with AGRO-AI.\n- The newsroom, Field Intelligence article, and John Deere article remain live.\n- No backend, billing, authentication, database, or application routes were changed.'

      - name: Report publication failure
        if: ${{ failure() }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --body $'❌ **Platform API article refinement deployment failed verification.**\n\nDo not treat the update as complete until a later production proof succeeds.'

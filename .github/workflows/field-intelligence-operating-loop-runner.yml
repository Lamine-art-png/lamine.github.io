name: Field Intelligence Operating Loop Verification

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: field-intelligence-operating-loop-verification
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       github.event.issue.number == 399 &&
       github.event.comment.user.login == 'Lamine-art-png' &&
       contains(github.event.comment.body, '/verify-fi-operating-loop'))
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Announce verification
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/issues/399/comments -f body="Field Intelligence operating-loop verification started on exact head d97702907cf0d85f807a5f3a6db76becc196296f. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: actions/checkout@v4
        with:
          ref: d97702907cf0d85f807a5f3a6db76becc196296f
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agroai_api/requirements.txt

      - name: Install backend dependencies
        working-directory: agroai_api
        run: python -m pip install -q -r requirements.txt pytest

      - name: Compile and import backend
        working-directory: agroai_api
        run: |
          python -m compileall -q app
          python -c "from app.api.v1 import api_router; assert api_router is not None"

      - name: Verify durable observation-to-task contract
        working-directory: agroai_api
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -p no:debugging -q -x --tb=short \
            tests/unit/test_field_intelligence_operating_loop_runtime.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: figma-enterprise-v4/package-lock.json

      - name: Install exact portal dependencies
        working-directory: figma-enterprise-v4
        run: npm ci --no-audit --no-fund

      - name: Verify Field Intelligence and localization contracts
        working-directory: figma-enterprise-v4
        run: |
          npm run test:field-intelligence
          npm run test:i18n

      - name: Build exact production portal
        working-directory: figma-enterprise-v4
        env:
          VITE_API_BASE_URL: https://api.agroai-pilot.com
          VITE_DEPLOYMENT_ENVIRONMENT: production
        run: npm run build

      - name: Report success
        if: success() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/issues/399/comments -f body="✅ Exact head d97702907cf0d85f807a5f3a6db76becc196296f passed backend compile/import, durable task contract, Field Intelligence contracts, localization inventory, and the production portal build."

      - name: Report failure
        if: failure() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/issues/399/comments -f body="❌ Exact-head verification failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

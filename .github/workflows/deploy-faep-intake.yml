name: Deploy FAEP Intake

on:
  push:
    branches: ["main"]
    paths:
      - "cloudflare/faep-intake-worker/**"
      - ".github/workflows/deploy-faep-intake.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faep-intake-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate FAEP source and custom domain
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/faep-intake-worker/src/index.js
          node --check cloudflare/faep-intake-worker/src/subdomain.js
          grep -F 'faep.agroai-pilot.com' cloudflare/faep-intake-worker/wrangler.toml >/dev/null
          grep -F 'custom_domain = true' cloudflare/faep-intake-worker/wrangler.toml >/dev/null
          grep -F 'Onde a AGRO-AI pode ajudar na sua operação?' cloudflare/faep-intake-worker/src/index.js >/dev/null
          grep -F 'contact@agroai-pilot.com' cloudflare/faep-intake-worker/src/index.js >/dev/null
          grep -F 'https://api.agroai-pilot.com/v1/sales/contact' cloudflare/faep-intake-worker/src/index.js >/dev/null

      - name: Deploy FAEP intake
        shell: bash
        run: npx --yes wrangler@4.107.0 deploy --config cloudflare/faep-intake-worker/wrangler.toml

      - name: Verify live Portuguese page and intake endpoint
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            page_code="$(curl -sS -L --max-time 20 -D page.headers -o page.html -w '%{http_code}' 'https://faep.agroai-pilot.com/' || true)"
            api_code="$(curl -sS --max-time 20 -D api.headers -o api.json -w '%{http_code}' 'https://faep.agroai-pilot.com/api/faep' || true)"
            if [ "$page_code" = "200" ] && [ "$api_code" = "200" ] && \
               grep -Fi 'x-agroai-faep-intake: active' page.headers >/dev/null && \
               grep -F 'Onde a AGRO-AI pode ajudar na sua operação?' page.html >/dev/null && \
               grep -Fi 'x-agroai-faep-intake: active' api.headers >/dev/null && \
               grep -F 'contact@agroai-pilot.com' api.json >/dev/null; then
              ready=1
              break
            fi
            sleep 4
          done
          if [ "$ready" != "1" ]; then
            echo '=== FAEP page headers ==='
            cat page.headers || true
            echo '=== FAEP API headers ==='
            cat api.headers || true
            echo '=== FAEP API body ==='
            cat api.json || true
            exit 1
          fi
          echo 'FAEP intake page and endpoint are live.'

      - name: One-time email delivery test
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[faep-email-test]') }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 30 -D post.headers -o post.json -w '%{http_code}' \
            -X POST 'https://faep.agroai-pilot.com/api/faep' \
            -H 'content-type: application/json' \
            --data-binary '{"nome":"TESTE TÉCNICO FAEP - ChatGPT","whatsapp":"(41) 99999-9999","atividade":"Soja, milho, trigo e outros grãos","area":"201–500 hectares","problema":"Teste técnico de entrega do formulário FAEP. Pode desconsiderar esta mensagem.","interesse":"Minha fazenda","consentimento":"Autorizado","website":""}')"
          test "$code" = "201"
          grep -Fi 'x-agroai-notification: delivered' post.headers >/dev/null
          grep -F '"ok":true' post.json >/dev/null
          echo 'FAEP email delivery test confirmed.'

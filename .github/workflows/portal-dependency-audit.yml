name: Portal Dependency Audit Isolation

on:
  pull_request:
    branches: ["ops/portal-dependency-audit-base"]
    paths:
      - figma-enterprise-v4/package.json
      - figma-enterprise-v4/package-lock.json
      - .github/workflows/portal-dependency-audit.yml

permissions:
  contents: write

concurrency:
  group: portal-dependency-audit-isolated
  cancel-in-progress: true

jobs:
  remediate:
    if: github.event.pull_request.head.ref == 'ops/portal-dependency-audit-353'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/portal-dependency-audit-353
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: figma-enterprise-v4/package-lock.json

      - name: Apply compatible security upgrades
        working-directory: figma-enterprise-v4
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set \
            dependencies.react-router=7.18.2 \
            devDependencies.vite=6.4.3 \
            pnpm.overrides.vite=6.4.3
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          set +e
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          set -e
          npm ci --no-audit --no-fund

      - name: Require zero known vulnerabilities
        working-directory: figma-enterprise-v4
        run: |
          npm audit --omit=dev --audit-level=low
          npm audit --audit-level=low

      - name: Validate portal and production build
        working-directory: figma-enterprise-v4
        env:
          VITE_API_BASE_URL: https://app.agroai-pilot.com
          VITE_DEPLOYMENT_ENVIRONMENT: production
          VITE_BUILD_SHA: ${{ github.sha }}
        run: |
          npm run test:i18n
          npm run build

      - name: Commit verified lockfile remediation
        shell: bash
        run: |
          set -euo pipefail
          git add figma-enterprise-v4/package.json figma-enterprise-v4/package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Dependency remediation is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove portal dependency vulnerabilities"
          git push origin HEAD:ops/portal-dependency-audit-353

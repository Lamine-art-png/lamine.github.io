name: Form Notification Gateway Hotfix

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/form-notification-gateway-hotfix.yml"
      - "cloudflare/form-notification-gateway/**"

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: macos-14
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate gateway
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/form-notification-gateway/src/index.js

      - name: Deploy durable form routes
        shell: bash
        run: npx --yes wrangler@4.107.0 deploy --config cloudflare/form-notification-gateway/wrangler.toml

      - name: Wait for route activation
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            code="$(curl -sS --max-time 20 -D apply-health.headers -o apply-health.json -w '%{http_code}' https://agroai-pilot.com/api/apply || true)"
            if [ "$code" = "200" ] && \
               grep -Fi 'x-agroai-form-gateway: active' apply-health.headers >/dev/null && \
               jq -e '.ok == true and .notification_recipient == "contact@agroai-pilot.com"' apply-health.json >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = "1"

      - name: Verify real Careers form path
        shell: bash
        run: |
          set -euo pipefail
          marker="careers-real-path-${GITHUB_RUN_ID}"
          printf '%s\n' '%PDF-1.4' 'AGRO-AI notification gateway verification' '%%EOF' > verification-resume.pdf
          code="$(curl -sS --connect-timeout 10 --max-time 60 \
            -D careers.headers -o careers.json -w '%{http_code}' \
            -X POST https://agroai-pilot.com/api/apply \
            -H 'accept: application/json' \
            -F 'fullName=AGRO-AI real form verification' \
            -F 'email=contact@agroai-pilot.com' \
            -F 'phone=' \
            -F 'location=San Francisco, California' \
            -F 'school=Internal production verification' \
            -F 'linkedin=https://www.linkedin.com/company/agro-ai-inc/' \
            -F 'portfolio=https://agroai-pilot.com' \
            -F 'availability=Immediate' \
            -F 'role=Product Intern' \
            -F 'eligibility=Internal verification' \
            -F 'whyAgroAi=Internal production verification only' \
            -F 'relevantExperience=Notification delivery verification' \
            -F 'roleContribution=Verify real browser path' \
            -F 'proofOfWork=https://agroai-pilot.com' \
            -F "aiWorkflow=${marker}" \
            -F 'toolsUsed=GitHub Actions' \
            -F 'proudestWork=Reliable production delivery' \
            -F 'workingStyle=Fast and evidence driven' \
            -F 'agroAiImprovement=Reliable inbox notifications' \
            -F 'resume=@verification-resume.pdf;type=application/pdf')"
          echo "Careers HTTP ${code}"
          cat careers.json; echo
          test "$code" = "200"
          grep -Fi 'x-agroai-form-gateway: active' careers.headers >/dev/null
          grep -Fi 'x-agroai-notification: delivered' careers.headers >/dev/null
          echo "CAREERS_MARKER=${marker}" >> "$GITHUB_ENV"

      - name: Verify real Book a Demo path
        shell: bash
        run: |
          set -euo pipefail
          marker="demo-real-path-${GITHUB_RUN_ID}"
          jq -n --arg marker "$marker" '{
            fullName: "AGRO-AI demo form verification",
            email: "contact@agroai-pilot.com",
            phone: "",
            farmName: "AGRO-AI Inc.",
            location: "San Francisco, California",
            acreage: 1,
            cropTypes: "Internal verification",
            currentIrrigation: "Internal verification",
            mainChallenges: $marker,
            preferredCallTime: "No follow-up required",
            status: "pending"
          }' > demo.json
          code="$(curl -sS --connect-timeout 10 --max-time 60 \
            -D demo.headers -o demo-response.json -w '%{http_code}' \
            -X POST https://agroai-pilot.com/api/consultation-requests \
            -H 'content-type: application/json' \
            -H 'accept: application/json' \
            --data @demo.json)"
          echo "Demo HTTP ${code}"
          cat demo-response.json; echo
          test "$code" -ge 200
          test "$code" -lt 300
          grep -Fi 'x-agroai-form-gateway: active' demo.headers >/dev/null
          grep -Fi 'x-agroai-notification: delivered' demo.headers >/dev/null
          echo "DEMO_MARKER=${marker}" >> "$GITHUB_ENV"

      - name: Final route proof
        shell: bash
        run: |
          set -euo pipefail
          echo "Careers marker: ${CAREERS_MARKER}"
          echo "Demo marker: ${DEMO_MARKER}"
          curl -fsS https://api.agroai-pilot.com/v1/health | jq -e '.status == "ok"' >/dev/null

name: Patch Platform API Stripe interval billing

on:
  push:
    branches:
      - fix/platform-api-stripe-interval-billing

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/platform-api-stripe-interval-billing
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply interval-safe Stripe overage configuration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          config = Path('agroai_api/app/core/config.py')
          text = config.read_text()
          if 'PLATFORM_API_STRIPE_DEVELOPER_MONTHLY_OVERAGE_PRICE_ID' not in text:
              text = text.replace(
                  '    PLATFORM_API_STRIPE_DEVELOPER_OVERAGE_PRICE_ID: str = ""\n',
                  '    PLATFORM_API_STRIPE_DEVELOPER_OVERAGE_PRICE_ID: str = ""  # legacy fallback; do not use for live activation\n'
                  '    PLATFORM_API_STRIPE_DEVELOPER_MONTHLY_OVERAGE_PRICE_ID: str = ""\n'
                  '    PLATFORM_API_STRIPE_DEVELOPER_ANNUAL_OVERAGE_PRICE_ID: str = ""\n',
              )
              text = text.replace(
                  '    PLATFORM_API_STRIPE_SCALE_OVERAGE_PRICE_ID: str = ""\n',
                  '    PLATFORM_API_STRIPE_SCALE_OVERAGE_PRICE_ID: str = ""  # legacy fallback; do not use for live activation\n'
                  '    PLATFORM_API_STRIPE_SCALE_MONTHLY_OVERAGE_PRICE_ID: str = ""\n'
                  '    PLATFORM_API_STRIPE_SCALE_ANNUAL_OVERAGE_PRICE_ID: str = ""\n',
              )
              config.write_text(text)

          billing = Path('agroai_api/app/api/v1/platform_billing.py')
          text = billing.read_text()
          old = '''def _overage_price_for(plan: PlatformApiPlan) -> str | None:\n    if not plan.overages_allowed:\n        return None\n    config_key = plan.stripe_overage_price_config_key\n    value = str(getattr(settings, config_key, "") or "").strip() if config_key else ""\n    if not value:\n        raise HTTPException(status_code=503, detail={"code": "api_plan_overage_price_not_configured"})\n    return value\n'''
          new = '''def _overage_price_for(plan: PlatformApiPlan, interval: str) -> str | None:\n    if not plan.overages_allowed:\n        return None\n    interval_config_keys = {\n        ("developer", "monthly"): "PLATFORM_API_STRIPE_DEVELOPER_MONTHLY_OVERAGE_PRICE_ID",\n        ("developer", "annual"): "PLATFORM_API_STRIPE_DEVELOPER_ANNUAL_OVERAGE_PRICE_ID",\n        ("scale", "monthly"): "PLATFORM_API_STRIPE_SCALE_MONTHLY_OVERAGE_PRICE_ID",\n        ("scale", "annual"): "PLATFORM_API_STRIPE_SCALE_ANNUAL_OVERAGE_PRICE_ID",\n    }\n    interval_key = interval_config_keys.get((plan.plan_identifier, interval))\n    interval_value = str(getattr(settings, interval_key, "") or "").strip() if interval_key else ""\n    if interval_value:\n        return interval_value\n    # Never permit a single mixed-interval overage Price in live mode. Checkout\n    # requires the metered Price interval to match the selected base interval.\n    if settings.PLATFORM_API_STRIPE_MODE == "live":\n        raise HTTPException(\n            status_code=503,\n            detail={"code": "api_plan_interval_overage_price_not_configured", "interval": interval},\n        )\n    config_key = plan.stripe_overage_price_config_key\n    legacy_value = str(getattr(settings, config_key, "") or "").strip() if config_key else ""\n    if not legacy_value:\n        raise HTTPException(status_code=503, detail={"code": "api_plan_overage_price_not_configured"})\n    return legacy_value\n'''
          if old in text:
              text = text.replace(old, new)
          elif 'def _overage_price_for(plan: PlatformApiPlan, interval: str)' not in text:
              raise SystemExit('Expected _overage_price_for implementation not found')
          text = text.replace(
              '        overage_price_id = _overage_price_for(plan)\n',
              '        overage_price_id = _overage_price_for(plan, payload.billing_interval)\n',
          )
          billing.write_text(text)

          env = Path('agroai_api/.env.example')
          text = env.read_text()
          if 'PLATFORM_API_STRIPE_DEVELOPER_MONTHLY_OVERAGE_PRICE_ID=' not in text:
              text = text.replace(
                  'PLATFORM_API_STRIPE_DEVELOPER_OVERAGE_PRICE_ID=\n',
                  'PLATFORM_API_STRIPE_DEVELOPER_OVERAGE_PRICE_ID= # legacy non-live fallback only\n'
                  'PLATFORM_API_STRIPE_DEVELOPER_MONTHLY_OVERAGE_PRICE_ID=\n'
                  'PLATFORM_API_STRIPE_DEVELOPER_ANNUAL_OVERAGE_PRICE_ID=\n',
              )
              text = text.replace(
                  'PLATFORM_API_STRIPE_SCALE_OVERAGE_PRICE_ID=\n',
                  'PLATFORM_API_STRIPE_SCALE_OVERAGE_PRICE_ID= # legacy non-live fallback only\n'
                  'PLATFORM_API_STRIPE_SCALE_MONTHLY_OVERAGE_PRICE_ID=\n'
                  'PLATFORM_API_STRIPE_SCALE_ANNUAL_OVERAGE_PRICE_ID=\n',
              )
              env.write_text(text)

          tests = Path('agroai_api/tests/unit/test_platform_api_billing_product.py')
          text = tests.read_text()
          if 'PLATFORM_API_STRIPE_DEVELOPER_MONTHLY_OVERAGE_PRICE_ID' not in text:
              text = text.replace(
                  '    monkeypatch.setattr(settings, "PLATFORM_API_STRIPE_DEVELOPER_OVERAGE_PRICE_ID", "price_server_overage")\n',
                  '    monkeypatch.setattr(settings, "PLATFORM_API_STRIPE_DEVELOPER_OVERAGE_PRICE_ID", "price_server_overage")\n'
                  '    monkeypatch.setattr(settings, "PLATFORM_API_STRIPE_DEVELOPER_MONTHLY_OVERAGE_PRICE_ID", "price_server_overage_monthly")\n'
                  '    monkeypatch.setattr(settings, "PLATFORM_API_STRIPE_DEVELOPER_ANNUAL_OVERAGE_PRICE_ID", "price_server_overage_annual")\n',
              )
              text = text.replace(
                  '{"price": "price_server_overage"},\n',
                  '{"price": "price_server_overage_monthly"},\n',
                  1,
              )
              anchor = '\ndef test_checkout_idempotency_is_local_payload_bound_and_organization_scoped('
              annual_test = '''\n\ndef test_annual_checkout_uses_annual_metered_overage_price(client, db, monkeypatch):\n    user, organization, *_ = _project_and_key(db)\n    organization.verification_status = "approved"\n    _developer_plan(db)\n    _enable_checkout(monkeypatch)\n    captured: dict = {}\n    monkeypatch.setattr(platform_billing.stripe.Customer, "create", lambda **_kwargs: {"id": "cus_annual"})\n    monkeypatch.setattr(\n        platform_billing.stripe.checkout.Session,\n        "create",\n        lambda **kwargs: captured.update(kwargs) or {"id": "cs_annual", "url": "https://checkout.stripe.test/annual"},\n    )\n    response = client.post(\n        "/v1/platform/developer/billing/checkout",\n        headers={\n            "Authorization": f"Bearer {create_access_token({'sub': user.id})}",\n            "Idempotency-Key": "checkout-annual-1",\n        },\n        json={"plan": "developer", "billing_interval": "annual"},\n    )\n    assert response.status_code == 200\n    assert captured["line_items"] == [\n        {"price": "price_server_annual", "quantity": 1},\n        {"price": "price_server_overage_annual"},\n    ]\n'''
              if anchor not in text:
                  raise SystemExit('Test insertion anchor not found')
              text = text.replace(anchor, annual_test + anchor, 1)
              tests.write_text(text)
          PY

      - name: Validate patched billing code
        shell: bash
        run: |
          python -m compileall -q agroai_api/app agroai_api/tests/unit/test_platform_api_billing_product.py
          grep -q 'PLATFORM_API_STRIPE_DEVELOPER_MONTHLY_OVERAGE_PRICE_ID' agroai_api/app/core/config.py
          grep -q '_overage_price_for(plan, payload.billing_interval)' agroai_api/app/api/v1/platform_billing.py
          grep -q 'price_server_overage_annual' agroai_api/tests/unit/test_platform_api_billing_product.py

      - name: Commit interval-safe implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agroai_api/app/core/config.py agroai_api/app/api/v1/platform_billing.py agroai_api/.env.example agroai_api/tests/unit/test_platform_api_billing_product.py
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'Make Platform API overage prices interval-safe'
          git push origin HEAD:fix/platform-api-stripe-interval-billing

name: Direct Platform API News Production Repair

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-platform-api-news-direct.yml"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/live-news-verification-trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agroai-platform-api-news-direct-repair
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy and verify exact Platform API News route
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'ops/live-newsroom-deploy-verified')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ARTICLE_URL: https://agroai-pilot.com/news/agro-ai-platform-api-launch
      COVER_URL: https://agroai-pilot.com/news/agro-ai-platform-api-launch/cover.svg
      LOGO_URL: https://agroai-pilot.com/news/agro-ai-platform-api-launch/agro-ai-logo.png
      NEWS_URL: https://agroai-pilot.com/news
      SCRIPT_URL: https://agroai-pilot.com/news/agroai-news-card-restore.js
      FIELD_URL: https://agroai-pilot.com/news/introducing-agro-ai-field-intelligence
      DEERE_URL: https://agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center
    steps:
      - uses: actions/checkout@v4

      - name: Require repository Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Validate only exact News routes
        run: |
          set -euo pipefail
          test -s client/public/news/agro-ai-platform-api-launch/index.html
          test -s client/public/news/agro-ai-platform-api-launch/cover.svg
          grep -F "AGRO-AI launches the Platform API for agriculture builders" client/public/news/agro-ai-platform-api-launch/index.html >/dev/null
          grep -F 'PLATFORM_API_ARTICLE_PATH = "/news/agro-ai-platform-api-launch"' cloudflare/field-intelligence-launch-worker/src/index.ts >/dev/null
          grep -F 'pattern = "agroai-pilot.com/news/agro-ai-platform-api-launch"' cloudflare/field-intelligence-launch-worker/wrangler.toml >/dev/null
          grep -F 'pattern = "agroai-pilot.com/news/agro-ai-platform-api-launch/*"' cloudflare/field-intelligence-launch-worker/wrangler.toml >/dev/null
          ! grep -F 'pattern = "agroai-pilot.com/news*"' cloudflare/field-intelligence-launch-worker/wrangler.toml
          ! grep -F 'pattern = "agroai-pilot.com/news/*"' cloudflare/field-intelligence-launch-worker/wrangler.toml

      - name: Dry-run exact Worker bundle
        run: npx --yes wrangler@4.107.0 deploy --dry-run --config cloudflare/field-intelligence-launch-worker/wrangler.toml

      - name: Deploy exact Worker routes
        run: npx --yes wrangler@4.107.0 deploy --config cloudflare/field-intelligence-launch-worker/wrangler.toml

      - name: Verify literal public URLs without query parameters
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            article_status="$(curl -sS -L -H 'Cache-Control: no-cache' -D article.headers -o article.html -w '%{http_code}' --max-time 25 "${ARTICLE_URL}" || true)"
            cover_status="$(curl -sS -L -H 'Cache-Control: no-cache' -D cover.headers -o cover.svg -w '%{http_code}' --max-time 25 "${COVER_URL}" || true)"
            logo_status="$(curl -sS -L -H 'Cache-Control: no-cache' -D logo.headers -o logo.bin -w '%{http_code}' --max-time 25 "${LOGO_URL}" || true)"
            news_status="$(curl -sS -L -H 'Cache-Control: no-cache' -D news.headers -o news.html -w '%{http_code}' --max-time 25 "${NEWS_URL}" || true)"
            script_status="$(curl -sS -L -H 'Cache-Control: no-cache' -o newsroom.js -w '%{http_code}' --max-time 25 "${SCRIPT_URL}" || true)"
            field_status="$(curl -sS -L -H 'Cache-Control: no-cache' -o field.html -w '%{http_code}' --max-time 25 "${FIELD_URL}" || true)"
            deere_status="$(curl -sS -L -H 'Cache-Control: no-cache' -o deere.html -w '%{http_code}' --max-time 25 "${DEERE_URL}" || true)"

            article_title=false; grep -F "AGRO-AI launches the Platform API for agriculture builders" article.html >/dev/null && article_title=true
            article_hero=false; grep -F "Build agricultural products on the AGRO-AI intelligence layer." article.html >/dev/null && article_hero=true
            article_not_found=false; grep -F "Article not found" article.html >/dev/null && article_not_found=true
            cover_marker=false; grep -Fi 'x-agroai-asset-source: reviewed-platform-api-cover' cover.headers >/dev/null && cover_marker=true
            logo_marker=false; grep -Fi 'x-agroai-asset-source: official-repository-logo' logo.headers >/dev/null && logo_marker=true
            newsroom_marker=false; grep -Fi 'x-agroai-newsroom-source: native-pages-origin' news.headers >/dev/null && newsroom_marker=true
            card_marker=false; grep -F '/news/agro-ai-platform-api-launch' newsroom.js >/dev/null && card_marker=true
            field_marker=false; grep -F "Introducing AGRO-AI Field Intelligence" field.html >/dev/null && field_marker=true
            deere_marker=false; grep -F "AGRO-AI connects with John Deere Operations Center™" deere.html >/dev/null && deere_marker=true

            echo "Attempt ${attempt}: statuses article=${article_status} cover=${cover_status} logo=${logo_status} news=${news_status} script=${script_status} field=${field_status} deere=${deere_status}; markers title=${article_title} hero=${article_hero} not_found=${article_not_found} cover=${cover_marker} logo=${logo_marker} news=${newsroom_marker} card=${card_marker} field=${field_marker} deere=${deere_marker}"

            if [ "$article_status" = 200 ] && [ "$cover_status" = 200 ] && [ "$logo_status" = 200 ] && \
               [ "$news_status" = 200 ] && [ "$script_status" = 200 ] && [ "$field_status" = 200 ] && [ "$deere_status" = 200 ] && \
               [ "$article_title" = true ] && [ "$article_hero" = true ] && [ "$article_not_found" = false ] && \
               [ "$cover_marker" = true ] && [ "$logo_marker" = true ] && [ "$newsroom_marker" = true ] && \
               [ "$card_marker" = true ] && [ "$field_marker" = true ] && [ "$deere_marker" = true ]; then
              echo "platform_api_article=verified_live_at_literal_url"
              echo "existing_news_routes=verified_live"
              exit 0
            fi
            sleep 5
          done

          echo "Literal Platform API News URL verification failed"
          cat article.headers || true
          head -100 article.html || true
          cat news.headers || true
          exit 1

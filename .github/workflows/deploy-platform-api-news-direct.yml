name: Direct Platform API News Production Repair

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-platform-api-news-direct.yml"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/live-news-verification-trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agroai-platform-api-news-direct-repair
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy and verify exact Platform API News route
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'ops/live-newsroom-deploy-verified')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ARTICLE_URL: https://agroai-pilot.com/news/agro-ai-platform-api-launch
      COVER_URL: https://agroai-pilot.com/news/agro-ai-platform-api-launch/cover.svg
      LOGO_URL: https://agroai-pilot.com/news/agro-ai-platform-api-launch/agro-ai-logo.png
      NEWS_URL: https://agroai-pilot.com/news
      SCRIPT_URL: https://agroai-pilot.com/news/agroai-news-card-restore.js
      FIELD_URL: https://agroai-pilot.com/news/introducing-agro-ai-field-intelligence
      DEERE_URL: https://agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center
    steps:
      - uses: actions/checkout@v4

      - name: Require repository Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Validate only exact News routes
        run: |
          set -euo pipefail
          test -s client/public/news/agro-ai-platform-api-launch/index.html
          test -s client/public/news/agro-ai-platform-api-launch/cover.svg
          grep -F "AGRO-AI launches the Platform API for agriculture builders" client/public/news/agro-ai-platform-api-launch/index.html >/dev/null
          grep -F 'PLATFORM_API_ARTICLE_PATH = "/news/agro-ai-platform-api-launch"' cloudflare/field-intelligence-launch-worker/src/index.ts >/dev/null
          grep -F 'pattern = "agroai-pilot.com/news/agro-ai-platform-api-launch"' cloudflare/field-intelligence-launch-worker/wrangler.toml >/dev/null
          grep -F 'pattern = "agroai-pilot.com/news/agro-ai-platform-api-launch/*"' cloudflare/field-intelligence-launch-worker/wrangler.toml >/dev/null
          ! grep -F 'pattern = "agroai-pilot.com/news*"' cloudflare/field-intelligence-launch-worker/wrangler.toml
          ! grep -F 'pattern = "agroai-pilot.com/news/*"' cloudflare/field-intelligence-launch-worker/wrangler.toml

      - name: Dry-run exact Worker bundle
        run: npx --yes wrangler@4.107.0 deploy --dry-run --config cloudflare/field-intelligence-launch-worker/wrangler.toml

      - name: Deploy exact Worker routes
        run: npx --yes wrangler@4.107.0 deploy --config cloudflare/field-intelligence-launch-worker/wrangler.toml

      - name: Verify public article and regressions
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            bust="$(date +%s)-${attempt}"
            article_status="$(curl -sS -L -D article.headers -o article.html -w '%{http_code}' --max-time 25 "${ARTICLE_URL}?verify=${bust}" || true)"
            cover_status="$(curl -sS -L -D cover.headers -o cover.svg -w '%{http_code}' --max-time 25 "${COVER_URL}?verify=${bust}" || true)"
            logo_status="$(curl -sS -L -D logo.headers -o logo.bin -w '%{http_code}' --max-time 25 "${LOGO_URL}?verify=${bust}" || true)"
            news_status="$(curl -sS -L -D news.headers -o news.html -w '%{http_code}' --max-time 25 "${NEWS_URL}?verify=${bust}" || true)"
            script_status="$(curl -sS -L -o newsroom.js -w '%{http_code}' --max-time 25 "${SCRIPT_URL}?verify=${bust}" || true)"
            field_status="$(curl -sS -L -o field.html -w '%{http_code}' --max-time 25 "${FIELD_URL}?verify=${bust}" || true)"
            deere_status="$(curl -sS -L -o deere.html -w '%{http_code}' --max-time 25 "${DEERE_URL}?verify=${bust}" || true)"

            if [ "$article_status" = 200 ] && [ "$cover_status" = 200 ] && [ "$logo_status" = 200 ] && \
               [ "$news_status" = 200 ] && [ "$script_status" = 200 ] && [ "$field_status" = 200 ] && [ "$deere_status" = 200 ] && \
               grep -F "AGRO-AI launches the Platform API for agriculture builders" article.html >/dev/null && \
               grep -F "Build agricultural products on the AGRO-AI intelligence layer." article.html >/dev/null && \
               ! grep -F "Article not found" article.html >/dev/null && \
               grep -Fi 'x-agroai-asset-source: reviewed-platform-api-cover' cover.headers >/dev/null && \
               grep -Fi 'x-agroai-asset-source: official-repository-logo' logo.headers >/dev/null && \
               grep -Fi 'x-agroai-newsroom-source: native-pages-origin' news.headers >/dev/null && \
               grep -F '/news/agro-ai-platform-api-launch' newsroom.js >/dev/null && \
               grep -F "Introducing AGRO-AI Field Intelligence" field.html >/dev/null && \
               grep -F "AGRO-AI connects with John Deere Operations Center™" deere.html >/dev/null; then
              echo "platform_api_article=verified_live"
              echo "existing_news_routes=verified_live"
              exit 0
            fi

            echo "Attempt ${attempt}: article=${article_status} cover=${cover_status} logo=${logo_status} news=${news_status} script=${script_status} field=${field_status} deere=${deere_status}"
            sleep 5
          done

          echo "Platform API News live verification failed"
          cat article.headers || true
          head -80 article.html || true
          cat cover.headers || true
          cat logo.headers || true
          cat news.headers || true
          exit 1

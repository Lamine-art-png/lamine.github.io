name: I18n Edge Release
# Deploys the API edge i18n routes and proves the deterministic localization
# release contract in production. Customers switch languages using catalogs
# shipped with the portal; live translation generation is an internal
# authoring/diagnostic path (I18n Exact Backend Proof, manual) and is not a
# release gate.

on:
  push:
    branches: ["main"]
    paths:
      - "cloudflare/edge-gateway/src/i18n-*.ts"
      - "cloudflare/edge-gateway/src/edge-main-v3.ts"
      - "cloudflare/edge-gateway/src/edge-main-v3.test.ts"
      - "agroai_api/app/api/v1/i18n.py"
      - "agroai_api/app/services/i18n_translation_resilience.py"
      - "agroai_api/app/services/local_ui_translation.py"
      - "agroai_api/app/services/model_router.py"
      - "shared/ui-*.json"
      - "shared/supported-locales.json"
      - "shared/localization/**"
      - "scripts/i18n-verify-production-catalogs.mjs"
      - "scripts/i18n-catalog-identity.mjs"
      - ".github/workflows/deploy-i18n-edge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agroai-i18n-edge-production
  cancel-in-progress: true

env:
  API_URL: https://app.agroai-pilot.com
  PORTAL_ORIGIN: https://app.agroai-pilot.com
  I18N_EDGE_RELEASE: provider-chain-v2

jobs:
  deploy:
    name: Deploy edge and prove deterministic locale release
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/edge-gateway/package-lock.json

      - name: Validate exact edge bundle
        working-directory: cloudflare/edge-gateway
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check

      - name: Validate local translation backend syntax
        run: |
          set -euo pipefail
          python -m py_compile \
            agroai_api/app/services/local_ui_translation.py \
            agroai_api/app/services/model_router.py

      - name: Deploy exact edge bundle
        working-directory: cloudflare/edge-gateway
        run: |
          set -euo pipefail
          npx wrangler deploy --config ../../wrangler.toml

      - name: Wait for exact i18n edge release on custom domain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            status="$(curl --silent --show-error --max-time 20 -D release-headers.txt -o release-body.json -w '%{http_code}' \
              -H "Origin: ${PORTAL_ORIGIN}" \
              -H 'Content-Type: application/json' \
              -d '{"locale":"sq","source":{"__release_probe__":"probe"}}' \
              "${API_URL}/v1/i18n/catalog" || true)"
            marker="$(tr -d '\r' < release-headers.txt | sed -n 's/^x-agroai-i18n-release:[[:space:]]*//Ip' | head -1)"
            if [ "$status" = "409" ] && [ "$marker" = "$I18N_EDGE_RELEASE" ]; then
              echo "exact_i18n_edge_release=${marker}"
              exit 0
            fi
            sleep 2
          done
          echo "Exact i18n edge release marker not visible on custom domain"
          cat release-headers.txt || true
          cat release-body.json || true
          exit 1

      - name: Smoke production edge
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 "${API_URL}/v1/edge-health" | jq -e '.status == "ok"' >/dev/null

      - name: Prove deterministic locale release contract
        # Registry == release manifest; every advertised locale's exact release
        # catalog artifact (catalogSha256) is deployed; locale
        # observability accepts events. Retries while Pages converges.
        shell: bash
        run: |
          set -euo pipefail
          # Up to 15 minutes for the Pages deployment of new catalog artifacts.
          AGROAI_VERIFY_ATTEMPTS=45 node scripts/i18n-verify-production-catalogs.mjs | tee locale-release-contract.json

      - name: Upload immutable locale evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-release-contract-${{ github.sha }}
          path: |
            locale-release-contract.json
            release-headers.txt
            release-body.json
          if-no-files-found: ignore
          retention-days: 30

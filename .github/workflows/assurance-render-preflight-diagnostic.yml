name: Diagnose Assurance Render Preflight

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/assurance-render-preflight-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_ID: ${{ vars.PRODUCTION_API_SERVICE_ID }}
      QUEUE_CONSUMER_TOKEN: ${{ secrets.QUEUE_CONSUMER_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish diagnostic start
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc '{state:"success",context:"assurance-render-preflight/github-token",description:"GitHub status token available"}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Check Queue consumer token
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${QUEUE_CONSUMER_TOKEN:-}" ]] || exit 41
          curl --fail-with-body --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $QUEUE_CONSUMER_TOKEN" \
            "https://api.agroai-pilot.com/v1/internal/release/health" >/dev/null
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc '{state:"success",context:"assurance-render-preflight/queue-token",description:"Production Queue token available"}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Check Render API key presence
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${RENDER_API_KEY:-}" ]] || exit 42
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc '{state:"success",context:"assurance-render-preflight/render-key",description:"Render API key available"}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Check Render service ID presence
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SERVICE_ID:-}" ]] || exit 43
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc '{state:"success",context:"assurance-render-preflight/service-id",description:"Render production service ID available"}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Verify Render service authorization
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" \
            "https://api.render.com/v1/services/$SERVICE_ID" | jq -e '.id != null' >/dev/null
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc '{state:"success",context:"assurance-render-preflight/render-auth",description:"Render production service authorization valid"}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

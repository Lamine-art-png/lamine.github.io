name: Real form notification diagnostic

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/real-form-notification-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-14
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: agroai
    steps:
      - uses: actions/checkout@v4

      - name: Extract live browser form targets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://agroai-pilot.com/assets/index-CpZJz-hm.js -o bundle.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('bundle.js').read_text(errors='replace')

          for marker in ['function y$(){','preferredCallTime','Submit Demo Request','/api/apply']:
              at=text.find(marker)
              print(f'=== MARKER {marker} @ {at} ===')
              if at >= 0:
                  print(text[max(0,at-700):at+5000])

          print('=== URL-LIKE STRING LITERALS ===')
          values=[]
          for m in re.finditer(r'(["\'])(.{0,260}?)\1', text):
              value=m.group(2)
              low=value.lower()
              if any(token in low for token in ['/api','/v1','demo','contact','sales','request']):
                  values.append(value)
          for value in sorted(set(values)):
              if len(value) <= 300:
                  print(value)
          PY

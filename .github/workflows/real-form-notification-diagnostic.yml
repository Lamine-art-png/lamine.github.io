name: Real form notification diagnostic

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/real-form-notification-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-14
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: agroai
    steps:
      - uses: actions/checkout@v4

      - name: Inspect live Cloudflare deployment and recipient
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl -fsS -H "$auth" "$api" > project.json
          curl -fsS -H "$auth" "${api}/deployments?env=production&per_page=3" > deployments.json
          echo '=== DEPLOYMENTS ==='
          jq -r '.result[] | [.id,.created_on,.modified_on,.deployment_trigger.type,.deployment_trigger.metadata.commit_hash,.uses_functions,.latest_stage.status] | @tsv' deployments.json
          echo '=== PROJECT ==='
          jq -r --arg target 'contact@agroai-pilot.com' '[.result.name,.result.subdomain, (.result.domains|join(",")),.result.deployment_configs.production.env_vars.APPLICATION_TO_EMAIL.type, (.result.deployment_configs.production.env_vars.APPLICATION_TO_EMAIL.value == $target), .result.production_script_name] | @tsv' project.json

      - name: Inspect exact live application routes
        shell: bash
        run: |
          set -euo pipefail
          for path in /api/apply /api/apply/; do
            safe="$(printf '%s' "$path" | tr '/?' '__')"
            code="$(curl -sS -D "${safe}.headers" -o "${safe}.body" -w '%{http_code}' "https://agroai-pilot.com${path}")"
            echo "=== ${path} HTTP ${code} ==="
            grep -Ei '^(HTTP/|x-agroai|cf-ray|content-type|server|date):' "${safe}.headers" || true
            cat "${safe}.body"; echo
          done

      - name: Inspect browser form submission targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live
          curl -fsSL https://agroai-pilot.com/careers -o live/careers.html
          curl -fsSL https://agroai-pilot.com/book-a-demo -o live/book-demo.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import re, subprocess

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.src=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      d=dict(attrs)
                      if d.get('src'): self.src.append(d['src'])

          for name, base in [('careers','https://agroai-pilot.com/careers'),('book-demo','https://agroai-pilot.com/book-a-demo')]:
              html=Path(f'live/{name}.html').read_text(errors='replace')
              p=P(); p.feed(html)
              print(f'=== {name} scripts ===', p.src)
              chunks=[html]
              for i,src in enumerate(p.src):
                  full=urljoin(base,src)
                  if urlparse(full).hostname != 'agroai-pilot.com':
                      continue
                  out=f'live/{name}-{i}.js'
                  subprocess.run(['curl','-fsSL',full,'-o',out],check=True)
                  chunks.append(Path(out).read_text(errors='replace'))
              text='\n'.join(chunks)
              patterns=[r'/api/apply/?',r'/v1/sales/contact',r'https://api\.agroai-pilot\.com[^"\']*',r'application received',r'demo request received']
              for pat in patterns:
                  found=sorted(set(re.findall(pat,text,re.I)))
                  print(pat,found[:20])
              for needle in ['/api/apply','/v1/sales/contact','Application received','demo request']:
                  start=0
                  shown=0
                  while shown<5:
                      at=text.lower().find(needle.lower(),start)
                      if at<0: break
                      print(f'CONTEXT {needle}:',text[max(0,at-260):at+620])
                      start=at+len(needle); shown+=1
          PY

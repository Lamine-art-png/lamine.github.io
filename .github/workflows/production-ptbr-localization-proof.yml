name: Production global localization proof

on:
  push:
    branches: ["main"]
    paths:
      - "figma-enterprise-v4/**"
      - "shared/localization/**"
      - "shared/supported-locales.json"
      - "platform-api/legal/localized/**"
      - "cloudflare/platform-api-marketing-worker/**"
      - ".github/workflows/production-ptbr-localization-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ptbr-localization-proof
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: figma-enterprise-v4/package-lock.json
      - name: Install portal test dependencies
        working-directory: figma-enterprise-v4
        run: |
          npm ci
          npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Install Chromium
        working-directory: figma-enterprise-v4
        run: npx playwright install --with-deps chromium
      - name: Wait for exact production localization release and prove it in Chromium
        working-directory: figma-enterprise-v4
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if npx playwright test tests/browser/production-global-localization.spec.mjs --config=playwright.contract.config.ts --browser=chromium --reporter=line; then
              exit 0
            fi
            echo "Production localization proof not converged yet (attempt $attempt/24); retrying in 30s..."
            sleep 30
          done
          exit 1

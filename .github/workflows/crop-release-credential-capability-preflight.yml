name: Crop Release - Nonsecret Credential Capability Preflight
on:
  push:
    branches: [ops/crop-release-capability-preflight-20261014]
permissions:
  contents: read
jobs:
  presence-only:
    runs-on: ubuntu-latest
    env:
      INFRA_GITHUB_TOKEN: ${{ secrets.INFRA_GITHUB_TOKEN }}
      GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      FIELD_STAGING_R2_ACCESS_KEY_ID: ${{ secrets.FIELD_STAGING_R2_ACCESS_KEY_ID }}
      FIELD_STAGING_R2_SECRET_ACCESS_KEY: ${{ secrets.FIELD_STAGING_R2_SECRET_ACCESS_KEY }}
      FIELD_STAGING_DATABASE_URL: ${{ secrets.FIELD_STAGING_DATABASE_URL }}
      FIELD_STAGING_DEPLOY_HOOK: ${{ secrets.FIELD_STAGING_DEPLOY_HOOK }}
      FIELD_STAGING_SMOKE_TOKEN: ${{ secrets.FIELD_STAGING_SMOKE_TOKEN }}
      PRODUCTION_API_SERVICE_ID: ${{ vars.PRODUCTION_API_SERVICE_ID }}
      PRODUCTION_PORTAL_PROJECT: ${{ vars.PRODUCTION_PORTAL_PROJECT }}
      PRODUCTION_DATABASE_RESOURCE_FINGERPRINT: ${{ vars.PRODUCTION_DATABASE_RESOURCE_FINGERPRINT }}
      PRODUCTION_OBJECT_BUCKET_FINGERPRINT: ${{ vars.PRODUCTION_OBJECT_BUCKET_FINGERPRINT }}
    steps:
      - name: Log Boolean-only credential availability (no values)
        run: |
          python3 - <<'PY'
          import os,json
          names=[
           "INFRA_GITHUB_TOKEN","GH_ADMIN_TOKEN","RENDER_API_KEY",
           "CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID",
           "CLOUDFLARE_R2_ACCESS_KEY_ID","CLOUDFLARE_R2_SECRET_ACCESS_KEY",
           "FIELD_STAGING_R2_ACCESS_KEY_ID","FIELD_STAGING_R2_SECRET_ACCESS_KEY",
           "FIELD_STAGING_DATABASE_URL","FIELD_STAGING_DEPLOY_HOOK",
           "FIELD_STAGING_SMOKE_TOKEN","PRODUCTION_API_SERVICE_ID",
           "PRODUCTION_PORTAL_PROJECT","PRODUCTION_DATABASE_RESOURCE_FINGERPRINT",
           "PRODUCTION_OBJECT_BUCKET_FINGERPRINT"]
          present={k:bool((os.getenv(k) or "").strip()) for k in names}
          print(json.dumps({"presence_only":True,"secrets_written":False,"changes_to_resources":False,"present":present},sort_keys=True))
          PY

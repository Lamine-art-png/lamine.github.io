name: Assurance Portal Build Diagnostics

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/assurance-portal-build-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  NODE_VERSION: "22"
  API_URL: https://app.agroai-pilot.com

jobs:
  diagnose:
    name: Diagnose Assurance portal build gate
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: figma-enterprise-v4/package-lock.json

      - name: Install portal dependencies
        working-directory: figma-enterprise-v4
        run: npm ci

      - name: Publish dependency success
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc '{state:"success",context:"assurance-portal-build/npm-ci",description:"Portal dependencies installed"}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Run portal i18n gate
        working-directory: figma-enterprise-v4
        run: npm run test:i18n

      - name: Publish i18n success
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc '{state:"success",context:"assurance-portal-build/i18n",description:"Portal i18n gate passed"}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Run Assurance route isolation contract
        working-directory: figma-enterprise-v4
        run: node tests/assurance-route-isolation-contract.mjs

      - name: Publish Assurance contract success
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc '{state:"success",context:"assurance-portal-build/assurance-contract",description:"Assurance route isolation contract passed"}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Build production portal
        working-directory: figma-enterprise-v4
        env:
          VITE_API_BASE_URL: ${{ env.API_URL }}
          VITE_DEPLOYMENT_ENVIRONMENT: production
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Publish build success
        run: |
          grep -Fx 'AGROAI_ASSURANCE_SIDEBAR_V2_VISIBLE' figma-enterprise-v4/dist/assurance-sidebar-v2-release.txt >/dev/null
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc '{state:"success",context:"assurance-portal-build/build",description:"Production portal build passed"}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Publish diagnostic final status
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            state=success
            description="Assurance portal build diagnostics passed"
          else
            state=failure
            description="Assurance portal build diagnostics failed"
          fi
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc --arg state "$state" --arg context assurance-portal-build-diagnostics --arg description "$description" '{state:$state,context:$context,description:$description}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

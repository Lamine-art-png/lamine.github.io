name: Form Page Runtime Linux E2E

on:
  pull_request:
    branches: ["main"]
    paths:
      - "cloudflare/form-page-runtime/**"
      - ".github/workflows/form-page-runtime-linux-e2e.yml"

permissions:
  contents: read

jobs:
  real-browser:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy current runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/form-page-runtime/src/index.js
          npx --yes wrangler@4.107.0 deploy --config cloudflare/form-page-runtime/wrangler.toml

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm --silent --no-save install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exercise live forms in Chromium
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '%PDF-1.4' 'AGRO-AI browser proof' '%%EOF' > resume.pdf
          cat > verify.mjs <<'JS'
          import { chromium } from 'playwright';
          import path from 'node:path';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ userAgent: 'Mozilla/5.0 AGROAIProductionBrowserProof' });

          async function firstForm(page, route) {
            const errors = [];
            page.on('console', message => {
              if (message.type() === 'error') errors.push(`console:${message.text()}`);
            });
            page.on('pageerror', error => errors.push(`pageerror:${error.message}`));
            const response = await page.goto(`https://agroai-pilot.com${route}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
            if (!response || response.status() !== 200) throw new Error(`${route} page HTTP ${response?.status()}`);
            await page.waitForLoadState('networkidle').catch(() => {});
            const runtime = await page.evaluate(() => ({ active: window.__AGROAI_FORMS_RUNTIME__ === true, path: location.pathname }));
            const form = page.locator('form').first();
            try {
              await form.waitFor({ state: 'visible', timeout: 45000 });
            } catch {
              const title = await page.title();
              const body = (await page.locator('body').innerText().catch(() => '')).slice(0, 4000);
              throw new Error(`${route} has no visible form. runtime=${JSON.stringify(runtime)} title=${title} errors=${errors.join(' | ')} body=${body}`);
            }
            if (!runtime.active) throw new Error(`${route} authoritative runtime did not execute.`);
            return form;
          }

          async function fillAll(form, marker) {
            const fields = form.locator('input, textarea, select');
            for (let index = 0; index < await fields.count(); index += 1) {
              const field = fields.nth(index);
              if (await field.isDisabled().catch(() => true)) continue;
              const name = (await field.getAttribute('name')) || '';
              const type = ((await field.getAttribute('type')) || '').toLowerCase();
              const tag = await field.evaluate(node => node.tagName.toLowerCase());
              if (!name || ['hidden','button','submit'].includes(type)) continue;
              if (type === 'file') {
                await field.setInputFiles(path.resolve('resume.pdf'));
                continue;
              }
              if (type === 'checkbox' || type === 'radio') {
                await field.check().catch(() => {});
                continue;
              }
              if (tag === 'select') {
                const options = await field.locator('option').evaluateAll(nodes => nodes.map(node => ({ value: node.value, disabled: node.disabled })));
                const choice = options.find(option => option.value && !option.disabled)?.value;
                if (choice) await field.selectOption(choice);
                continue;
              }
              let text = marker;
              const lower = name.toLowerCase();
              if (lower.includes('email')) text = 'contact@agroai-pilot.com';
              else if (lower.includes('name')) text = 'AGRO-AI real browser verification';
              else if (lower.includes('location')) text = 'San Francisco, California';
              else if (lower.includes('phone')) text = '4155550100';
              else if (lower.includes('acre') || type === 'number') text = '1';
              else if (lower.includes('linkedin')) text = 'https://www.linkedin.com/company/agro-ai-inc/';
              else if (lower.includes('portfolio') || lower.includes('proof')) text = 'https://agroai-pilot.com';
              await field.fill(text);
            }
          }

          async function verifyCareers() {
            const page = await context.newPage();
            const leaks = [];
            page.on('request', request => {
              if (request.method() === 'POST' && /formspree\.io|workers\.dev/.test(request.url())) leaks.push(request.url());
            });
            const form = await firstForm(page, '/careers');
            const marker = `careers-real-browser-${Date.now()}`;
            await fillAll(form, marker);
            const responsePromise = page.waitForResponse(response => response.request().method() === 'POST' && new URL(response.url()).pathname === '/api/apply', { timeout: 45000 });
            await form.locator('button[type="submit"],input[type="submit"]').first().click();
            const response = await responsePromise;
            if (response.status() !== 200) throw new Error(`Careers POST ${response.status()}: ${await response.text()}`);
            if (response.headers()['x-agroai-notification'] !== 'delivered') throw new Error('Careers delivery was not confirmed.');
            await page.getByText('Application received', { exact: true }).waitFor({ timeout: 20000 });
            if (leaks.length) throw new Error(`Careers leaked to ${leaks.join(', ')}`);
            console.log(`CAREERS_MARKER=${marker}`);
            await page.close();
          }

          async function verifyDemo() {
            const page = await context.newPage();
            const leaks = [];
            page.on('request', request => {
              if (request.method() === 'POST' && /formspree\.io|workers\.dev/.test(request.url())) leaks.push(request.url());
            });
            const form = await firstForm(page, '/book-a-demo');
            const marker = `demo-real-browser-${Date.now()}`;
            await fillAll(form, marker);
            const responsePromise = page.waitForResponse(response => response.request().method() === 'POST' && new URL(response.url()).pathname === '/api/demo-request', { timeout: 45000 });
            await form.locator('button[type="submit"],input[type="submit"]').first().click();
            const response = await responsePromise;
            if (response.status() !== 201) throw new Error(`Demo POST ${response.status()}: ${await response.text()}`);
            if (response.headers()['x-agroai-notification'] !== 'delivered') throw new Error('Demo delivery was not confirmed.');
            await page.getByText('Demo request received', { exact: true }).waitFor({ timeout: 20000 });
            if (leaks.length) throw new Error(`Demo leaked to ${leaks.join(', ')}`);
            console.log(`DEMO_MARKER=${marker}`);
            await page.close();
          }

          try {
            await verifyCareers();
            await verifyDemo();
          } finally {
            await browser.close();
          }
          JS
          node verify.mjs | tee browser-proof.log
          grep -F 'CAREERS_MARKER=' browser-proof.log
          grep -F 'DEMO_MARKER=' browser-proof.log

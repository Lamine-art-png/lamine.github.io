name: Locale Browser Contract CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  locale-browser-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: figma-enterprise-v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: figma-enterprise-v4/package-lock.json
      - name: Install portal and browser test dependencies
        run: |
          npm ci
          npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate localization contract
        run: |
          set -o pipefail
          npm run test:i18n 2>&1 | tee locale-i18n-contract.log
      - name: Build production portal
        run: |
          set -o pipefail
          npm run build 2>&1 | tee locale-production-build.log
      - name: Run global locale and operation contracts
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 > locale-vite-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/settings >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat locale-vite-preview.log
              exit 1
            fi
            sleep 1
          done
          set +e
          npx playwright test \
            tests/browser/locale-migration.spec.mjs \
            tests/browser/locale-preference-sync.spec.mjs \
            tests/browser/global-language-switching.spec.mjs \
            tests/browser/operation-workspaces.spec.mjs \
            --config=playwright.contract.config.ts --browser=chromium --reporter=line 2>&1 | tee locale-playwright.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload locale browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locale-browser-contract
          path: |
            figma-enterprise-v4/locale-i18n-contract.log
            figma-enterprise-v4/locale-production-build.log
            figma-enterprise-v4/locale-vite-preview.log
            figma-enterprise-v4/locale-playwright.log
            figma-enterprise-v4/test-results
          if-no-files-found: ignore
          retention-days: 2

  publish-reviewed-news:
    name: Publish reviewed AGRO-AI news now
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.title == '[ops] Publish reviewed AGRO-AI news now' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Report start and require credentials
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --body '⏳ Production publication started from trusted `main`.'
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Deploy merged news Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.107.0 deploy --config cloudflare/field-intelligence-launch-worker/wrangler.toml

      - name: Verify newsroom and both articles live
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 48); do
            bust="$(date +%s)-${attempt}"
            news_code="$(curl -sS -L -D news.headers -o news.html -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news?verify=${bust}" || true)"
            script_code="$(curl -sS -L -o cards.js -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news/agroai-news-card-restore.js?verify=${bust}" || true)"
            jd_code="$(curl -sS -L -o jd.html -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center?verify=${bust}" || true)"
            cover_code="$(curl -sS -L -D cover.headers -o cover.webp -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center/cover.webp?verify=${bust}" || true)"
            fi_code="$(curl -sS -L -o fi.html -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news/introducing-agro-ai-field-intelligence?verify=${bust}" || true)"
            if [ "$news_code" = 200 ] && [ "$script_code" = 200 ] && [ "$jd_code" = 200 ] && [ "$cover_code" = 200 ] && [ "$fi_code" = 200 ] && \
               grep -F 'Introducing AGRO-AI Field Intelligence' cards.js >/dev/null && \
               grep -F '/news/introducing-agro-ai-field-intelligence' cards.js >/dev/null && \
               grep -F 'AGRO-AI connects with John Deere Operations Center™' cards.js >/dev/null && \
               grep -F '/news/agro-ai-connected-john-deere-operations-center' cards.js >/dev/null && \
               grep -F 'AGRO-AI connects with John Deere Operations Center™' jd.html >/dev/null && \
               grep -F 'Agricultural operations do not suffer from a shortage of data.' jd.html >/dev/null && \
               grep -F "Access is initiated through the user's Operations Center connection." jd.html >/dev/null && \
               grep -F '<meta name="author" content="AGRO-AI"' jd.html >/dev/null && \
               grep -F 'Introducing AGRO-AI Field Intelligence' fi.html >/dev/null && \
               grep -Fi 'content-type: image/webp' cover.headers >/dev/null && \
               test "$(wc -c < cover.webp)" -gt 10000; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1

      - name: Report success
        shell: bash
        run: |
          gh pr comment "$PR_NUMBER" --body $'✅ **Published and verified live.**\n\n- Reviewed John Deere article and supplied cover are live.\n- Field Intelligence article is live and its newsroom card is restored.\n- Existing newsroom links remain available.'

      - name: Report failure
        if: ${{ failure() }}
        shell: bash
        run: |
          gh pr comment "$PR_NUMBER" --body '❌ Production publication or live verification failed.'

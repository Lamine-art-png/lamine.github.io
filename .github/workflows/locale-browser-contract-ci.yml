name: Locale Browser Contract CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: locale-browser-contract-ci-global
  cancel-in-progress: true

jobs:
  locale-browser-contract:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.title != '[ops] Publish reviewed AGRO-AI news now' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: figma-enterprise-v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: figma-enterprise-v4/package-lock.json
      - name: Install portal and browser test dependencies
        run: |
          npm ci
          npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate localization contract
        run: |
          set -o pipefail
          npm run test:i18n 2>&1 | tee locale-i18n-contract.log
      - name: Build production portal
        run: |
          set -o pipefail
          npm run build 2>&1 | tee locale-production-build.log
      - name: Run global locale and operation contracts
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 > locale-vite-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/settings >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat locale-vite-preview.log
              exit 1
            fi
            sleep 1
          done
          set +e
          npx playwright test \
            tests/browser/locale-migration.spec.mjs \
            tests/browser/locale-preference-sync.spec.mjs \
            tests/browser/global-language-switching.spec.mjs \
            tests/browser/operation-workspaces.spec.mjs \
            --config=playwright.contract.config.ts --browser=chromium --reporter=line 2>&1 | tee locale-playwright.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload locale browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locale-browser-contract
          path: |
            figma-enterprise-v4/locale-i18n-contract.log
            figma-enterprise-v4/locale-production-build.log
            figma-enterprise-v4/locale-vite-preview.log
            figma-enterprise-v4/locale-playwright.log
            figma-enterprise-v4/test-results
          if-no-files-found: ignore
          retention-days: 2

  publish-reviewed-news:
    name: Publish reviewed AGRO-AI news now
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.title == '[ops] Publish reviewed AGRO-AI news now' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Report start and require credentials
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --body '⏳ Production publication started from trusted `main` on the isolated ARM runner.'
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Deploy merged news Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.107.0 deploy --config cloudflare/field-intelligence-launch-worker/wrangler.toml

      - name: Verify newsroom and both articles live
        shell: bash
        run: |
          set -u
          : > diagnostics.txt
          ok=0
          for attempt in $(seq 1 3); do
            bust="$(date +%s)-${attempt}"
            news_code="$(curl -sS -L -D news.headers -o news.html -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news?verify=${bust}" || true)"
            script_code="$(curl -sS -L -o cards.js -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news/agroai-news-card-restore.js?verify=${bust}" || true)"
            jd_code="$(curl -sS -L -o jd.html -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center?verify=${bust}" || true)"
            cover_code="$(curl -sS -L -D cover.headers -o cover.webp -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center/cover.webp?verify=${bust}" || true)"
            fi_code="$(curl -sS -L -o fi.html -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news/introducing-agro-ai-field-intelligence?verify=${bust}" || true)"

            flag(){ if "$@" >/dev/null 2>&1; then echo true; else echo false; fi; }
            news_html="$(flag grep -Eiq '<!doctype html|<html' news.html)"
            news_inject="$(flag grep -Fq 'agroai-news-card-restore.js' news.html)"
            news_source="$(flag grep -Fiq 'x-agroai-newsroom-source: native-pages-origin' news.headers)"
            cards_field_title="$(flag grep -Fq 'Introducing AGRO-AI Field Intelligence' cards.js)"
            cards_field_path="$(flag grep -Fq '/news/introducing-agro-ai-field-intelligence' cards.js)"
            cards_jd_title="$(flag grep -Fq 'AGRO-AI connects with John Deere Operations Center™' cards.js)"
            cards_jd_path="$(flag grep -Fq '/news/agro-ai-connected-john-deere-operations-center' cards.js)"
            jd_title="$(flag grep -Fq 'AGRO-AI connects with John Deere Operations Center™' jd.html)"
            jd_lead="$(flag grep -Fq 'Agricultural operations do not suffer from a shortage of data.' jd.html)"
            jd_access="$(flag grep -Fq "Access is initiated through the user's Operations Center connection." jd.html)"
            jd_author="$(flag grep -Fq '<meta name="author" content="AGRO-AI"' jd.html)"
            field_title="$(flag grep -Fq 'Introducing AGRO-AI Field Intelligence' fi.html)"
            cover_webp="$(flag grep -Fiq 'content-type: image/webp' cover.headers)"
            cover_bytes="$(wc -c < cover.webp 2>/dev/null || echo 0)"

            cat > diagnostics.txt <<EOF
          attempt=${attempt}
          news_code=${news_code}
          script_code=${script_code}
          john_deere_code=${jd_code}
          john_deere_cover_code=${cover_code}
          field_intelligence_code=${fi_code}
          news_html=${news_html}
          news_restoration_script_injected=${news_inject}
          news_native_origin_header=${news_source}
          cards_field_title=${cards_field_title}
          cards_field_path=${cards_field_path}
          cards_john_deere_title=${cards_jd_title}
          cards_john_deere_path=${cards_jd_path}
          john_deere_title=${jd_title}
          john_deere_reviewed_lead=${jd_lead}
          john_deere_approved_access=${jd_access}
          john_deere_author=${jd_author}
          field_intelligence_article=${field_title}
          john_deere_cover_webp=${cover_webp}
          john_deere_cover_bytes=${cover_bytes}
          EOF

            if [ "$news_code" = 200 ] && [ "$script_code" = 200 ] && [ "$jd_code" = 200 ] && [ "$cover_code" = 200 ] && [ "$fi_code" = 200 ] && \
               [ "$news_html" = true ] && [ "$news_inject" = true ] && [ "$news_source" = true ] && \
               [ "$cards_field_title" = true ] && [ "$cards_field_path" = true ] && [ "$cards_jd_title" = true ] && [ "$cards_jd_path" = true ] && \
               [ "$jd_title" = true ] && [ "$jd_lead" = true ] && [ "$jd_access" = true ] && [ "$jd_author" = true ] && \
               [ "$field_title" = true ] && [ "$cover_webp" = true ] && [ "$cover_bytes" -gt 10000 ]; then
              ok=1
              break
            fi
            sleep 5
          done
          cat diagnostics.txt
          test "$ok" = 1

      - name: Report success
        shell: bash
        run: |
          gh pr comment "$PR_NUMBER" --body $'✅ **Published and verified live.**\n\n- Reviewed John Deere article and supplied cover are live.\n- Field Intelligence article is live and its newsroom card is restored.\n- Existing newsroom links remain available.'

      - name: Report failure with exact diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          body="$(cat diagnostics.txt 2>/dev/null || printf 'diagnostics file unavailable')"
          gh pr comment "$PR_NUMBER" --body $'❌ **Production verification failed.**\n\n```text\n'"$body"$'\n```'

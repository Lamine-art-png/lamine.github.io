name: Locale Browser Contract CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  locale-browser-contract:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.title != '[ops] Verify newsroom hotfix' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: figma-enterprise-v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: figma-enterprise-v4/package-lock.json
      - name: Install portal and browser test dependencies
        run: |
          npm ci
          npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate localization contract
        run: |
          set -o pipefail
          npm run test:i18n 2>&1 | tee locale-i18n-contract.log
      - name: Build production portal
        run: |
          set -o pipefail
          npm run build 2>&1 | tee locale-production-build.log
      - name: Run global locale and operation contracts
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 > locale-vite-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/settings >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat locale-vite-preview.log
              exit 1
            fi
            sleep 1
          done
          set +e
          npx playwright test \
            tests/browser/locale-migration.spec.mjs \
            tests/browser/locale-preference-sync.spec.mjs \
            tests/browser/global-language-switching.spec.mjs \
            tests/browser/operation-workspaces.spec.mjs \
            --config=playwright.contract.config.ts --browser=chromium --reporter=line 2>&1 | tee locale-playwright.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload locale browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locale-browser-contract
          path: |
            figma-enterprise-v4/locale-i18n-contract.log
            figma-enterprise-v4/locale-production-build.log
            figma-enterprise-v4/locale-vite-preview.log
            figma-enterprise-v4/locale-playwright.log
            figma-enterprise-v4/test-results
          if-no-files-found: ignore
          retention-days: 2

  verify-newsroom-hotfix:
    name: Verify newsroom hotfix live
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.title == '[ops] Verify newsroom hotfix' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          mkdir -p /tmp/agroai-news-check
          cd /tmp/agroai-news-check
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify rendered newsroom and Deere article header
        run: |
          cd /tmp/agroai-news-check
          cat > verify.cjs <<'NODE'
          const { chromium } = require("playwright");

          const required = [
            "/news/agro-ai-connected-john-deere-operations-center",
            "/news/introducing-agro-ai-field-intelligence",
          ];
          const obsoletePath = "/news/john-deere-api-access";
          const obsoleteTitle = "AGRO-AI moves forward through John Deere API access process";

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });

            await page.goto("https://agroai-pilot.com/news", { waitUntil: "domcontentloaded", timeout: 45000 });
            await page.waitForFunction(
              () => document.documentElement.getAttribute("data-agroai-news-cards-restored") === "true",
              null,
              { timeout: 25000 },
            );
            const hrefs = await page.locator("a[href]").evaluateAll((links) =>
              links.map((link) => new URL(link.href).pathname.replace(/\/$/, "")),
            );
            for (const path of required) {
              if (!hrefs.includes(path)) throw new Error(`Missing rendered newsroom card: ${path}`);
            }
            if (hrefs.includes(obsoletePath)) throw new Error("Obsolete John Deere newsroom card still exists");
            const text = await page.locator("body").innerText();
            if (text.includes(obsoleteTitle)) throw new Error("Obsolete John Deere newsroom title still exists");

            await page.goto("https://agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center", {
              waitUntil: "domcontentloaded",
              timeout: 45000,
            });
            const socialCount = await page.locator("header .socials a.social").count();
            if (socialCount !== 3) throw new Error(`Expected 3 header social links, found ${socialCount}`);
            const footerSocialCount = await page.locator("footer a[href*='linkedin'], footer a[href*='instagram'], footer a[href*='youtube']").count();
            if (footerSocialCount !== 0) throw new Error("Social links remain in the footer");
            const logo = await page.locator("header img.logo").first().boundingBox();
            if (!logo || logo.width > 40 || logo.height > 40 || logo.width < 28 || logo.height < 28) {
              throw new Error(`Header logo is not fitted as a miniature: ${JSON.stringify(logo)}`);
            }
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node verify.cjs

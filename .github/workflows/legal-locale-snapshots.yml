name: Deterministic legal locale snapshots

on:
  push:
    branches: [fix/deterministic-localization-release]
    paths:
      - ".github/workflows/legal-locale-snapshots.yml"
      - "scripts/legal-i18n-generate.py"
      - "cloudflare/ollama-compat/src/index.js"
      - "wrangler.i18n-authoring.toml"
      - "shared/supported-locales.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legal-locale-snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      locales: ${{ steps.matrix.outputs.locales }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: matrix
        name: Resolve target locale matrix
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          m=json.load(open("shared/supported-locales.json"))
          locales=[x for x in (m.get("targetUiLocales") or []) if x not in ("auto","en")]
          print("locales="+json.dumps(locales,separators=(",",":")))
          PY
      - name: Render current canonical legal DOM
        shell: bash
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
          mkdir -p legal-rendered
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          for (const slug of ["terms-of-service", "privacy-policy"]) {
            const page = await browser.newPage({ locale: "en-US" });
            await page.goto(`https://agroai-pilot.com/${slug}`, { waitUntil: "networkidle", timeout: 60000 });
            await page.waitForTimeout(1200);
            fs.writeFileSync(`legal-rendered/${slug}.html`, await page.content());
            await page.close();
          }
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-legal-dom
          path: legal-rendered
          retention-days: 3

  author:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        locale: ${{ fromJSON(needs.prepare.outputs.locales) }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: canonical-legal-dom
          path: legal-rendered
      - name: Start isolated Workers AI legal authoring fallback
        shell: bash
        run: |
          set -euo pipefail
          nohup npx --yes wrangler@4.107.0 dev --remote --config wrangler.i18n-authoring.toml --port 8787 > /tmp/legal-authoring.log 2>&1 &
          echo $! > /tmp/legal-authoring.pid
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:8787/health | jq -e '.status=="ok" and .provider=="cloudflare-workers-ai"' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/legal-authoring.log
          exit 1
      - name: Generate localized Terms and Privacy snapshots
        run: |
          python3 scripts/legal-i18n-generate.py             --locale "${{ matrix.locale }}"             --endpoint http://127.0.0.1:8787/api/chat             --source-dir legal-rendered             --outdir legal-out
      - name: Stop isolated Workers AI legal authoring fallback
        if: always()
        run: |
          if [ -f /tmp/legal-authoring.pid ]; then
            kill "$(cat /tmp/legal-authoring.pid)" 2>/dev/null || true
          fi
      - name: Validate legal artifacts
        shell: bash
        run: |
          set -euo pipefail
          for slug in terms-of-service privacy-policy; do
            html="legal-out/${{ matrix.locale }}/${slug}.html"
            meta="legal-out/${{ matrix.locale }}/${slug}.meta.json"
            test -s "$html"
            test -s "$meta"
            grep -F 'name="agroai-legal-locale" content="${{ matrix.locale }}"' "$html" >/dev/null
            jq -e '.status=="complete-generated" and .locale=="${{ matrix.locale }}" and .translatedTextNodes >= 10 and (.sourceSha256|length)==64' "$meta" >/dev/null
          done
      - uses: actions/upload-artifact@v4
        with:
          name: legal-${{ matrix.locale }}
          path: legal-out/${{ matrix.locale }}
          retention-days: 3
          if-no-files-found: error

  promote:
    needs: [prepare, author]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: legal-*
          path: legal-artifacts
      - name: Install localized legal snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p platform-api/legal/localized
          for dir in legal-artifacts/legal-*; do
            locale="${dir##*/legal-}"
            mkdir -p "platform-api/legal/localized/${locale}"
            cp -R "${dir}/." "platform-api/legal/localized/${locale}/"
          done
      - name: Commit deterministic legal matrix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AGRO-AI Release Bot"
          git config user.email "release-bot@agroai-pilot.com"
          git add platform-api/legal/localized
          if git diff --cached --quiet; then
            echo "Legal locale snapshots already current"
            exit 0
          fi
          git commit -m "Generate deterministic legal locale snapshots"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Form Page Runtime Hotfix

on:
  pull_request:
    branches: ["main"]
    paths:
      - "cloudflare/form-page-runtime/**"
      - "scripts/forms-ui-proof.mjs"
      - ".github/workflows/form-page-runtime-hotfix.yml"

permissions:
  contents: read

jobs:
  deploy-and-e2e:
    runs-on: macos-14
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy authoritative form pages
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/form-page-runtime/src/index.js
          npx --yes wrangler@4.107.0 deploy --config cloudflare/form-page-runtime/wrangler.toml

      - name: Verify route injection
        shell: bash
        run: |
          set -euo pipefail
          for path in careers apply book-a-demo; do
            code="$(curl -sS --max-time 30 -D "${path}.headers" -o "${path}.html" -w '%{http_code}' "https://agroai-pilot.com/${path}")"
            test "$code" = "200"
            grep -Fi 'x-agroai-forms-runtime: active' "${path}.headers" >/dev/null
            grep -F '/agroai-forms-runtime.js' "${path}.html" >/dev/null
          done
          curl -fsS https://agroai-pilot.com/agroai-forms-runtime.js -o runtime.js
          grep -F 'runtimeVersion: "2026-08-03.2"' runtime.js >/dev/null

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm --silent --no-save install playwright@1.55.0
          npx playwright install chromium

      - name: Submit through actual live UI
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '%PDF-1.4' 'AGRO-AI production form verification' '%%EOF' > resume.pdf
          node scripts/forms-ui-proof.mjs | tee forms-ui-proof.log
          grep -F 'CAREERS_PATH=/apply' forms-ui-proof.log
          grep -F 'CAREERS_MARKER=' forms-ui-proof.log
          grep -F 'DEMO_MARKER=' forms-ui-proof.log

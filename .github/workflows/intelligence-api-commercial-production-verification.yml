name: Intelligence API Commercial Production Verification
# Post-release proof of the paid Intelligence API on the exact Render backend
# release: identity, readiness, live Stripe, provider-hidden runtime, pricing,
# routes, and authentication boundaries. Read-only: it never creates a charge,
# a Checkout Session, a key, or any customer resource.

on:
  push:
    branches:
      - main
    # Render builds the backend whenever agroai_api/** changes and only then
    # (resolve-backend-release-sha.sh walks the same tree). Every backend
    # release, not just commercial-file changes, can alter shared runtime
    # behaviour, so every backend release re-proves the commercial contract.
    paths:
      - agroai_api/**
      - .github/scripts/resolve-backend-release-sha.sh
      - figma-enterprise-v4/src/app/components/PlatformIntelligenceConsole.tsx
      - figma-enterprise-v4/src/app/platformIntelligenceCopy.ts
      - figma-enterprise-v4/src/app/routes.tsx
      - .github/workflows/intelligence-api-commercial-production-verification.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer backend release supersedes an in-flight proof of an older one.
  group: intelligence-api-commercial-production-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BACKEND_ORIGIN: https://api-preview.agroai-pilot.com
      PUBLIC_API_ORIGIN: https://api.agroai-pilot.com

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve exact backend release
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(bash .github/scripts/resolve-backend-release-sha.sh)"
          echo "EXPECTED_BACKEND_SHA=${expected_sha}" >> "$GITHUB_ENV"
          echo "expected_backend_sha=${expected_sha}"

      - name: Wait for exact Render release on every API origin
        shell: bash
        run: |
          set -euo pipefail
          for origin in "$BACKEND_ORIGIN" "$PUBLIC_API_ORIGIN"; do
            ready=0
            for attempt in $(seq 1 120); do
              payload="$(curl --fail --silent --show-error --max-time 25 "${origin}/v1/health" 2>/dev/null || true)"
              if PAYLOAD="$payload" python3 - <<'PY'
          import json, os, sys
          try:
              value = json.loads(os.environ["PAYLOAD"])
          except Exception:
              sys.exit(1)
          expected = os.environ["EXPECTED_BACKEND_SHA"]
          sys.exit(0 if value.get("status") == "ok" and value.get("build_sha") == expected else 1)
          PY
              then
                ready=1
                break
              fi
              sleep 10
            done
            if [ "$ready" -ne 1 ]; then
              echo "::error::${origin} never served backend release ${EXPECTED_BACKEND_SHA}. Last health: ${payload}"
              exit 1
            fi
            if [ "$origin" = "$BACKEND_ORIGIN" ]; then
              printf '%s\n' "$payload" > backend-health.json
            else
              printf '%s\n' "$payload" > public-api-health.json
            fi
            echo "${origin} serves ${EXPECTED_BACKEND_SHA}"
          done

      - name: Verify production readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "${BACKEND_ORIGIN}/v1/readiness" -o readiness.json
          python3 - <<'PY'
          import json
          value = json.load(open("readiness.json", encoding="utf-8"))
          assert value.get("status") == "ready", value
          assert (value.get("schema") or {}).get("ready") is True, value
          assert (value.get("production") or {}).get("ready") is True, value
          assert (value.get("production") or {}).get("blockers") == [], value
          print("production_readiness=green")
          PY

      - name: Verify Platform health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "${BACKEND_ORIGIN}/v1/platform/health" -o platform-health.json
          python3 - <<'PY'
          import json
          value = json.load(open("platform-health.json", encoding="utf-8"))
          assert value.get("status") == "ready", value
          assert value.get("platform_api_enabled") is True, value
          assert value.get("developer_control_plane_enabled") is True, value
          assert (value.get("rate_limiter") or {}).get("ready") is True, value
          # Self-service advisory keys must never be able to drive hardware.
          assert value.get("physical_irrigation_commands") == "disabled", value
          print("platform_health=green")
          PY

      - name: Verify live Stripe readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "${BACKEND_ORIGIN}/v1/platform/billing-readiness" -o billing-readiness.json
          python3 - <<'PY'
          import json
          value = json.load(open("billing-readiness.json", encoding="utf-8"))
          assert value.get("status") == "ready", value
          assert value.get("bootstrapped") is True, value
          assert value.get("complete_live_configuration") is True, value
          assert value.get("stripe_mode") == "live", value
          assert value.get("missing") == [], value
          assert value.get("invalid") == [], value
          flags = value.get("effective_flags") or {}
          assert flags.get("PLATFORM_API_BILLING_ENABLED") is True, value
          assert flags.get("PLATFORM_API_STRIPE_CHECKOUT_ENABLED") is True, value
          print("stripe_live_readiness=green")
          PY

      - name: Verify live Intelligence runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "${PUBLIC_API_ORIGIN}/v1/ai/status" -o ai-status.json
          python3 - <<'PY'
          import json
          value = json.load(open("ai-status.json", encoding="utf-8"))
          assert value.get("configured") is True, value
          assert value.get("fallback_active") is False, value
          assert value.get("missing_env") == [], value
          assert value.get("mode") != "offline", value
          assert bool(value.get("base_url_present")) is True, value
          # The public status speaks only for the AGRO-AI abstraction; the
          # serving vendor and model stay internal.
          assert value.get("provider") == "agroai", value
          assert value.get("model") == "agroai-intelligence-1", value
          print("intelligence_runtime=green")
          PY

      - name: Verify commercial Intelligence catalog
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "${PUBLIC_API_ORIGIN}/v1/intelligence/pricing" -o intelligence-pricing.json
          python3 - <<'PY'
          import json
          value = json.load(open("intelligence-pricing.json", encoding="utf-8"))
          assert value.get("model") == "agroai-intelligence-1", value
          assert value.get("currency") == "usd", value
          assert value.get("billing_unit") == "completed_intelligence_run", value
          assert value.get("failed_or_degraded_runs_are_refunded") is True, value
          actual = {item["id"]: item["price_cents"] for item in value.get("tasks", [])}
          expected = {
              "answer": 5,
              "field_diagnosis": 15,
              "irrigation_plan": 20,
              "crop_risk": 15,
              "evidence_analysis": 25,
              "decision": 25,
              "report": 50,
              "integration_diagnosis": 15,
              "readiness_analysis": 15,
          }
          assert actual == expected, (actual, expected)
          print("commercial_catalog=green")
          PY

      - name: Verify Intelligence Platform v1 discovery
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "${PUBLIC_API_ORIGIN}/v1/intelligence/capabilities" -o intelligence-capabilities.json
          curl --fail --silent --show-error --max-time 30 \
            "${PUBLIC_API_ORIGIN}/v1/intelligence/tools" -o intelligence-tools.json
          python3 - <<'PY'
          import json
          caps = json.load(open("intelligence-capabilities.json", encoding="utf-8"))
          assert caps.get("model") == "agroai-intelligence-1", caps
          assert caps.get("physical_execution") is False, caps
          assert caps["modalities"]["remote_urls"] is False, caps
          assert {"diagnosis", "recommendations", "risk_assessment", "financial_projection"} <= {
              item["name"] for item in caps["structured_output"]["builtin_schemas"]
          }, caps
          tools = json.load(open("intelligence-tools.json", encoding="utf-8"))["data"]
          assert tools and all(t["side_effects"] == "none" and t["physical_action"] is False for t in tools), tools
          assert all(t["required_scope"] == "intelligence:run" for t in tools), tools
          # The public abstraction never names a vendor or internal model.
          blob = json.dumps(caps).lower() + json.dumps(tools).lower()
          for vendor in ("openrouter", "ollama", "openai", "anthropic", "llama", "qwen", "glm", "deepseek", "workers-ai"):
              assert vendor not in blob, vendor
          print("intelligence_platform_discovery=green")
          PY

      - name: Verify deployed route contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "${BACKEND_ORIGIN}/openapi.json" -o openapi.json
          python3 - <<'PY'
          import json
          paths = json.load(open("openapi.json", encoding="utf-8")).get("paths", {})
          required = {
              "/v1/intelligence": "post",
              "/v1/intelligence/pricing": "get",
              "/v1/platform/developer/intelligence/access": "get",
              "/v1/platform/developer/wallet": "get",
              "/v1/platform/developer/wallet/sync": "post",
              "/v1/platform/developer/wallet/checkout": "post",
              "/v1/platform/developer/intelligence/bootstrap": "post",
              "/v1/platform/developer/intelligence/run": "post",
              "/v1/intelligence/capabilities": "get",
              "/v1/intelligence/tools": "get",
              "/v1/intelligence/tools/execute": "post",
              "/v1/intelligence/jobs": "post",
              "/v1/intelligence/jobs/{job_id}": "get",
              "/v1/intelligence/jobs/{job_id}/cancel": "post",
              "/v1/intelligence/runs/{run_id}": "get",
              "/v1/intelligence/usage": "get",
              "/v1/intelligence/sessions": "post",
              "/v1/intelligence/sessions/{session_id}": "delete",
              "/v1/intelligence/files": "post",
              "/v1/intelligence/knowledge/documents": "post",
              "/v1/intelligence/knowledge/search": "post",
          }
          for path, method in required.items():
              assert method in (paths.get(path) or {}), f"missing {method.upper()} {path}"
          print("commercial_route_contract=green")
          PY

      - name: Verify authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          # Every probe is unauthenticated or carries a syntactically valid but
          # nonexistent key, so none can reach inference or move money.
          probe() {
            local label="$1" method="$2" path="$3"; shift 3
            local code
            code="$(curl --silent --show-error --output "auth-${label}.json" --write-out '%{http_code}' \
              --max-time 30 -X "$method" -H 'Content-Type: application/json' "$@" \
              "${PUBLIC_API_ORIGIN}${path}" || true)"
            if [ "$code" != "401" ]; then
              echo "::error::${label}: expected 401 from ${method} ${path}, got ${code}"
              exit 1
            fi
            echo "${label}=401"
          }
          body='{"task":"field_diagnosis","question":"probe","input":{"crop":"almond"}}'
          probe machine-missing POST /v1/intelligence -H 'Idempotency-Key: unauthenticated-production-probe' --data "$body"
          probe machine-malformed POST /v1/intelligence -H 'Authorization: Bearer not-a-key' -H 'Idempotency-Key: malformed-production-probe' --data "$body"
          probe machine-unknown POST /v1/intelligence -H "Authorization: Bearer agro_live_$(printf '0%.0s' $(seq 1 40))" -H 'Idempotency-Key: unknown-key-production-probe' --data "$body"
          probe browser-access GET /v1/platform/developer/intelligence/access
          probe browser-wallet GET /v1/platform/developer/wallet
          probe browser-sync POST /v1/platform/developer/wallet/sync --data '{}'
          probe browser-checkout POST /v1/platform/developer/wallet/checkout -H 'Idempotency-Key: unauthenticated-production-probe' --data '{"amount_cents":500}'
          probe browser-bootstrap POST /v1/platform/developer/intelligence/bootstrap --data '{}'
          probe browser-run POST /v1/platform/developer/intelligence/run -H 'Idempotency-Key: unauthenticated-production-probe' --data "$body"
          probe jobs-create POST /v1/intelligence/jobs -H 'Idempotency-Key: unauthenticated-production-probe' --data "$body"
          probe jobs-read GET /v1/intelligence/jobs/run_probe
          probe runs-read GET /v1/intelligence/runs/run_probe
          probe usage-read GET /v1/intelligence/usage
          probe sessions-create POST /v1/intelligence/sessions --data '{}'
          probe knowledge-search POST /v1/intelligence/knowledge/search --data '{"collections":["probe"],"query":"probe"}'
          probe tool-execute POST /v1/intelligence/tools/execute -H "Authorization: Bearer agro_live_$(printf '0%.0s' $(seq 1 40))" --data '{"name":"units.convert.v1","arguments":{}}'
          probe console-usage GET /v1/platform/developer/intelligence/usage
          echo "authentication_boundary=green"

      - name: Record verified release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          summary = {
              "workflow_sha": os.environ["GITHUB_SHA"],
              "backend_release_sha": os.environ["EXPECTED_BACKEND_SHA"],
              "origins": [os.environ["BACKEND_ORIGIN"], os.environ["PUBLIC_API_ORIGIN"]],
              "checks": [
                  "exact_release_identity", "production_readiness", "platform_health",
                  "stripe_live_readiness", "intelligence_runtime", "commercial_catalog",
                  "intelligence_platform_discovery", "commercial_route_contract", "authentication_boundary",
              ],
              "money_moved": False,
          }
          json.dump(summary, open("verification-summary.json", "w"), indent=2)
          print(json.dumps(summary, indent=2))
          PY
          {
            echo "### Intelligence API commercial production proof"
            echo ""
            echo "Backend release \`${EXPECTED_BACKEND_SHA}\` verified on ${BACKEND_ORIGIN} and ${PUBLIC_API_ORIGIN}."
            echo "Read-only: no charge, Checkout Session, key, or customer resource was created."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable verification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          # Public, unauthenticated responses only; no credential is ever sent.
          name: intelligence-api-commercial-production-${{ github.sha }}
          path: |
            verification-summary.json
            backend-health.json
            public-api-health.json
            readiness.json
            platform-health.json
            billing-readiness.json
            ai-status.json
            intelligence-pricing.json
            intelligence-capabilities.json
            intelligence-tools.json
            openapi.json
            auth-*.json
          if-no-files-found: ignore
          retention-days: 90

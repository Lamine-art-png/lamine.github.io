name: Apply portal auth latency fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.head_ref == 'fix/portal-auth-latency-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portal-auth-latency-20260802
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agroai_api/requirements.txt
      - name: Apply fix
        run: python ops/apply_portal_auth_latency_fix.py
      - name: Install dependencies
        working-directory: agroai_api
        run: pip install -r requirements.txt pytest
      - name: Run auth regression suite
        working-directory: agroai_api
        env:
          APP_ENV: test
          ACCOUNT_VERIFICATION_MODE: disabled
        run: pytest -q tests/unit/test_auth_hot_path.py tests/unit/test_saas_foundation.py tests/unit/test_account_verification_security.py
      - name: Commit tested source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'AGRO-AI Production Fix'
          git config user.email 'contact@agroai-pilot.com'
          git add agroai_api/app/api/v1/auth.py agroai_api/tests/unit/test_auth_hot_path.py
          git commit -m 'Fix portal authentication latency hot path'
          git push origin HEAD:fix/portal-auth-latency-20260802

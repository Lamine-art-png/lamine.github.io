name: Market Intelligence Final Gate
# Full regression proof trigger: 2026-09-19 closeout

on:
  pull_request:
    paths:
      - 'agroai_api/app/api/v1/market_intelligence*.py'
      - 'agroai_api/app/services/market_data_providers.py'
      - 'agroai_api/app/services/market_intelligence*.py'
      - 'agroai_api/tests/test_market_intelligence*.py'
      - 'figma-enterprise-v4/src/app/components/MarketIntelligence*.tsx'
      - 'figma-enterprise-v4/src/app/routes.tsx'
      - 'figma-enterprise-v4/tests/market-intelligence*.mjs'
      - 'shared/ui-literals.en.*.json'
      - '.github/workflows/market-intelligence-final-gate.yml'

permissions:
  contents: read

jobs:
  final-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agroai_api/requirements.txt
      - name: Install backend
        working-directory: agroai_api
        run: pip install -r requirements.txt pytest==8.3.5
      - name: Compile and test Market Intelligence
        working-directory: agroai_api
        run: |
          python -m compileall -q app/api/v1/market_intelligence.py app/api/v1/market_intelligence_ingestion.py app/api/v1/market_intelligence_operations.py app/services/market_intelligence.py app/services/market_intelligence_ai.py app/services/market_data_providers.py app/services/market_intelligence_refresh.py
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -p no:debugging -q --tb=short tests/test_market_intelligence_engine.py tests/test_market_intelligence_api.py tests/test_market_intelligence_operations_contract.py tests/test_market_intelligence_providers_ga.py tests/test_market_intelligence_refresh_contract.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: figma-enterprise-v4/package-lock.json
      - name: Build and contract-test Enterprise Portal
        working-directory: figma-enterprise-v4
        env:
          VITE_API_BASE_URL: https://api.agroai-pilot.com
        run: |
          npm ci --no-audit --no-fund
          node tests/market-intelligence-contract.mjs
          node tests/market-intelligence-ga-management-contract.mjs
          python3 scripts/check_ui_literal_inventory.py --check
          npm run build

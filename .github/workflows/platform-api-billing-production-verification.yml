name: Platform API Billing Production Verification

on:
  push:
    branches:
      - main
    paths:
      - agroai_api/alembic/versions/028_platform_api_live_catalog.py
      - agroai_api/app/api/v1/platform_billing.py
      - agroai_api/app/core/config.py
      - .github/workflows/platform-api-billing-production-verification.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-api-billing-production-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BACKEND_ORIGIN: https://api-preview.agroai-pilot.com
      PUBLIC_API_ORIGIN: https://api.agroai-pilot.com

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve expected Render release
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(bash .github/scripts/resolve-backend-release-sha.sh)"
          echo "EXPECTED_BACKEND_SHA=${expected_sha}" >> "$GITHUB_ENV"

      - name: Wait for the exact Render release
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 120); do
            payload="$(curl --fail --silent --show-error --max-time 20 "${BACKEND_ORIGIN}/v1/health" 2>/dev/null || true)"
            if PAYLOAD="$payload" python3 - <<'PY'
          import json
          import os
          import sys

          try:
              value = json.loads(os.environ["PAYLOAD"])
          except Exception:
              sys.exit(1)
          expected = os.environ["EXPECTED_BACKEND_SHA"]
          sys.exit(0 if value.get("status") == "ok" and value.get("build_sha") == expected else 1)
          PY
            then
              printf '%s\n' "$payload" > backend-health.json
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1

      - name: Verify the live commercial catalog
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            code="$(curl --silent --show-error --output pricing.json --write-out '%{http_code}' --max-time 20 \
              "${PUBLIC_API_ORIGIN}/v1/platform/pricing" || true)"
            if [ "$code" = "200" ] && python3 - <<'PY'
          import json
          import sys

          value = json.load(open("pricing.json", encoding="utf-8"))
          if value.get("catalog_version") != "2026-07-provisional":
              sys.exit(1)
          plans = {item.get("identifier"): item for item in value.get("plans", [])}
          expected = {
              "developer": {
                  "monthly_price_cents": 14900,
                  "annual_price_cents": 143000,
                  "included_credits": 250000,
                  "overage_price_per_1000_cents": 75,
              },
              "scale": {
                  "monthly_price_cents": 74900,
                  "annual_price_cents": 719000,
                  "included_credits": 2000000,
                  "overage_price_per_1000_cents": 35,
              },
          }
          for identifier, fields in expected.items():
              plan = plans.get(identifier)
              if not plan:
                  sys.exit(1)
              if plan.get("status") != "private_preview" or not plan.get("overages_allowed"):
                  sys.exit(1)
              for key, expected_value in fields.items():
                  if plan.get(key) != expected_value:
                      sys.exit(1)
          print("live_catalog=ok")
          PY
            then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1

      - name: Verify Stripe webhook security boundary
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output webhook-response.json --write-out '%{http_code}' \
            --max-time 20 -X POST \
            -H 'Content-Type: application/json' \
            --data '{}' \
            "${PUBLIC_API_ORIGIN}/v1/platform/billing/stripe-webhook" || true)"
          test "$code" = "400"

      - name: Verify billing routes are deployed
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "${BACKEND_ORIGIN}/openapi.json" -o openapi.json
          python3 - <<'PY'
          import json

          paths = json.load(open("openapi.json", encoding="utf-8")).get("paths", {})
          required = {
              "/v1/platform/pricing": "get",
              "/v1/platform/developer/billing/checkout": "post",
              "/v1/platform/developer/billing/portal": "post",
              "/v1/platform/billing/stripe-webhook": "post",
          }
          for path, method in required.items():
              assert method in (paths.get(path) or {}), f"missing {method.upper()} {path}"
          print("billing_routes=ok")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-api-billing-production-verification-${{ github.sha }}
          path: |
            backend-health.json
            pricing.json
            webhook-response.json
            openapi.json
          if-no-files-found: ignore
          retention-days: 30

name: AGRO-AI contact and social surfaces

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "cloudflare/platform-api-marketing-worker/src/emergency.ts"
      - "cloudflare/platform-api-marketing-worker/wrangler.toml"
      - ".github/workflows/emergency-website-continuity.yml"
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    if: ${{ github.event_name != 'issues' || (github.actor == github.repository_owner && github.event.issue.title == '[ops] Deploy AGRO-AI contact and socials') }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number || '322' }}
      CONFIG: cloudflare/platform-api-marketing-worker/wrangler.toml
    steps:
      - uses: actions/checkout@v4

      - name: Validate contact release
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          node cloudflare/platform-api-marketing-worker/tests/contract.mjs
          npx --yes wrangler@4.107.0 deploy --dry-run --config "$CONFIG"

      - name: Deploy contact and social surfaces
        shell: bash
        run: npx --yes wrangler@4.107.0 deploy --config "$CONFIG"

      - name: Verify live website and contact intake
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          ready=0
          for attempt in $(seq 1 30); do
            contact_code="$(curl -sS -L --connect-timeout 5 --max-time 20 -o proof/contact.html -w '%{http_code}' https://agroai-pilot.com/contact || true)"
            home_code="$(curl -sS -L --connect-timeout 5 --max-time 20 -o proof/home.html -w '%{http_code}' https://agroai-pilot.com/ || true)"
            if [ "$contact_code" = "200" ] && [ "$home_code" = "200" ] && \
               grep -F 'Contact AGRO-AI' proof/contact.html >/dev/null && \
               grep -F 'contact@agroai-pilot.com' proof/contact.html >/dev/null && \
               grep -F 'https://www.linkedin.com/company/agro-ai-inc/' proof/contact.html >/dev/null && \
               grep -F 'https://www.instagram.com/agroai.inc/' proof/contact.html >/dev/null && \
               grep -F 'https://www.youtube.com/channel/UCd3tQLAOtMmjFhRNVdU08tA' proof/contact.html >/dev/null && \
               grep -F 'agroai-social-footer' proof/home.html >/dev/null && \
               ! grep -F 'agroai-continuity-banner' proof/home.html >/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo "AGRO-AI contact and social surfaces failed smoke verification."
            exit 1
          fi

          intake_code="$(curl -sS --connect-timeout 5 --max-time 25 \
            -o proof/intake.json -w '%{http_code}' \
            -X POST https://api.agroai-pilot.com/v1/sales/contact \
            -H 'content-type: application/json' \
            -H 'accept: application/json' \
            --data "{\"type\":\"sales\",\"priority\":\"low\",\"name\":\"AGRO-AI Production Smoke\",\"email\":\"daabolaamiine@gmail.com\",\"company\":\"AGRO-AI Inc.\",\"subject\":\"Contact page production smoke\",\"message\":\"Automated production verification. No follow-up required.\",\"source_page\":\"contact-page-smoke\",\"metadata\":{\"automated_smoke\":true}}" || true)"
          test "$intake_code" = "200"
          jq -e '.status == "received" and (.request_id | length > 0)' proof/intake.json >/dev/null

          if [ "${GITHUB_EVENT_NAME}" = "issues" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "✅ AGRO-AI contact and social surfaces are live. The interruption banner is removed, **contact@agroai-pilot.com** is published, LinkedIn/Instagram/YouTube links are active, and the production contact intake passed smoke verification."
          fi

      - name: Report failure
        if: ${{ failure() && github.event_name == 'issues' }}
        shell: bash
        run: gh issue comment "$ISSUE_NUMBER" --body "❌ AGRO-AI contact and social deployment failed. Review this workflow run before announcing completion."

name: Platform API Public Self-Service CI

on:
  pull_request:
    branches: [main]
    paths:
      - "figma-enterprise-v4/src/app/App.tsx"
      - "figma-enterprise-v4/src/main.tsx"
      - "figma-enterprise-v4/src/app/components/PlatformAuthScreen.tsx"
      - "figma-enterprise-v4/src/app/components/PlatformSelfServiceGate.tsx"
      - "figma-enterprise-v4/src/app/components/PlatformCliDeviceApproval.tsx"
      - "figma-enterprise-v4/src/app/routes.tsx"
      - "figma-enterprise-v4/tests/platform-application-gate-contract.mjs"
      - "figma-enterprise-v4/tests/platform-api-console-contract.mjs"
      - "sdk/python/agroai_platform/cli.py"
      - "sdk/python/agroai_platform/session.py"
      - "sdk/python/tests/test_cli*.py"
      - "sdk/python/pyproject.toml"
      - "platform-api/assets/**"
      - "platform-api/legal/**"
      - "docs/platform-api-cli.md"
      - "docs/platform-api-public-self-service-launch.md"
      - ".github/workflows/platform-api-public-self-service-ci.yml"
      - ".github/workflows/platform-api-public-self-service-activation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal-self-service:
    name: Portal self-service and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: figma-enterprise-v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: figma-enterprise-v4/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Self-service / private-beta fallback contract
        run: node tests/platform-application-gate-contract.mjs
      - name: Full Platform product contract
        run: node tests/platform-api-console-contract.mjs
      - name: Production build
        env:
          VITE_DEPLOYMENT_ENVIRONMENT: production
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_API_BASE_URL: https://api.agroai-pilot.com
        run: npm run build

  cli-sdk:
    name: Python SDK + terminal self-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK test/build dependencies
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e . pytest
      - name: CLI and SDK tests
        run: python -m pytest -q sdk/python/tests
      - name: Build distributable wheel and sdist
        working-directory: sdk/python
        run: python -m build
      - name: Verify executable entry point
        run: |
          agroai --version
          agroai --help | grep -q bootstrap
          agroai --help | grep -q service-accounts

  terminal-installer-linux:
    name: Public CLI installer — Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: POSIX shell and safety contract
        run: |
          sh -n platform-api/assets/install.sh
          python3 - <<'PY'
          from pathlib import Path
          source = Path("platform-api/assets/install.sh").read_text()
          required = [
              "Python 3.10 or newer is required",
              "AGROAI_CLI_REF",
              "lamine.github.io/archive/${REF}.zip#subdirectory=sdk/python",
              "pipx install --force",
              '"$PYTHON" -m venv "$VENV_ROOT/venv"',
              "ln -sf",
              "Next: agroai login",
          ]
          for item in required:
              assert item in source, item
          assert "sudo " not in source
          assert "AGROAI_API_KEY" not in source
          assert "command -v git" not in source
          print("Public CLI installer contract passed")
          PY
      - name: Real install from this exact GitHub commit
        env:
          AGROAI_CLI_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          AGROAI_CLI_HOME: ${{ runner.temp }}/agroai-cli
          AGROAI_BIN_DIR: ${{ runner.temp }}/agroai-bin
        run: |
          sh platform-api/assets/install.sh
          "$AGROAI_BIN_DIR/agroai" --version
          "$AGROAI_BIN_DIR/agroai" --help | grep -q bootstrap
          "$AGROAI_BIN_DIR/agroai" --help | grep -q service-accounts

  terminal-installer-windows:
    name: Public CLI installer — Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PowerShell parse and safety contract
        shell: pwsh
        run: |
          $source = Get-Content -Raw platform-api/assets/install.ps1
          [scriptblock]::Create($source) | Out-Null
          if ($source -notmatch 'Python 3\.10 or newer is required') { throw 'missing Python version gate' }
          if ($source -notmatch 'AGROAI_CLI_REF') { throw 'missing source pin' }
          if ($source -notmatch '#subdirectory=sdk/python') { throw 'missing SDK subdirectory' }
          if ($source -match 'Start-Process.+-Verb\s+RunAs') { throw 'installer must not require elevation' }
          if ($source -match 'AGROAI_API_KEY') { throw 'installer must not request a data-plane secret' }
      - name: Real install from this exact GitHub commit
        shell: pwsh
        env:
          AGROAI_CLI_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          AGROAI_CLI_HOME: ${{ runner.temp }}\agroai-cli
          AGROAI_BIN_DIR: ${{ runner.temp }}\agroai-bin
        run: |
          & platform-api/assets/install.ps1
          $cli = Join-Path $env:AGROAI_CLI_HOME 'venv\Scripts\agroai.exe'
          & $cli --version
          $help = (& $cli --help | Out-String)
          if ($help -notmatch 'bootstrap') { throw 'bootstrap command missing' }
          if ($help -notmatch 'service-accounts') { throw 'service-accounts command missing' }

  cli-entrypoint-contract:
    name: CLI command boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python package entrypoint contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pyproject = Path("sdk/python/pyproject.toml").read_text()
          assert 'requires-python = ">=3.10"' in pyproject
          assert 'agroai = "agroai_platform.cli:main"' in pyproject
          cli = Path("sdk/python/agroai_platform/cli.py").read_text()
          for command in ("login", "logout", "bootstrap", "projects", "service-accounts", "keys", "fields", "webhooks", "usage", "doctor"):
              assert f'add_parser("{command}"' in cli, command
          assert '"environment": "test"' in cli
          default_scopes = cli.split("SAFE_BOOTSTRAP_SCOPES", 1)[1].split("]", 1)[0]
          assert '"actions:execute"' not in default_scopes
          assert '"connectors:write"' not in default_scopes
          print("CLI entrypoint and TEST bootstrap contract passed")
          PY

  legal-boundary:
    name: Legal evidence remains fail-closed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Drafts may never masquerade as approved evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          drafts = list(Path("platform-api/legal/drafts").rglob("*.md"))
          assert drafts, "legal review package is missing"
          for path in drafts:
              text = path.read_text()
              assert "LEGAL REVIEW REQUIRED" in text, path
              assert "NOT EFFECTIVE" in text, path
          validator = Path("platform-api/legal/validate_approved_catalog.py").read_text()
          assert 'catalog.get("status") != "counsel_approved"' in validator
          assert "digest mismatch" in validator
          assert "approved public asset still contains draft/non-effective marker" in validator
          print("Legal review package remains fail-closed")
          PY
      - name: If approval evidence exists, validate it exactly
        run: |
          if [[ -f platform-api/legal/approved-catalog.json ]]; then
            python3 platform-api/legal/validate_approved_catalog.py
          else
            echo "No counsel-approved catalog committed yet; public activation remains intentionally blocked."
          fi

  launch-boundary:
    name: TEST-only launch boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove public self-service does not widen LIVE or physical capabilities
        run: |
          python3 - <<'PY'
          from pathlib import Path
          config = Path("agroai_api/app/core/config.py").read_text()
          required_false = [
              "PLATFORM_API_LIVE_PROJECTS_ENABLED: bool = False",
              "PLATFORM_API_WEBHOOK_DELIVERY_ENABLED: bool = False",
              "PLATFORM_API_LIVE_AUTO_APPROVAL_ENABLED: bool = False",
              "EARTHDAILY_ADAPTER_ENABLED: bool = False",
              "VALLEY_IRRIGATION_ADAPTER_ENABLED: bool = False",
              "VALLEY_IRRIGATION_WRITE_CAPABILITY_ENABLED: bool = False",
          ]
          for contract in required_false:
              assert contract in config, contract
          gate = Path("figma-enterprise-v4/src/app/components/PlatformSelfServiceGate.tsx").read_text()
          cli = Path("sdk/python/agroai_platform/cli.py").read_text()
          activation = Path(".github/workflows/platform-api-public-self-service-activation.yml").read_text()
          assert "TEST access never grants live provider credentials" in gate
          assert "LIVE projects remain a separate reviewed process" in gate
          assert '"environment": "test"' in cli
          for contract in (
              "PLATFORM_API_LIVE_PROJECTS_ENABLED false",
              "PLATFORM_API_WEBHOOK_DELIVERY_ENABLED false",
              "PLATFORM_API_LIVE_AUTO_APPROVAL_ENABLED false",
              "EARTHDAILY_ADAPTER_ENABLED false",
              "VALLEY_IRRIGATION_ADAPTER_ENABLED false",
              "VALLEY_IRRIGATION_WRITE_CAPABILITY_ENABLED false",
          ):
              assert contract in activation, contract
          print("Public launch remains TEST-only and fail-closed for LIVE/provider/physical capabilities")
          PY

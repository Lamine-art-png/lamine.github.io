name: Newsroom Live Deploy

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/live-news-verification-trigger"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: agroai-newsroom-live-deploy
  cancel-in-progress: true

jobs:
  deploy-and-verify:
    name: Deploy and verify newsroom live
    if: ${{ github.event.pull_request.head.ref == 'ops/live-newsroom-deploy-verified' }}
    runs-on: macos-14
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out merged main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate production inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -s client/public/news/agro-ai-connected-john-deere-operations-center/index.html
          test -s client/public/news/agro-ai-connected-john-deere-operations-center/cover.webp
          test -s client/public/news/introducing-agro-ai-field-intelligence/index.html
          grep -F 'AGRO-AI connects with John Deere Operations Center™' client/public/news/agro-ai-connected-john-deere-operations-center/index.html >/dev/null
          grep -F 'Agricultural operations do not suffer from a shortage of data.' client/public/news/agro-ai-connected-john-deere-operations-center/index.html >/dev/null
          grep -F "Access is initiated through the user's Operations Center connection." client/public/news/agro-ai-connected-john-deere-operations-center/index.html >/dev/null
          grep -F 'Introducing AGRO-AI Field Intelligence' client/public/news/introducing-agro-ai-field-intelligence/index.html >/dev/null

      - name: Deploy production Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.107.0 deploy --config cloudflare/field-intelligence-launch-worker/wrangler.toml

      - name: Verify live newsroom and announcements
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            bust="$(date +%s)-${attempt}"
            origin_status="$(curl -sS -L -H 'Cache-Control: no-cache' -o origin.html -w '%{http_code}' --max-time 25 "https://agroai-343.pages.dev/news?verify=${bust}" || true)"
            news_status="$(curl -sS -L -H 'Cache-Control: no-cache' -D news.headers -o news.html -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news?verify=${bust}" || true)"
            script_status="$(curl -sS -L -H 'Cache-Control: no-cache' -o restore.js -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news/agroai-news-card-restore.js?verify=${bust}" || true)"
            jd_status="$(curl -sS -L -H 'Cache-Control: no-cache' -o jd.html -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center?verify=${bust}" || true)"
            jd_cover_status="$(curl -sS -L -H 'Cache-Control: no-cache' -D jd-cover.headers -o jd-cover.webp -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center/cover.webp?verify=${bust}" || true)"
            field_status="$(curl -sS -L -H 'Cache-Control: no-cache' -o field.html -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news/introducing-agro-ai-field-intelligence?verify=${bust}" || true)"
            field_cover_status="$(curl -sS -L -H 'Cache-Control: no-cache' -D field-cover.headers -o field-cover.bin -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news/introducing-agro-ai-field-intelligence/cover.webp?verify=${bust}" || true)"

            if [ "$origin_status" = "200" ] && [ "$news_status" = "200" ] && [ "$script_status" = "200" ] && [ "$jd_status" = "200" ] && [ "$jd_cover_status" = "200" ] && [ "$field_status" = "200" ] && [ "$field_cover_status" = "200" ] && \
               grep -Fi 'x-agroai-newsroom-source: native-pages-origin' news.headers >/dev/null && \
               grep -F 'agroai-news-card-restore.js' news.html >/dev/null && \
               grep -F 'Introducing AGRO-AI Field Intelligence' restore.js >/dev/null && \
               grep -F '/news/introducing-agro-ai-field-intelligence' restore.js >/dev/null && \
               grep -F 'AGRO-AI connects with John Deere Operations Center™' restore.js >/dev/null && \
               grep -F '/news/agro-ai-connected-john-deere-operations-center' restore.js >/dev/null && \
               grep -F 'AGRO-AI connects with John Deere Operations Center™' jd.html >/dev/null && \
               grep -F 'Agricultural operations do not suffer from a shortage of data.' jd.html >/dev/null && \
               grep -F "Access is initiated through the user's Operations Center connection." jd.html >/dev/null && \
               grep -F '<meta name="author" content="AGRO-AI"' jd.html >/dev/null && \
               grep -F 'Tuesday, July 28, 2026 at 8:00 AM PDT' jd.html >/dev/null && \
               grep -F 'San Francisco, California' jd.html >/dev/null && \
               grep -F 'https://app.agroai-pilot.com/integrations' jd.html >/dev/null && \
               grep -F 'https://agroai-pilot.com/enterprise-portal' jd.html >/dev/null && \
               grep -F 'https://agroai-pilot.com/book-a-demo' jd.html >/dev/null && \
               grep -F 'https://agroai-pilot.com/platform-api/' jd.html >/dev/null && \
               grep -F 'https://www.linkedin.com/company/agro-ai-inc/' jd.html >/dev/null && \
               grep -F 'https://www.instagram.com/agroai.inc/' jd.html >/dev/null && \
               grep -F 'https://www.youtube.com/channel/UCd3tQLAOtMmjFhRNVdU08tA' jd.html >/dev/null && \
               grep -Fi 'content-type: image/webp' jd-cover.headers >/dev/null && \
               grep -Fi 'x-agroai-asset-source: reviewed-john-deere-cover' jd-cover.headers >/dev/null && \
               grep -F 'Introducing AGRO-AI Field Intelligence' field.html >/dev/null && \
               grep -F 'GiM6WZY0HG0' field.html >/dev/null && \
               grep -Fi 'x-agroai-cover-target: 3840x2160' field-cover.headers >/dev/null && \
               [ "$(wc -c < jd-cover.webp)" -gt 10000 ]; then
              perl -0pe 's#<script src="/news/agroai-news-card-restore\.js" defer data-agroai-news-card-restoration="true"></script>##' news.html > news-clean.html
              cmp -s origin.html news-clean.html
              echo "NEWSROOM_PRODUCTION_OK"
              echo "JOHN_DEERE_PRODUCTION_OK"
              echo "FIELD_INTELLIGENCE_PRODUCTION_OK"
              exit 0
            fi
            sleep 5
          done

          echo "Live production verification failed."
          cat news.headers || true
          cat jd-cover.headers || true
          cat field-cover.headers || true
          exit 1

      - name: Comment verified result
        if: ${{ success() }}
        shell: bash
        run: gh pr comment "${{ github.event.pull_request.number }}" --body "✅ Live production verified: native newsroom intact, reviewed John Deere article and supplied cover live, Field Intelligence article live, and both newsroom cards restored."

      - name: Comment failure
        if: ${{ failure() }}
        shell: bash
        run: gh pr comment "${{ github.event.pull_request.number }}" --body "❌ Live newsroom deployment or verification failed. Do not announce completion."

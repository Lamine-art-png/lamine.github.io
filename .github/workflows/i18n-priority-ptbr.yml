name: Priority pt-BR deterministic localization
# release retry: direct Workers AI REST authoring; no remote-dev proxy

on:
  push:
    branches: [fix/deterministic-localization-release]
    paths:
      - ".github/workflows/i18n-priority-ptbr.yml"
      - "scripts/i18n-generate-catalogs.py"
      - "scripts/i18n-generate-transactional-catalogs.py"
      - "shared/localization/source.json"
      - "shared/localization/transactional-source.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: priority-ptbr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ptbr:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      I18N_AUTHORING_ENDPOINT: http://127.0.0.1:8787/api/chat
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start isolated Workers AI authoring preview
        shell: bash
        run: |
          set -euo pipefail
          nohup npx --yes wrangler@4.107.0 dev --remote --config wrangler.i18n-authoring.toml --port 8787 > /tmp/ptbr-authoring.log 2>&1 &
          echo $! > /tmp/ptbr-authoring.pid
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:8787/health | jq -e '.status=="ok" and .provider=="cloudflare-workers-ai"' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ptbr-authoring.log
          exit 1


      - name: Generate complete Brazilian Portuguese UI catalog
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 10); do
            if python3 scripts/i18n-generate-catalogs.py --locales pt-BR --outdir shared/localization/catalogs; then
              ok=1
              break
            fi
            echo "pt-BR authoring interrupted (attempt $attempt/10); resuming durable progress in 12s..."
            sleep 12
          done
          test "$ok" = "1"

      - name: Generate Brazilian Portuguese verification catalog
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 6); do
            if python3 scripts/i18n-generate-transactional-catalogs.py --locales pt-BR --outdir shared/localization/transactional-catalogs; then
              ok=1
              break
            fi
            echo "pt-BR transactional authoring interrupted (attempt $attempt/6); retrying in 10s..."
            sleep 10
          done
          test "$ok" = "1"


      - name: Stop isolated Workers AI authoring preview
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/ptbr-authoring.pid ]; then
            kill "$(cat /tmp/ptbr-authoring.pid)" 2>/dev/null || true
          fi

      - name: Validate pt-BR artifacts and reconcile advertised locales
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/i18n-generate-catalogs.py --locales pt-BR --validate-dir shared/localization/catalogs
          python3 scripts/i18n-reconcile-production-locales.py
          cd figma-enterprise-v4
          node tests/static-locale-catalog-contract.mjs

      - name: Commit deterministic pt-BR release artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AGRO-AI Release Bot"
          git config user.email "release-bot@agroai-pilot.com"
          git add shared/localization/catalogs/pt-BR.json \
                  shared/localization/transactional-catalogs/pt-BR.json \
                  shared/supported-locales.json
          git commit -m "Promote deterministic Brazilian Portuguese localization"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Diagnose Native Newsroom DOM

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.event.pull_request.title == '[ops] Diagnose native newsroom DOM' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect native and live newsroom DOM
        run: |
          set -euo pipefail
          mkdir -p /tmp/newsroom-diagnose
          cd /tmp/newsroom-diagnose
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > diagnose.cjs <<'NODE'
          const { chromium } = require('playwright');
          const urls = [
            ['native-origin', 'https://agroai-343.pages.dev/news'],
            ['public-live', 'https://agroai-pilot.com/news'],
          ];
          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const [name, url] of urls) {
              const page = await browser.newPage({ viewport: { width: 1440, height: 1400 } });
              await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
              await page.waitForTimeout(2500);
              const data = await page.evaluate(() => {
                const normalize = (v) => { try { return new URL(v, location.origin).pathname.replace(/\/$/, ''); } catch { return ''; } };
                const links = [...document.querySelectorAll('a[href]')]
                  .filter(a => normalize(a.getAttribute('href') || a.href).startsWith('/news/'))
                  .map((a, index) => {
                    const chain = [];
                    let node = a;
                    for (let depth = 0; node && depth < 8; depth++, node = node.parentElement) {
                      chain.push({
                        tag: node.tagName,
                        id: node.id || '',
                        class: typeof node.className === 'string' ? node.className : '',
                        text: (node.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 320),
                        childCount: node.children ? node.children.length : 0,
                      });
                    }
                    return {
                      index,
                      href: normalize(a.getAttribute('href') || a.href),
                      text: (a.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 240),
                      chain,
                    };
                  });
                return {
                  title: document.title,
                  bodyText: document.body.innerText.replace(/\s+/g, ' ').trim().slice(0, 7000),
                  links,
                  articleCount: document.querySelectorAll('article').length,
                  listItemCount: document.querySelectorAll('li').length,
                  readArticleCount: [...document.querySelectorAll('a,button')].filter(el => /read article/i.test(el.textContent || '')).length,
                  restored: document.documentElement.getAttribute('data-agroai-news-cards-restored'),
                };
              });
              console.log(`===== ${name} ${url} =====`);
              console.log(JSON.stringify(data, null, 2));
              await page.screenshot({ path: `${name}.png`, fullPage: true });
              await page.close();
            }
            await browser.close();
          })().catch((err) => { console.error(err); process.exit(1); });
          NODE
          node diagnose.cjs | tee newsroom-dom-diagnostic.log
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-newsroom-dom-diagnostic
          path: |
            /tmp/newsroom-diagnose/newsroom-dom-diagnostic.log
            /tmp/newsroom-diagnose/native-origin.png
            /tmp/newsroom-diagnose/public-live.png
          retention-days: 2

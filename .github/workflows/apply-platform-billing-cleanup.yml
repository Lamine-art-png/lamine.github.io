name: Apply Platform Billing Cleanup

# Forced production cleanup generation: 3
on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/apply_platform_billing_cleanup.py
      - .github/workflows/apply-platform-billing-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      EVIDENCE_ISSUE: "359"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply deterministic cleanup
        run: python .github/scripts/apply_platform_billing_cleanup.py

      - name: Validate syntax and targeted contracts
        working-directory: agroai_api
        run: |
          python -m pip install -q -r requirements.txt pytest
          python -m py_compile \
            app/billing_bootstrap.py \
            app/api/v1/platform_billing.py \
            tests/unit/test_platform_billing_cleanup.py
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q \
            tests/unit/test_platform_billing_cleanup.py \
            tests/unit/test_platform_billing_runtime_diagnostics.py

      # main is protected (PR + required checks): never push to it. When the
      # deterministic cleanup is not yet on main, propose it as a pull request
      # that goes through the normal release gates.
      - name: Propose the backend cleanup as a pull request
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add \
            agroai_api/app/api/v1/platform_billing.py \
            agroai_api/tests/unit/test_platform_billing_cleanup.py
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Backend cleanup already applied on main"
            exit 0
          fi
          branch="automation/platform-billing-cleanup-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "Add billing readiness and abandoned Checkout recovery"
          git push origin "HEAD:refs/heads/${branch}"
          pr_url="$(gh pr create --base main --head "$branch" \
            --title "Apply Platform billing cleanup" \
            --body "Deterministic output of .github/scripts/apply_platform_billing_cleanup.py from run ${GITHUB_RUN_ID}. Merge through the normal required checks.")"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"

      - name: Record cleanup success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          PR_URL: ${{ steps.commit.outputs.pr_url }}
        run: |
          if [ "${CHANGED:-false}" = "true" ]; then
            body="Platform billing backend cleanup proposed for review: ${PR_URL} (commit \`${COMMIT_SHA}\`). It reaches production only after the pull request passes the required checks and merges."
          else
            body="✅ Platform billing backend cleanup is already on main; nothing to apply."
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/${EVIDENCE_ISSUE}/comments" -f body="$body"

      - name: Record cleanup failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${EVIDENCE_ISSUE}/comments" \
            -f body="❌ Platform billing backend cleanup workflow failed. Review Actions run \`${GITHUB_RUN_ID}\`; no green claim is permitted until cleanup and production verification pass."

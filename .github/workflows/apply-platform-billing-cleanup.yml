name: Apply Platform Billing Cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/apply_platform_billing_cleanup.py
      - .github/workflows/apply-platform-billing-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      EVIDENCE_ISSUE: "359"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply deterministic cleanup
        run: python .github/scripts/apply_platform_billing_cleanup.py

      - name: Validate syntax and targeted contracts
        working-directory: agroai_api
        run: |
          python -m pip install -q -r requirements.txt pytest
          python -m py_compile \
            app/billing_bootstrap.py \
            app/api/v1/platform_billing.py \
            tests/unit/test_platform_billing_cleanup.py
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q \
            tests/unit/test_platform_billing_cleanup.py \
            tests/unit/test_platform_billing_runtime_diagnostics.py

      - name: Commit the cleanup to main
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            agroai_api/app/api/v1/platform_billing.py \
            agroai_api/tests/unit/test_platform_billing_cleanup.py \
            .github/workflows/platform-api-billing-deep-production-verification.yml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Cleanup already applied"
            exit 0
          fi
          git commit -m "Add billing readiness and abandoned Checkout recovery"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record cleanup success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${EVIDENCE_ISSUE}/comments" \
            -f body="✅ Platform billing cleanup applied. Non-secret readiness diagnostics, abandoned/canceled Checkout retry recovery, secret-redaction tests, and deep production verification are committed. changed=\`${CHANGED:-false}\` commit=\`${COMMIT_SHA:-already-applied}\`."

      - name: Record cleanup failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${EVIDENCE_ISSUE}/comments" \
            -f body="❌ Platform billing cleanup workflow failed. Review Actions run \`${GITHUB_RUN_ID}\`; no green claim is permitted until the cleanup and production verification pass."

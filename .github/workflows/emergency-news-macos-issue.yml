name: Emergency News Publication macOS

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: agroai-emergency-news-publication-macos
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.actor == github.repository_owner && github.event.issue.title == '[ops] Publish AGRO-AI newsroom announcements macOS' }}
    runs-on: macos-14
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Check out merged main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate and deploy exact news routes
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -s client/public/news/agro-ai-connected-john-deere-operations-center/index.html
          test -s client/public/news/agro-ai-connected-john-deere-operations-center/cover.webp
          test -s client/public/news/introducing-agro-ai-field-intelligence/index.html
          grep -F 'AGRO-AI connects with John Deere Operations Center™' client/public/news/agro-ai-connected-john-deere-operations-center/index.html >/dev/null
          grep -F 'Agricultural operations do not suffer from a shortage of data.' client/public/news/agro-ai-connected-john-deere-operations-center/index.html >/dev/null
          grep -F "Access is initiated through the user's Operations Center connection." client/public/news/agro-ai-connected-john-deere-operations-center/index.html >/dev/null
          grep -F 'Introducing AGRO-AI Field Intelligence' client/public/news/introducing-agro-ai-field-intelligence/index.html >/dev/null
          npx --yes wrangler@4.107.0 deploy --dry-run --config cloudflare/field-intelligence-launch-worker/wrangler.toml
          npx --yes wrangler@4.107.0 deploy --config cloudflare/field-intelligence-launch-worker/wrangler.toml

      - name: Remove obsolete broad newsroom routes only
        shell: bash
        run: |
          set -euo pipefail
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          api="https://api.cloudflare.com/client/v4"
          zone_json="$(curl -fsS -H "$auth_header" -H 'Content-Type: application/json' "${api}/zones?name=agroai-pilot.com&account.id=${CLOUDFLARE_ACCOUNT_ID}")"
          zone_id="$(ZONE_JSON="$zone_json" python3 - <<'PY'
import json, os
print((json.loads(os.environ['ZONE_JSON']).get('result') or [{}])[0].get('id', ''))
PY
          )"
          test -n "$zone_id"
          routes_json="$(curl -fsS -H "$auth_header" -H 'Content-Type: application/json' "${api}/zones/${zone_id}/workers/routes")"
          ROUTES_JSON="$routes_json" python3 - <<'PY' > obsolete.tsv
import json, os
obsolete = {
  'agroai-pilot.com/news*',
  'agroai-pilot.com/news/*',
  'agroai-pilot.com/news/field-intelligence-newsroom.js',
  'agroai-pilot.com/news/field-intelligence-newsroom.css',
}
for route in json.loads(os.environ['ROUTES_JSON']).get('result', []):
    if route.get('pattern') in obsolete:
        print(f"{route.get('id','')}\t{route.get('pattern','')}")
PY
          while IFS=$'\t' read -r route_id route_pattern; do
            [ -n "${route_id:-}" ] || continue
            echo "Deleting obsolete broad route: ${route_pattern}"
            result="$(curl -fsS -X DELETE -H "$auth_header" -H 'Content-Type: application/json' "${api}/zones/${zone_id}/workers/routes/${route_id}")"
            RESULT="$result" python3 - <<'PY'
import json, os
assert json.loads(os.environ['RESULT']).get('success') is True
PY
          done < obsolete.tsv

      - name: Verify actual public newsroom and both announcements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          ready=0
          for attempt in $(seq 1 48); do
            bust="$(date +%s)-${attempt}"
            origin_code="$(curl -sS -L --connect-timeout 5 --max-time 25 -o proof/origin.html -w '%{http_code}' "https://agroai-343.pages.dev/news?verify=${bust}" || true)"
            news_code="$(curl -sS -L --connect-timeout 5 --max-time 25 -D proof/news.headers -o proof/news.html -w '%{http_code}' "https://agroai-pilot.com/news?verify=${bust}" || true)"
            script_code="$(curl -sS -L --connect-timeout 5 --max-time 25 -o proof/restore.js -w '%{http_code}' "https://agroai-pilot.com/news/agroai-news-card-restore.js?verify=${bust}" || true)"
            jd_code="$(curl -sS -L --connect-timeout 5 --max-time 25 -o proof/jd.html -w '%{http_code}' "https://agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center?verify=${bust}" || true)"
            jd_cover_code="$(curl -sS -L --connect-timeout 5 --max-time 25 -D proof/jd-cover.headers -o proof/jd-cover.webp -w '%{http_code}' "https://agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center/cover.webp?verify=${bust}" || true)"
            field_code="$(curl -sS -L --connect-timeout 5 --max-time 25 -o proof/field.html -w '%{http_code}' "https://agroai-pilot.com/news/introducing-agro-ai-field-intelligence?verify=${bust}" || true)"
            field_cover_code="$(curl -sS -L --connect-timeout 5 --max-time 25 -D proof/field-cover.headers -o proof/field-cover.bin -w '%{http_code}' "https://agroai-pilot.com/news/introducing-agro-ai-field-intelligence/cover.webp?verify=${bust}" || true)"

            if [ "$origin_code" = "200" ] && [ "$news_code" = "200" ] && [ "$script_code" = "200" ] && [ "$jd_code" = "200" ] && [ "$jd_cover_code" = "200" ] && [ "$field_code" = "200" ] && [ "$field_cover_code" = "200" ] && \
               grep -Fi 'x-agroai-newsroom-source: native-pages-origin' proof/news.headers >/dev/null && \
               grep -F 'agroai-news-card-restore.js' proof/news.html >/dev/null && \
               grep -F 'Introducing AGRO-AI Field Intelligence' proof/restore.js >/dev/null && \
               grep -F '/news/introducing-agro-ai-field-intelligence' proof/restore.js >/dev/null && \
               grep -F 'AGRO-AI connects with John Deere Operations Center™' proof/restore.js >/dev/null && \
               grep -F '/news/agro-ai-connected-john-deere-operations-center' proof/restore.js >/dev/null && \
               grep -F 'AGRO-AI connects with John Deere Operations Center™' proof/jd.html >/dev/null && \
               grep -F 'Agricultural operations do not suffer from a shortage of data.' proof/jd.html >/dev/null && \
               grep -F "Access is initiated through the user's Operations Center connection." proof/jd.html >/dev/null && \
               grep -F '<meta name="author" content="AGRO-AI"' proof/jd.html >/dev/null && \
               grep -F 'Tuesday, July 28, 2026 at 8:00 AM PDT' proof/jd.html >/dev/null && \
               grep -F 'San Francisco, California' proof/jd.html >/dev/null && \
               grep -Fi 'content-type: image/webp' proof/jd-cover.headers >/dev/null && \
               grep -Fi 'x-agroai-asset-source: reviewed-john-deere-cover' proof/jd-cover.headers >/dev/null && \
               grep -F 'Introducing AGRO-AI Field Intelligence' proof/field.html >/dev/null && \
               grep -F 'GiM6WZY0HG0' proof/field.html >/dev/null && \
               grep -Fi 'x-agroai-cover-target: 3840x2160' proof/field-cover.headers >/dev/null; then
              test "$(wc -c < proof/jd-cover.webp)" -gt 10000
              python3 - <<'PY'
from pathlib import Path
import re
origin = Path('proof/origin.html').read_text()
live = Path('proof/news.html').read_text()
clean = re.sub(r'<script src="/news/agroai-news-card-restore\.js" defer data-agroai-news-card-restoration="true"></script>', '', live, count=1)
assert clean == origin
PY
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = "1"

      - name: Report verified publication
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --body $'✅ **Production publication verified live.**\n\n- Native newsroom layout is intact.\n- The reviewed John Deere article is live with the supplied cover and required metadata.\n- The Field Intelligence announcement article is live and its newsroom card is restored.\n- Existing newsroom markup is unchanged except for one deferred native-card restoration script.\n\nVerified directly against the public production URLs after deployment.'

      - name: Report failure
        if: ${{ failure() }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --body $'❌ **Production publication failed verification.**\n\nDo not announce completion. The macOS production workflow did not prove every required public surface.'

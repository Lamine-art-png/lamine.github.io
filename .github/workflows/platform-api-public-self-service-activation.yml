name: Activate Platform API Public TEST Self-Service

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type ACTIVATE_TEST_SELF_SERVICE exactly. This never enables LIVE or physical execution."
        required: true
        type: string

permissions:
  contents: read

env:
  API_BASE: https://api.agroai-pilot.com
  MARKETING_URL: https://agroai-pilot.com/platform-api
  WORKER_CONFIG: cloudflare/platform-api-marketing-worker/wrangler.toml

jobs:
  activate:
    name: Counsel-gated TEST-only activation
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: platform-api-public-test-self-service-activation
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_ID: ${{ vars.PRODUCTION_API_SERVICE_ID }}
      PLATFORM_ADMIN_TOKEN: ${{ secrets.PLATFORM_API_ACTIVATION_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse stale or non-main activation
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Activation must run from main" >&2; exit 1; }
          [[ "${{ inputs.confirmation }}" == "ACTIVATE_TEST_SELF_SERVICE" ]] || { echo "Exact confirmation phrase missing" >&2; exit 1; }
          git fetch origin main --depth=1
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || { echo "Workflow SHA is not current main" >&2; exit 1; }

      - name: Require production credentials
        run: |
          set -euo pipefail
          [[ -n "${RENDER_API_KEY:-}" ]] || { echo "RENDER_API_KEY is required" >&2; exit 1; }
          [[ -n "${SERVICE_ID:-}" ]] || { echo "PRODUCTION_API_SERVICE_ID is required" >&2; exit 1; }
          [[ -n "${PLATFORM_ADMIN_TOKEN:-}" ]] || { echo "PLATFORM_API_ACTIVATION_ADMIN_TOKEN is required" >&2; exit 1; }
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "CLOUDFLARE_API_TOKEN is required" >&2; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo "CLOUDFLARE_ACCOUNT_ID is required" >&2; exit 1; }
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" "https://api.render.com/v1/services/$SERVICE_ID" | jq -e '.id != null' >/dev/null

      - name: Validate counsel-approved legal evidence
        run: |
          set -euo pipefail
          python3 platform-api/legal/validate_approved_catalog.py > /tmp/approved-legal.json
          cat /tmp/approved-legal.json

      - name: Helper — stage 1 terms enforcement without public acquisition
        run: |
          set -euo pipefail
          put_env() {
            local key="$1" value="$2"
            curl --fail-with-body --silent --show-error -X PUT \
              -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
              --data "$(jq -nc --arg value "$value" '{value:$value}')" \
              "https://api.render.com/v1/services/$SERVICE_ID/env-vars/$key" >/dev/null
          }
          put_env PLATFORM_API_ENABLED true
          put_env PLATFORM_API_TERMS_ENFORCEMENT_ENABLED true
          put_env PLATFORM_API_TEST_SELF_SERVICE_AUTO_ENROLL_ENABLED false
          put_env PLATFORM_API_CLI_DEVICE_AUTH_ENABLED false
          put_env PLATFORM_API_LIVE_PROJECTS_ENABLED false
          put_env PLATFORM_API_WEBHOOK_DELIVERY_ENABLED false
          put_env PLATFORM_API_LIVE_AUTO_APPROVAL_ENABLED false
          put_env EARTHDAILY_ADAPTER_ENABLED false
          put_env VALLEY_IRRIGATION_ADAPTER_ENABLED false
          put_env VALLEY_IRRIGATION_WRITE_CAPABILITY_ENABLED false

      - name: Deploy stage 1 at exact main SHA
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
            --data "$(jq -nc --arg commitId "$GITHUB_SHA" '{commitId:$commitId,clearCache:"do_not_clear"}')" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" | jq -e '.id != null' >/dev/null
          for attempt in $(seq 1 120); do
            body="$(curl -sS --max-time 15 "$API_BASE/v1/health" || true)"
            [[ "$(jq -r '.build_sha // empty' <<<"$body" 2>/dev/null || true)" == "$GITHUB_SHA" ]] && exit 0
            sleep 5
          done
          echo "Stage 1 backend did not reach exact SHA $GITHUB_SHA" >&2
          exit 1

      - name: Publish exact counsel-approved records
        run: |
          set -euo pipefail
          effective_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -c '.documents[]' /tmp/approved-legal.json | while read -r document; do
            type="$(jq -r '.document_type' <<<"$document")"
            version="$(jq -r '.version' <<<"$document")"
            digest="$(jq -r '.sha256' <<<"$document")"
            reaccept="$(jq -r '.reacceptance_required' <<<"$document")"
            payload="$(jq -nc --arg digest "$digest" --arg effective_at "$effective_at" --argjson reacceptance_required "$reaccept" '{status:"approved_effective",content_digest:$digest,effective_at:$effective_at,reacceptance_required:$reacceptance_required,reason:"Counsel-approved public TEST self-service launch catalog"}')"
            curl --fail-with-body --silent --show-error -X PUT \
              -H "Authorization: Bearer $PLATFORM_ADMIN_TOKEN" -H "Content-Type: application/json" \
              --data "$payload" "$API_BASE/v1/platform/admin/terms/$type/$version" > "/tmp/terms-$type.json"
            jq -e --arg type "$type" --arg version "$version" --arg digest "$digest" '.document_type==$type and .version==$version and .content_digest==$digest and .status=="approved_effective"' "/tmp/terms-$type.json" >/dev/null
          done

      - name: Verify legal catalog before auto-enrollment
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "$API_BASE/v1/platform/terms" > /tmp/effective-terms.json
          jq -e '(.documents|type=="array") and ([.documents[].document_type]|index("api_terms")!=null) and ([.documents[].document_type]|index("acceptable_use")!=null) and ([.documents[].document_type]|index("privacy")!=null) and ([.documents[]|select(.legal_review_status!="approved_effective")]|length==0)' /tmp/effective-terms.json >/dev/null
          jq -c '.documents[]' /tmp/approved-legal.json | while read -r expected; do
            type="$(jq -r '.document_type' <<<"$expected")"
            version="$(jq -r '.version' <<<"$expected")"
            digest="$(jq -r '.sha256' <<<"$expected")"
            jq -e --arg type "$type" --arg version "$version" --arg digest "$digest" '.documents[]|select(.document_type==$type and .version==$version and .content_digest==$digest and .legal_review_status=="approved_effective")' /tmp/effective-terms.json >/dev/null
          done

      - name: Enable only public TEST developer capabilities
        run: |
          set -euo pipefail
          put_env() {
            local key="$1" value="$2"
            curl --fail-with-body --silent --show-error -X PUT \
              -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
              --data "$(jq -nc --arg value "$value" '{value:$value}')" \
              "https://api.render.com/v1/services/$SERVICE_ID/env-vars/$key" >/dev/null
          }
          for key in PLATFORM_API_ENABLED PLATFORM_API_DEVELOPER_CONTROL_PLANE_ENABLED PLATFORM_API_TEST_PROJECTS_ENABLED PLATFORM_API_SELF_SERVICE_SANDBOX_ENABLED PLATFORM_API_TEST_SELF_SERVICE_AUTO_ENROLL_ENABLED PLATFORM_API_TERMS_ENFORCEMENT_ENABLED PLATFORM_API_CLI_DEVICE_AUTH_ENABLED PLATFORM_API_PUBLIC_DOCS_ENABLED; do put_env "$key" true; done
          put_env PLATFORM_API_LIVE_PROJECTS_ENABLED false
          put_env PLATFORM_API_LIVE_ACCESS_REQUESTS_ENABLED false
          put_env PLATFORM_API_WEBHOOK_DELIVERY_ENABLED false
          put_env PLATFORM_API_LIVE_AUTO_APPROVAL_ENABLED false
          put_env PLATFORM_API_BILLING_ENABLED false
          put_env PLATFORM_API_STRIPE_CHECKOUT_ENABLED false
          put_env PLATFORM_API_STRIPE_METER_EXPORT_ENABLED false
          put_env EARTHDAILY_ADAPTER_ENABLED false
          put_env VALLEY_IRRIGATION_ADAPTER_ENABLED false
          put_env VALLEY_IRRIGATION_WRITE_CAPABILITY_ENABLED false

      - name: Verify exact Render environment contract
        run: |
          set -euo pipefail
          get_env() { curl --fail-with-body --silent --show-error -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" "https://api.render.com/v1/services/$SERVICE_ID/env-vars/$1" | jq -r '.value // empty'; }
          for key in PLATFORM_API_ENABLED PLATFORM_API_DEVELOPER_CONTROL_PLANE_ENABLED PLATFORM_API_TEST_PROJECTS_ENABLED PLATFORM_API_SELF_SERVICE_SANDBOX_ENABLED PLATFORM_API_TEST_SELF_SERVICE_AUTO_ENROLL_ENABLED PLATFORM_API_TERMS_ENFORCEMENT_ENABLED PLATFORM_API_CLI_DEVICE_AUTH_ENABLED PLATFORM_API_PUBLIC_DOCS_ENABLED; do [[ "$(get_env "$key")" == "true" ]] || { echo "$key is not true" >&2; exit 1; }; done
          for key in PLATFORM_API_LIVE_PROJECTS_ENABLED PLATFORM_API_LIVE_ACCESS_REQUESTS_ENABLED PLATFORM_API_WEBHOOK_DELIVERY_ENABLED PLATFORM_API_LIVE_AUTO_APPROVAL_ENABLED PLATFORM_API_BILLING_ENABLED PLATFORM_API_STRIPE_CHECKOUT_ENABLED PLATFORM_API_STRIPE_METER_EXPORT_ENABLED EARTHDAILY_ADAPTER_ENABLED VALLEY_IRRIGATION_ADAPTER_ENABLED VALLEY_IRRIGATION_WRITE_CAPABILITY_ENABLED; do [[ "$(get_env "$key")" == "false" ]] || { echo "$key is not false" >&2; exit 1; }; done

      - name: Deploy final TEST contract at exact main SHA
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
            --data "$(jq -nc --arg commitId "$GITHUB_SHA" '{commitId:$commitId,clearCache:"do_not_clear"}')" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" | jq -e '.id != null' >/dev/null
          for attempt in $(seq 1 120); do
            body="$(curl -sS --max-time 15 "$API_BASE/v1/health" || true)"
            [[ "$(jq -r '.build_sha // empty' <<<"$body" 2>/dev/null || true)" == "$GITHUB_SHA" ]] && { echo "$body" > /tmp/final-health.json; exit 0; }
            sleep 5
          done
          echo "Final backend did not reach exact SHA $GITHUB_SHA" >&2
          exit 1

      - name: Verify TEST-only backend safety
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "$API_BASE/v1/platform/health" > /tmp/platform-health.json
          jq -e '.status=="ready" and .platform_api_enabled==true and .developer_control_plane_enabled==true and .cli_device_auth.enabled==true and .cli_device_auth.secret_ready==true and .webhook_delivery.enabled==false and .earthdaily_status=="awaiting_partner_contract" and .valley_irrigation_status=="awaiting_partner_contract" and .physical_irrigation_commands=="disabled"' /tmp/platform-health.json >/dev/null

      - name: Verify public legal assets by exact digest
        run: |
          set -euo pipefail
          jq -c '.documents[]' /tmp/approved-legal.json | while read -r document; do
            asset="$(jq -r '.asset' <<<"$document")"
            digest="$(jq -r '.sha256' <<<"$document")"
            url="https://agroai-pilot.com/platform-api/assets/legal/$(basename "$asset")"
            curl --fail-with-body --silent --show-error "$url" -o /tmp/legal-asset.html
            [[ "$(sha256sum /tmp/legal-asset.html | awk '{print $1}')" == "$digest" ]] || { echo "Public digest mismatch: $url" >&2; exit 1; }
          done

      - name: Deploy public TEST marketing/indexing mode
        run: |
          set -euo pipefail
          npx --yes wrangler@4.107.0 deploy --config "$WORKER_CONFIG" \
            --var "MARKETING_ORIGIN:https://agroai-343.pages.dev" \
            --var "PLATFORM_API_MARKETING_ENABLED:true" \
            --var "PLATFORM_API_PUBLIC_DOCS_ENABLED:true" \
            --var "PLATFORM_API_INDEXING_ENABLED:true" \
            --var "PLATFORM_API_PUBLIC_SELF_SERVICE_ENABLED:true"

      - name: Verify public launch surface
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            landing_code="$(curl -sS -L -D /tmp/landing.headers -o /tmp/landing.html -w '%{http_code}' "$MARKETING_URL" || true)"
            installer_code="$(curl -sS -L -o /tmp/installer.sh -w '%{http_code}' "$MARKETING_URL/assets/install.sh" || true)"
            if [[ "$landing_code" == "200" && "$installer_code" == "200" ]] && grep -Fi 'x-agroai-platform-api-access: public-test-self-service' /tmp/landing.headers >/dev/null && ! grep -Fi 'x-robots-tag: noindex, nofollow' /tmp/landing.headers >/dev/null && grep -F 'Self-service TEST access is open to eligible verified agricultural developers.' /tmp/landing.html >/dev/null && grep -F 'Next: agroai login' /tmp/installer.sh >/dev/null; then exit 0; fi
            sleep 4
          done
          echo "Public Platform marketing did not reach self-service state" >&2
          exit 1

      - name: Activation evidence
        run: |
          set -euo pipefail
          mkdir -p activation-evidence
          cp /tmp/approved-legal.json activation-evidence/legal-catalog.json
          cp /tmp/effective-terms.json activation-evidence/effective-terms.json
          cp /tmp/final-health.json activation-evidence/api-health.json
          cp /tmp/platform-health.json activation-evidence/platform-health.json
          cp /tmp/landing.headers activation-evidence/marketing-headers.txt
          jq -n --arg release_sha "$GITHUB_SHA" --arg activated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{status:"test_self_service_activated",release_sha:$release_sha,activated_at:$activated_at,indexing:true,live_projects:false,billing:false,webhook_delivery:false,physical_execution:false,provider_writes:false}' > activation-evidence/activation.json

      - uses: actions/upload-artifact@v4
        with:
          name: platform-api-public-test-self-service-${{ github.sha }}
          path: activation-evidence
          retention-days: 90

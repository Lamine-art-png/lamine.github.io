name: Activate Platform API Public TEST Self-Service

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type ACTIVATE_TEST_SELF_SERVICE exactly. This never enables LIVE or physical execution."
        required: true
        type: string

permissions:
  contents: read

env:
  API_BASE: https://api.agroai-pilot.com

jobs:
  activate:
    name: Counsel-gated TEST-only activation
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: platform-api-public-test-self-service-activation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse anything except the current main commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.ref }}" == "refs/heads/main" ]] || { echo "Activation must run from main" >&2; exit 1; }
          [[ "${{ inputs.confirmation }}" == "ACTIVATE_TEST_SELF_SERVICE" ]] || { echo "Exact confirmation phrase missing" >&2; exit 1; }
          git fetch origin main --depth=1
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || { echo "Workflow SHA is not the current main head" >&2; exit 1; }

      - name: Require external activation credentials
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ vars.PRODUCTION_API_SERVICE_ID }}
          PLATFORM_ADMIN_TOKEN: ${{ secrets.PLATFORM_API_ACTIVATION_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$RENDER_API_KEY" ]] || { echo "RENDER_API_KEY is required" >&2; exit 1; }
          [[ -n "$SERVICE_ID" ]] || { echo "PRODUCTION_API_SERVICE_ID is required" >&2; exit 1; }
          [[ -n "$PLATFORM_ADMIN_TOKEN" ]] || { echo "PLATFORM_API_ACTIVATION_ADMIN_TOKEN is required" >&2; exit 1; }

      - name: Validate counsel-approved legal evidence and exact public digests
        shell: bash
        run: |
          set -euo pipefail
          python3 platform-api/legal/validate_approved_catalog.py > /tmp/approved-legal.json
          cat /tmp/approved-legal.json

      - name: Render API helper preflight
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ vars.PRODUCTION_API_SERVICE_ID }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/$SERVICE_ID" >/tmp/render-service.json
          jq -e '.id != null' /tmp/render-service.json >/dev/null

      - name: Stage 1 — enable legal enforcement only
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ vars.PRODUCTION_API_SERVICE_ID }}
        run: |
          set -euo pipefail
          put_env() {
            local key="$1" value="$2"
            curl --fail-with-body --silent --show-error \
              -X PUT \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --arg value "$value" '{value:$value}')" \
              "https://api.render.com/v1/services/$SERVICE_ID/env-vars/$key" >/dev/null
          }
          put_env PLATFORM_API_ENABLED true
          put_env PLATFORM_API_TERMS_ENFORCEMENT_ENABLED true
          # Automatic enrollment remains explicitly off while legal records are published.
          put_env PLATFORM_API_TEST_SELF_SERVICE_AUTO_ENROLL_ENABLED false
          put_env PLATFORM_API_CLI_DEVICE_AUTH_ENABLED false

      - name: Deploy stage 1 at exact main SHA
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ vars.PRODUCTION_API_SERVICE_ID }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg commitId "$GITHUB_SHA" '{commitId:$commitId,clearCache:"do_not_clear"}')" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" > /tmp/stage1-deploy.json
          jq -e '.id != null' /tmp/stage1-deploy.json >/dev/null
          echo "Stage 1 deploy: $(jq -r '.id' /tmp/stage1-deploy.json)"

      - name: Wait for stage 1 exact backend revision
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if body="$(curl --silent --show-error --max-time 15 "$API_BASE/v1/health" 2>/dev/null)"; then
              build_sha="$(jq -r '.build_sha // empty' <<<"$body" 2>/dev/null || true)"
              if [[ "$build_sha" == "$GITHUB_SHA" ]]; then
                echo "$body" > /tmp/stage1-health.json
                echo "Stage 1 backend reached exact SHA $GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Stage 1 backend did not reach exact SHA $GITHUB_SHA" >&2
          exit 1

      - name: Publish counsel-approved terms as approved_effective
        shell: bash
        env:
          PLATFORM_ADMIN_TOKEN: ${{ secrets.PLATFORM_API_ACTIVATION_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          effective_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -c '.documents[]' /tmp/approved-legal.json | while read -r document; do
            document_type="$(jq -r '.document_type' <<<"$document")"
            version="$(jq -r '.version' <<<"$document")"
            digest="$(jq -r '.sha256' <<<"$document")"
            reaccept="$(jq -r '.reacceptance_required' <<<"$document")"
            payload="$(jq -nc \
              --arg digest "$digest" \
              --arg effective_at "$effective_at" \
              --argjson reacceptance_required "$reaccept" \
              '{status:"approved_effective",content_digest:$digest,effective_at:$effective_at,reacceptance_required:$reacceptance_required,reason:"Counsel-approved public TEST self-service launch catalog"}')"
            curl --fail-with-body --silent --show-error \
              -X PUT \
              -H "Authorization: Bearer $PLATFORM_ADMIN_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "$API_BASE/v1/platform/admin/terms/$document_type/$version" > "/tmp/terms-$document_type.json"
            jq -e --arg type "$document_type" --arg version "$version" \
              '.document_type == $type and .version == $version and .status == "approved_effective"' \
              "/tmp/terms-$document_type.json" >/dev/null
          done

      - name: Stage 2 — enable only public TEST self-service capabilities
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ vars.PRODUCTION_API_SERVICE_ID }}
        run: |
          set -euo pipefail
          put_env() {
            local key="$1" value="$2"
            curl --fail-with-body --silent --show-error \
              -X PUT \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --arg value "$value" '{value:$value}')" \
              "https://api.render.com/v1/services/$SERVICE_ID/env-vars/$key" >/dev/null
          }

          # Public TEST developer path.
          put_env PLATFORM_API_ENABLED true
          put_env PLATFORM_API_DEVELOPER_CONTROL_PLANE_ENABLED true
          put_env PLATFORM_API_TEST_PROJECTS_ENABLED true
          put_env PLATFORM_API_SELF_SERVICE_SANDBOX_ENABLED true
          put_env PLATFORM_API_TEST_SELF_SERVICE_AUTO_ENROLL_ENABLED true
          put_env PLATFORM_API_TERMS_ENFORCEMENT_ENABLED true
          put_env PLATFORM_API_CLI_DEVICE_AUTH_ENABLED true
          put_env PLATFORM_API_PUBLIC_DOCS_ENABLED true

          # Explicitly prevent stale production values from widening this launch.
          put_env PLATFORM_API_LIVE_PROJECTS_ENABLED false
          put_env PLATFORM_API_LIVE_ACCESS_REQUESTS_ENABLED false
          put_env PLATFORM_API_WEBHOOK_DELIVERY_ENABLED false
          put_env PLATFORM_API_LIVE_AUTO_APPROVAL_ENABLED false
          put_env PLATFORM_API_BILLING_ENABLED false
          put_env PLATFORM_API_STRIPE_CHECKOUT_ENABLED false
          put_env PLATFORM_API_STRIPE_METER_EXPORT_ENABLED false
          put_env EARTHDAILY_ADAPTER_ENABLED false
          put_env VALLEY_IRRIGATION_ADAPTER_ENABLED false
          put_env VALLEY_IRRIGATION_WRITE_CAPABILITY_ENABLED false

      - name: Verify Render env contract before final deploy
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ vars.PRODUCTION_API_SERVICE_ID }}
        run: |
          set -euo pipefail
          verify_env() {
            local key="$1" expected="$2"
            value="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/$SERVICE_ID/env-vars/$key" | jq -r '.value // empty')"
            [[ "$value" == "$expected" ]] || { echo "$key expected=$expected actual=$value" >&2; exit 1; }
          }
          for key in \
            PLATFORM_API_ENABLED PLATFORM_API_DEVELOPER_CONTROL_PLANE_ENABLED \
            PLATFORM_API_TEST_PROJECTS_ENABLED PLATFORM_API_SELF_SERVICE_SANDBOX_ENABLED \
            PLATFORM_API_TEST_SELF_SERVICE_AUTO_ENROLL_ENABLED PLATFORM_API_TERMS_ENFORCEMENT_ENABLED \
            PLATFORM_API_CLI_DEVICE_AUTH_ENABLED PLATFORM_API_PUBLIC_DOCS_ENABLED; do
            verify_env "$key" true
          done
          for key in \
            PLATFORM_API_LIVE_PROJECTS_ENABLED PLATFORM_API_LIVE_ACCESS_REQUESTS_ENABLED \
            PLATFORM_API_WEBHOOK_DELIVERY_ENABLED PLATFORM_API_LIVE_AUTO_APPROVAL_ENABLED \
            PLATFORM_API_BILLING_ENABLED PLATFORM_API_STRIPE_CHECKOUT_ENABLED \
            PLATFORM_API_STRIPE_METER_EXPORT_ENABLED EARTHDAILY_ADAPTER_ENABLED \
            VALLEY_IRRIGATION_ADAPTER_ENABLED VALLEY_IRRIGATION_WRITE_CAPABILITY_ENABLED; do
            verify_env "$key" false
          done

      - name: Deploy final TEST self-service contract at exact main SHA
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ vars.PRODUCTION_API_SERVICE_ID }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg commitId "$GITHUB_SHA" '{commitId:$commitId,clearCache:"do_not_clear"}')" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" > /tmp/final-deploy.json
          jq -e '.id != null' /tmp/final-deploy.json >/dev/null
          echo "Final deploy: $(jq -r '.id' /tmp/final-deploy.json)"

      - name: Wait for exact final backend revision
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if body="$(curl --silent --show-error --max-time 15 "$API_BASE/v1/health" 2>/dev/null)"; then
              build_sha="$(jq -r '.build_sha // empty' <<<"$body" 2>/dev/null || true)"
              if [[ "$build_sha" == "$GITHUB_SHA" ]]; then
                echo "$body" > /tmp/final-health.json
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Final backend did not reach exact SHA $GITHUB_SHA" >&2
          exit 1

      - name: Verify TEST-only production safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail-with-body --silent --show-error "$API_BASE/v1/platform/health")"
          echo "$health" > /tmp/platform-health.json
          jq -e '.physical_irrigation_commands == "disabled"' /tmp/platform-health.json >/dev/null
          jq -e '.earthdaily_status == "awaiting_partner_contract"' /tmp/platform-health.json >/dev/null
          jq -e '.valley_irrigation_status == "awaiting_partner_contract"' /tmp/platform-health.json >/dev/null
          # Device authorization must be ready, not only requested by configuration.
          jq -e '(.cli_device_auth.enabled // .cli_device_auth_enabled // false) == true' /tmp/platform-health.json >/dev/null
          jq -e '(.cli_device_auth.secret_ready // .cli_device_auth_secret_ready // false) == true' /tmp/platform-health.json >/dev/null

      - name: Verify published legal assets are public and immutable by digest
        shell: bash
        run: |
          set -euo pipefail
          jq -c '.documents[]' /tmp/approved-legal.json | while read -r document; do
            asset="$(jq -r '.asset' <<<"$document")"
            digest="$(jq -r '.sha256' <<<"$document")"
            relative="${asset#platform-api/}"
            url="https://agroai-pilot.com/platform-api/${relative#assets/}"
            # The marketing worker exposes platform-api/assets/* under /platform-api/assets/*.
            url="https://agroai-pilot.com/platform-api/assets/legal/$(basename "$asset")"
            curl --fail-with-body --silent --show-error "$url" -o /tmp/legal-asset.html
            actual="$(sha256sum /tmp/legal-asset.html | awk '{print $1}')"
            [[ "$actual" == "$digest" ]] || { echo "Public digest mismatch: $url" >&2; exit 1; }
          done

      - name: Activation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p activation-evidence
          cp /tmp/approved-legal.json activation-evidence/legal-catalog.json
          cp /tmp/final-health.json activation-evidence/api-health.json
          cp /tmp/platform-health.json activation-evidence/platform-health.json
          jq -n \
            --arg release_sha "$GITHUB_SHA" \
            --arg activated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:"test_self_service_activated",release_sha:$release_sha,activated_at:$activated_at,live_projects:false,webhook_delivery:false,physical_execution:false,provider_writes:false}' \
            > activation-evidence/activation.json

      - uses: actions/upload-artifact@v4
        with:
          name: platform-api-public-test-self-service-${{ github.sha }}
          path: activation-evidence
          retention-days: 90

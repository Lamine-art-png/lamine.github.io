name: Transactional locale catalog build

on:
  push:
    branches: [fix/deterministic-localization-release]
    paths:
      - "shared/localization/transactional-source.json"
      - "scripts/i18n-generate-transactional-catalogs.py"
      - "wrangler.i18n-authoring.toml"
      - ".github/workflows/transactional-locale-catalogs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transactional-i18n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      I18N_TRANSACTIONAL_AUTHORING_ENDPOINT: http://127.0.0.1:8787/api/chat
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve production locale set
        shell: bash
        run: |
          set -euo pipefail
          locales="$(python3 - <<'PY'
          import json
          m=json.load(open("shared/supported-locales.json"))
          out=[]
          for code in m["enabledUiLocales"]:
              if code=="auto": continue
              code="pt-BR" if code=="pt" else code
              if code not in out: out.append(code)
          print(",".join(out))
          PY
          )"
          echo "I18N_TRANSACTIONAL_LOCALES=$locales" >> "$GITHUB_ENV"
      - name: Start isolated Workers AI authoring preview
        shell: bash
        run: |
          set -euo pipefail
          nohup npx --yes wrangler@4.107.0 dev --remote --config wrangler.i18n-authoring.toml --port 8787 > /tmp/transactional-authoring.log 2>&1 &
          echo $! > /tmp/transactional-authoring.pid
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:8787/health | jq -e '.status=="ok" and .provider=="cloudflare-workers-ai"' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/transactional-authoring.log
          exit 1
      - name: Generate all transactional catalogs
        run: |
          python3 scripts/i18n-generate-transactional-catalogs.py \
            --locales "$I18N_TRANSACTIONAL_LOCALES"
      - name: Stop authoring preview
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/transactional-authoring.pid ]; then
            kill "$(cat /tmp/transactional-authoring.pid)" 2>/dev/null || true
          fi
      - name: Commit complete transactional matrix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AGRO-AI Release Bot"
          git config user.email "release-bot@agroai-pilot.com"
          git add shared/localization/transactional-catalogs
          if git diff --cached --quiet; then
            echo "Transactional catalogs already current"
            exit 0
          fi
          git commit -m "Generate deterministic transactional locale catalogs"
          git push origin "HEAD:${GITHUB_REF_NAME}"

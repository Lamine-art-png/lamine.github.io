name: Transactional locale catalog build

on:
  push:
    branches: [fix/deterministic-localization-release]
    paths:
      - "shared/localization/transactional-source.json"
      - "shared/supported-locales.json"
      - "scripts/i18n-generate-transactional-catalogs.py"
      - ".github/workflows/transactional-locale-catalogs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transactional-i18n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      locales: ${{ steps.matrix.outputs.locales }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        name: Resolve intended production locale set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          m=json.load(open("shared/supported-locales.json"))
          out=[]
          for code in m.get("targetUiLocales") or m["enabledUiLocales"]:
              if code=="auto":
                  continue
              code="pt-BR" if code=="pt" else code
              if code not in out:
                  out.append(code)
          print("locales="+json.dumps(out,separators=(",",":")))
          PY

  author:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        locale: ${{ fromJSON(needs.prepare.outputs.locales) }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      I18N_TRANSACTIONAL_AUTHORING_ENDPOINT: http://127.0.0.1:8787/api/chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start isolated Workers AI authoring fallback
        shell: bash
        run: |
          set -euo pipefail
          nohup npx --yes wrangler@4.107.0 dev --remote --config wrangler.i18n-authoring.toml --port 8787 > /tmp/transactional-authoring.log 2>&1 &
          echo $! > /tmp/transactional-authoring.pid
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:8787/health | jq -e '.status=="ok" and .provider=="cloudflare-workers-ai"' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/transactional-authoring.log
          exit 1
      - name: Generate deterministic transactional catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transactional-out
          python3 scripts/i18n-generate-transactional-catalogs.py             --locales "${{ matrix.locale }}"             --outdir transactional-out
      - name: Stop isolated Workers AI authoring fallback
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/transactional-authoring.pid ]; then
            kill "$(cat /tmp/transactional-authoring.pid)" 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: transactional-${{ matrix.locale }}
          path: transactional-out/${{ matrix.locale }}.json
          if-no-files-found: error
          retention-days: 3

  promote:
    needs: [prepare, author]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: transactional-*
          path: shared/localization/transactional-catalogs
          merge-multiple: true
      - name: Validate and commit complete transactional matrix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AGRO-AI Release Bot"
          git config user.email "release-bot@agroai-pilot.com"
          git add shared/localization/transactional-catalogs
          if git diff --cached --quiet; then
            echo "Transactional catalogs already current"
            exit 0
          fi
          git commit -m "Generate deterministic transactional locale catalogs"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Patch Field Intelligence mobile live v4

on:
  pull_request:
    branches:
      - ops/fi-mobile-live-v4-base
    paths:
      - scripts/patch_field_intelligence_mobile_live_v4.py
      - .github/workflows/patch-field-intelligence-mobile-live-v4.yml
      - .github/field-intelligence-mobile-live-v4.trigger

permissions:
  contents: write

concurrency:
  group: field-intelligence-mobile-live-v4
  cancel-in-progress: true

jobs:
  patch-test-commit:
    if: github.event.pull_request.head.ref == 'fix/field-intelligence-mobile-live-v4'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/field-intelligence-mobile-live-v4
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agroai_api/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            figma-enterprise-v4/package-lock.json
            cloudflare/edge-gateway/package-lock.json

      - name: Apply guarded product patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/patch_field_intelligence_mobile_live_v4.py")
          text = path.read_text(encoding="utf-8")

          old_regex = "    updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)"
          new_regex = "    compiled = re.compile(pattern, flags)\n    updated, count = compiled.subn(lambda _match: replacement, text, count=1)"
          if text.count(old_regex) != 1:
              raise SystemExit("guarded regex helper did not match exactly once")
          text = text.replace(old_regex, new_regex, 1)

          old_memory = "limiter = replace_once(limiter, '        for name, limit, seconds in _WINDOWS:', '        for name, limit, seconds in windows:', label=\"memory windows\")"
          new_memory = "limiter = limiter.replace('        for name, limit, seconds in _WINDOWS:', '        for name, limit, seconds in windows:', 1)"
          if text.count(old_memory) != 1:
              raise SystemExit("memory-window patch guard did not match exactly once")
          text = text.replace(old_memory, new_memory, 1)

          path.write_text(text, encoding="utf-8")
          PY
          python scripts/patch_field_intelligence_mobile_live_v4.py

      - name: Compile and test changed backend contracts
        working-directory: agroai_api
        run: |
          python -m pip install -q -r requirements.txt pytest
          python -m compileall -q app tests
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q --tb=short \
            tests/test_field_intelligence_multimodal_v3.py \
            tests/unit/test_field_vision.py \
            tests/unit/test_field_live_rate_limit_channels.py \
            tests/unit/test_field_intelligence_hardening.py

      - name: Test and build production portal
        working-directory: figma-enterprise-v4
        env:
          VITE_API_BASE_URL: https://app.agroai-pilot.com
          VITE_DEPLOYMENT_ENVIRONMENT: production
          VITE_BUILD_SHA: ${{ github.sha }}
        run: |
          npm ci --no-audit --no-fund
          node tests/field-intelligence-offline-contract.mjs
          node tests/field-intelligence-multimodal-contract.mjs
          npm run test:i18n
          npm run build

      - name: Test Cloudflare edge contracts
        working-directory: cloudflare/edge-gateway
        run: |
          npm ci --no-audit --no-fund
          npm run check

      - name: Remove one-off patch machinery
        run: |
          rm -f scripts/patch_field_intelligence_mobile_live_v4.py
          rm -f .github/workflows/patch-field-intelligence-mobile-live-v4.yml
          rm -f .github/field-intelligence-mobile-live-v4.trigger

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make Field Intelligence mobile video live, smooth, and multilingual"
          git push origin HEAD:fix/field-intelligence-mobile-live-v4

name: Real Production Forms Diagnostic

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/forms-real-production-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-14
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Inspect Cloudflare route ownership
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          zone_json="$(curl -fsS -H "$auth" 'https://api.cloudflare.com/client/v4/zones?name=agroai-pilot.com')"
          zone_id="$(printf '%s' "$zone_json" | jq -r '.result[0].id')"
          test -n "$zone_id"
          echo "=== WORKER ROUTES ==="
          curl -fsS -H "$auth" "https://api.cloudflare.com/client/v4/zones/${zone_id}/workers/routes" \
            | jq -r '.result[] | [.pattern, (.script // "<none>")] | @tsv' \
            | sort
          echo "=== FILTERED FORM ROUTES ==="
          curl -fsS -H "$auth" "https://api.cloudflare.com/client/v4/zones/${zone_id}/workers/routes" \
            | jq -r '.result[] | select(.pattern|test("api/(apply|consultation-requests|demo-request)")) | [.id,.pattern,(.script // "<none>")] | @tsv'

      - name: Inspect exact public route responses
        shell: bash
        run: |
          set -euo pipefail
          for path in /api/apply /api/consultation-requests /api/demo-request; do
            safe="$(echo "$path" | tr '/' '_')"
            code="$(curl -sS --max-time 30 -D "${safe}.headers" -o "${safe}.body" -w '%{http_code}' "https://agroai-pilot.com${path}" || true)"
            echo "=== ${path} HTTP ${code} ==="
            grep -Ei '^(HTTP/|server:|cf-ray:|content-type:|allow:|x-agroai|date:)' "${safe}.headers" || true
            head -c 1000 "${safe}.body" || true
            echo
          done

      - name: Inspect live website form targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live
          curl -fsSL https://agroai-pilot.com/careers -o live/careers.html
          curl -fsSL https://agroai-pilot.com/book-a-demo -o live/book-a-demo.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import re, subprocess

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.src=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      value=dict(attrs).get('src')
                      if value: self.src.append(value)

          for page in ('careers','book-a-demo'):
              base=f'https://agroai-pilot.com/{page}'
              html=Path(f'live/{page}.html').read_text(errors='replace')
              parser=Scripts(); parser.feed(html)
              chunks=[html]
              print(f'=== {page} scripts ===')
              for i,src in enumerate(parser.src):
                  full=urljoin(base,src)
                  print(full)
                  if urlparse(full).hostname != 'agroai-pilot.com': continue
                  target=f'live/{page}-{i}.js'
                  subprocess.run(['curl','-fsSL',full,'-o',target],check=True)
                  chunks.append(Path(target).read_text(errors='replace'))
              text='\n'.join(chunks)
              print(f'=== {page} submission targets ===')
              for pattern in [r'https://formspree\.io/[^"\']+', r'/api/apply/?', r'/api/consultation-requests/?', r'/api/demo-request/?', r'https://[^"\']+workers\.dev[^"\']*']:
                  print(pattern, sorted(set(re.findall(pattern,text,re.I))))
              for needle in ['/api/apply','/api/consultation-requests','formspree.io','workers.dev']:
                  start=0
                  while True:
                      at=text.lower().find(needle.lower(),start)
                      if at<0: break
                      print(f'CONTEXT {needle}:',text[max(0,at-350):at+700])
                      start=at+len(needle)
          PY

      - name: Test notification service directly
        shell: bash
        run: |
          set -euo pipefail
          marker="direct-notification-${GITHUB_RUN_ID}"
          jq -n --arg marker "$marker" '{
            type:"sales",
            priority:"high",
            name:"AGRO-AI production diagnostic",
            email:"contact@agroai-pilot.com",
            company:"AGRO-AI Inc.",
            role:"Production diagnostic",
            subject:("Direct notification service diagnostic " + $marker),
            message:$marker,
            source_page:"forms-production-diagnostic",
            metadata:{diagnostic:true}
          }' > notification.json
          code="$(curl -sS --max-time 30 -D notification.headers -o notification.body -w '%{http_code}' \
            -X POST https://api.agroai-pilot.com/v1/sales/contact \
            -H 'content-type: application/json' \
            -H 'accept: application/json' \
            --data @notification.json || true)"
          echo "Direct notification HTTP ${code}"
          cat notification.body; echo
          echo "DIRECT_MARKER=${marker}" >> "$GITHUB_ENV"

      - name: Exact browser-shaped Careers POST
        shell: bash
        run: |
          set -euo pipefail
          marker="careers-browser-shaped-${GITHUB_RUN_ID}"
          printf '%s\n' '%PDF-1.4' 'AGRO-AI real production browser-shaped diagnostic' '%%EOF' > resume.pdf
          code="$(curl -sS --connect-timeout 10 --max-time 60 -D careers-post.headers -o careers-post.body -w '%{http_code}' \
            -X POST https://agroai-pilot.com/api/apply \
            -H 'Origin: https://agroai-pilot.com' \
            -H 'Referer: https://agroai-pilot.com/careers' \
            -H 'Accept: application/json, text/plain, */*' \
            -H 'User-Agent: Mozilla/5.0 ProductionDiagnostic' \
            -F 'fullName=AGRO-AI browser-shaped diagnostic' \
            -F 'email=contact@agroai-pilot.com' \
            -F 'phone=' \
            -F 'location=San Francisco, California' \
            -F 'school=Internal production diagnostic' \
            -F 'linkedin=https://www.linkedin.com/company/agro-ai-inc/' \
            -F 'portfolio=https://agroai-pilot.com' \
            -F 'availability=Immediate' \
            -F 'role=Product Intern' \
            -F 'eligibility=Internal diagnostic' \
            -F "whyAgroAi=${marker}" \
            -F 'relevantExperience=Production form diagnosis' \
            -F 'roleContribution=Fix delivery' \
            -F 'proofOfWork=https://agroai-pilot.com' \
            -F 'aiWorkflow=Production browser-shaped test' \
            -F 'toolsUsed=Browser' \
            -F 'proudestWork=Reliable delivery' \
            -F 'workingStyle=Evidence driven' \
            -F 'agroAiImprovement=Reliable notifications' \
            -F 'resume=@resume.pdf;type=application/pdf' || true)"
          echo "Careers POST HTTP ${code}"
          grep -Ei '^(HTTP/|server:|cf-ray:|content-type:|x-agroai|date:)' careers-post.headers || true
          cat careers-post.body; echo
          echo "CAREERS_MARKER=${marker}" >> "$GITHUB_ENV"

      - name: Exact browser-shaped Demo POST
        shell: bash
        run: |
          set -euo pipefail
          marker="demo-browser-shaped-${GITHUB_RUN_ID}"
          jq -n --arg marker "$marker" '{
            fullName:"AGRO-AI browser-shaped demo diagnostic",
            email:"contact@agroai-pilot.com",
            phone:"",
            farmName:"AGRO-AI Inc.",
            location:"San Francisco, California",
            acreage:1,
            cropTypes:"Internal diagnostic",
            currentIrrigation:"Internal diagnostic",
            mainChallenges:$marker,
            preferredCallTime:"No follow-up required",
            status:"pending"
          }' > demo.json
          code="$(curl -sS --connect-timeout 10 --max-time 60 -D demo-post.headers -o demo-post.body -w '%{http_code}' \
            -X POST https://agroai-pilot.com/api/consultation-requests \
            -H 'Origin: https://agroai-pilot.com' \
            -H 'Referer: https://agroai-pilot.com/book-a-demo' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/plain, */*' \
            -H 'User-Agent: Mozilla/5.0 ProductionDiagnostic' \
            --data @demo.json || true)"
          echo "Demo POST HTTP ${code}"
          grep -Ei '^(HTTP/|server:|cf-ray:|content-type:|x-agroai|date:)' demo-post.headers || true
          cat demo-post.body; echo
          echo "DEMO_MARKER=${marker}" >> "$GITHUB_ENV"

      - name: Summarize markers
        run: |
          echo "Direct: ${DIRECT_MARKER}"
          echo "Careers: ${CAREERS_MARKER}"
          echo "Demo: ${DEMO_MARKER}"

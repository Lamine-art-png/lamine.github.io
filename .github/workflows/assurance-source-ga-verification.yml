name: Assurance Source-Controlled GA Verification

on:
  pull_request:
    paths:
      - 'agroai_api/app/services/assurance_rollout.py'
      - 'agroai_api/tests/unit/test_assurance_ga_rollout.py'
      - 'docs/assurance/ROLLOUT.md'
      - '.github/workflows/assurance-source-ga-verification.yml'
  push:
    branches: ["main"]
    paths:
      - 'agroai_api/app/services/assurance_rollout.py'
      - 'agroai_api/tests/unit/test_assurance_ga_rollout.py'
      - 'docs/assurance/ROLLOUT.md'
      - '.github/workflows/assurance-source-ga-verification.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: assurance-source-ga-${{ github.ref }}
  cancel-in-progress: false

env:
  API_BASE: https://api.agroai-pilot.com
  PORTAL_URL: https://app.agroai-pilot.com

jobs:
  validate:
    name: Validate GA release control
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agroai_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agroai_api/requirements.txt
      - name: Install backend test dependencies
        run: python -m pip install -q -r requirements.txt pytest==8.3.5
      - name: Compile release gate
        run: python -m compileall -q app/services/assurance_rollout.py
      - name: Prove GA default, production identity gate, staging posture, and kill switch
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q --tb=short \
            tests/unit/test_assurance_ga_rollout.py \
            tests/unit/test_assurance_v2.py::test_assurance_rollout_fails_closed_in_production

  verify-production:
    name: Prove exact live Assurance GA
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      QUEUE_CONSUMER_TOKEN: ${{ secrets.QUEUE_CONSUMER_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require production verification credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${QUEUE_CONSUMER_TOKEN:-}" ]] || { echo "QUEUE_CONSUMER_TOKEN is required" >&2; exit 1; }
          [[ -n "${GH_TOKEN:-}" ]] || { echo "GitHub status token is required" >&2; exit 1; }

      - name: Publish pending GA verification status
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc '{state:"pending",context:"assurance-source-ga-production",description:"Waiting for exact Assurance GA production deployment"}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Confirm current production contract is healthy before waiting
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $QUEUE_CONSUMER_TOKEN" \
            "$API_BASE/v1/internal/release/health" > pre-ga-release-health.json
          jq -e '.status == "ok" and .contract == "agroai-release-v1" and .schema_current == true and .queue_configured == true and .object_storage_configured == true and .object_storage_reachable == true and .production_ready == true' pre-ga-release-health.json >/dev/null

      - name: Wait for exact backend SHA and general Assurance state
        shell: bash
        run: |
          set -euo pipefail
          last_body=''
          for attempt in $(seq 1 180); do
            body="$(curl --silent --show-error --max-time 20 \
              -H "Authorization: Bearer $QUEUE_CONSUMER_TOKEN" \
              "$API_BASE/v1/internal/release/health" 2>/dev/null || true)"
            last_body="$body"
            if printf '%s' "$body" | jq -e --arg sha "$GITHUB_SHA" \
              '.status == "ok" and .contract == "agroai-release-v1" and .build_sha == $sha and .schema_current == true and .queue_configured == true and .object_storage_configured == true and .object_storage_reachable == true and .production_ready == true and .assurance_release_state == "general"' \
              >/dev/null 2>&1; then
              printf '%s' "$body" > live-ga-release-health.json
              echo "Exact production backend is live with Assurance general"
              exit 0
            fi
            sleep 5
          done
          printf '%s' "$last_body" > live-ga-release-health-failure.json
          echo "Exact GA backend SHA never reached the full production contract" >&2
          exit 1

      - name: Smoke production Enterprise Portal Assurance route
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --location --max-time 20 "$PORTAL_URL/assurance" -o assurance.html; then
              title="$(sed -n 's:.*<title>\(.*\)</title>.*:\1:p' assurance.html | head -1)"
              if [[ "$title" == "AGRO-AI Enterprise Portal" ]]; then
                ready=1
                break
              fi
            fi
            sleep 5
          done
          [[ "$ready" == "1" ]] || { echo "Production /assurance route did not serve the Enterprise Portal" >&2; exit 1; }

      - name: Upload immutable GA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assurance-source-ga-${{ github.sha }}
          path: |
            pre-ga-release-health.json
            live-ga-release-health.json
            live-ga-release-health-failure.json
            assurance.html
          if-no-files-found: ignore
          retention-days: 90

      - name: Publish final GA verification status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == "success" ]]; then
            state=success
            description="Assurance GA verified on exact production SHA"
          else
            state=failure
            description="Assurance GA production verification failed"
          fi
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc --arg state "$state" --arg context assurance-source-ga-production --arg description "$description" '{state:$state,context:$context,description:$description}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

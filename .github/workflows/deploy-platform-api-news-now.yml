name: Deploy Platform API News Article Now

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-platform-api-news-now.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: agroai-news-article-production
  cancel-in-progress: false

jobs:
  deploy-and-prove:
    name: Deploy and prove Platform API article live
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ARTICLE_URL: https://agroai-pilot.com/news/agro-ai-platform-api-launch
      COVER_URL: https://agroai-pilot.com/news/agro-ai-platform-api-launch/cover.svg
      LOGO_URL: https://agroai-pilot.com/news/agro-ai-platform-api-launch/agro-ai-logo.png
      NEWSROOM_URL: https://agroai-pilot.com/news
      NEWSROOM_SCRIPT_URL: https://agroai-pilot.com/news/agroai-news-card-restore.js
      FIELD_ARTICLE_URL: https://agroai-pilot.com/news/introducing-agro-ai-field-intelligence
      DEERE_ARTICLE_URL: https://agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center
    steps:
      - uses: actions/checkout@v4

      - name: Record deployment start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/384/comments" \
            -f body="DEPLOY STARTED: production Platform API News publication run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}. No live claim will be made until the HTTP and regression proofs pass."

      - name: Require production Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Validate exact article sources and routes
        shell: bash
        run: |
          set -euo pipefail
          article="client/public/news/agro-ai-platform-api-launch/index.html"
          cover="client/public/news/agro-ai-platform-api-launch/cover.svg"
          worker="cloudflare/field-intelligence-launch-worker/src/index.ts"
          routes="cloudflare/field-intelligence-launch-worker/wrangler.toml"

          test -s "$article"
          test -s "$cover"
          test -s "$worker"
          test -s "$routes"

          grep -F "AGRO-AI launches the Platform API for agriculture builders" "$article" >/dev/null
          grep -F "Build agricultural products on the AGRO-AI intelligence layer." "$article" >/dev/null
          grep -F 'PLATFORM_API_ARTICLE_PATH = "/news/agro-ai-platform-api-launch"' "$worker" >/dev/null
          grep -F 'AGRO-AI launches the Platform API' "$worker" >/dev/null
          grep -F 'pattern = "agroai-pilot.com/news/agro-ai-platform-api-launch"' "$routes" >/dev/null
          grep -F 'pattern = "agroai-pilot.com/news/agro-ai-platform-api-launch/*"' "$routes" >/dev/null
          ! grep -F 'pattern = "agroai-pilot.com/news*"' "$routes"
          ! grep -F 'pattern = "agroai-pilot.com/news/*"' "$routes"

      - name: Validate Worker bundle without publishing
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.107.0 deploy --dry-run --config cloudflare/field-intelligence-launch-worker/wrangler.toml

      - name: Deploy exact production News routes
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.107.0 deploy --config cloudflare/field-intelligence-launch-worker/wrangler.toml

      - name: Prove Platform API article, cover, logo, card, and existing articles live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            bust="$(date +%s)-${attempt}"
            article_status="$(curl -sS -L -H 'Cache-Control: no-cache' -D article.headers -o article.html -w '%{http_code}' --max-time 25 "${ARTICLE_URL}?verify=${bust}" || true)"
            cover_status="$(curl -sS -L -H 'Cache-Control: no-cache' -D cover.headers -o cover.svg -w '%{http_code}' --max-time 25 "${COVER_URL}?verify=${bust}" || true)"
            logo_status="$(curl -sS -L -H 'Cache-Control: no-cache' -D logo.headers -o logo.bin -w '%{http_code}' --max-time 25 "${LOGO_URL}?verify=${bust}" || true)"
            news_status="$(curl -sS -L -H 'Cache-Control: no-cache' -D news.headers -o news.html -w '%{http_code}' --max-time 25 "${NEWSROOM_URL}?verify=${bust}" || true)"
            script_status="$(curl -sS -L -H 'Cache-Control: no-cache' -o newsroom.js -w '%{http_code}' --max-time 25 "${NEWSROOM_SCRIPT_URL}?verify=${bust}" || true)"
            field_status="$(curl -sS -L -H 'Cache-Control: no-cache' -o field.html -w '%{http_code}' --max-time 25 "${FIELD_ARTICLE_URL}?verify=${bust}" || true)"
            deere_status="$(curl -sS -L -H 'Cache-Control: no-cache' -o deere.html -w '%{http_code}' --max-time 25 "${DEERE_ARTICLE_URL}?verify=${bust}" || true)"

            if [ "$article_status" = "200" ] && [ "$cover_status" = "200" ] && [ "$logo_status" = "200" ] && \
               [ "$news_status" = "200" ] && [ "$script_status" = "200" ] && [ "$field_status" = "200" ] && [ "$deere_status" = "200" ] && \
               grep -F "AGRO-AI launches the Platform API for agriculture builders" article.html >/dev/null && \
               grep -F "Build agricultural products on the AGRO-AI intelligence layer." article.html >/dev/null && \
               ! grep -F "Article not found" article.html >/dev/null && \
               grep -Fi "content-type: image/svg+xml" cover.headers >/dev/null && \
               grep -Fi "x-agroai-asset-source: reviewed-platform-api-cover" cover.headers >/dev/null && \
               grep -Fi "x-agroai-asset-source: official-repository-logo" logo.headers >/dev/null && \
               grep -Fi "x-agroai-newsroom-source: native-pages-origin" news.headers >/dev/null && \
               grep -F "/news/agro-ai-platform-api-launch" newsroom.js >/dev/null && \
               grep -F "AGRO-AI launches the Platform API" newsroom.js >/dev/null && \
               grep -F "Introducing AGRO-AI Field Intelligence" field.html >/dev/null && \
               grep -F "AGRO-AI connects with John Deere Operations Center™" deere.html >/dev/null; then
              echo "platform_api_news_article=verified_live"
              echo "existing_news_articles=verified_live"
              exit 0
            fi

            echo "Attempt ${attempt}: article=${article_status} cover=${cover_status} logo=${logo_status} news=${news_status} script=${script_status} field=${field_status} deere=${deere_status}"
            sleep 5
          done

          echo "Platform API article did not become live after deployment"
          cat article.headers || true
          head -80 article.html || true
          cat cover.headers || true
          cat logo.headers || true
          cat news.headers || true
          exit 1

      - name: Record verified live proof on publication PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          gh api "repos/${GITHUB_REPOSITORY}/issues/384/comments" \
            -f body="LIVE PROOF: Platform API News article returned HTTP 200 with the reviewed title and body; cover, official logo, newsroom card script, Field Intelligence article, and John Deere article also passed live checks at ${verified_at}. Deployment commit: ${GITHUB_SHA}. Run: ${GITHUB_RUN_ID}."

      - name: Record deployment failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/384/comments" \
            -f body="DEPLOY FAILURE: production Platform API News publication run ${GITHUB_RUN_ID} failed at commit ${GITHUB_SHA}. The article must still be treated as not published until a later LIVE PROOF comment is recorded."

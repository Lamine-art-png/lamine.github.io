name: Portal Auth Live Proof macOS

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: agroai-portal-auth-live-proof-macos
  cancel-in-progress: true

jobs:
  prove:
    if: ${{ github.actor == github.repository_owner && github.event.issue.title == '[ops] Verify portal auth release macOS' }}
    runs-on: macos-14
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      EXPECTED_BUILD_SHA: 95ea043640015fed905920ce7e936f8081ff85ce
    steps:
      - name: Probe live portal and authentication release
        shell: bash
        run: |
          set -u
          tmp="${RUNNER_TEMP}/portal-auth-proof"
          report="${tmp}/report.md"
          mkdir -p "$tmp"
          {
            echo '## Enterprise Portal authentication live proof'
            echo
            echo "- expected backend build: \`${EXPECTED_BUILD_SHA}\`"
            echo "- checked at: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`"
            echo
          } > "$report"

          probe_get() {
            local name="$1" url="$2"
            local body="${tmp}/${name}.body"
            local timing
            timing="$(curl -sS -L -o "$body" --connect-timeout 15 --max-time 60 \
              -w 'http=%{http_code} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} bytes=%{size_download}' \
              "$url" 2>&1 || true)"
            echo "- ${name}: \`${timing}\`" >> "$report"
          }

          for target in \
            'public|https://api.agroai-pilot.com/v1/health' \
            'custom|https://api-preview.agroai-pilot.com/v1/health' \
            'direct_render|https://agroai-api-preview.onrender.com/v1/health'; do
            name="${target%%|*}"
            url="${target#*|}"
            body="${tmp}/${name}.json"
            timing="$(curl -sS -o "$body" --connect-timeout 15 --max-time 60 \
              -w 'http=%{http_code} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total}' \
              "$url" 2>&1 || true)"
            echo "- ${name}: \`${timing}\`" >> "$report"
            if python3 -m json.tool "$body" >/dev/null 2>&1; then
              echo '```json' >> "$report"
              python3 - "$body" <<'PY' >> "$report"
import json, sys
with open(sys.argv[1]) as fh:
    data = json.load(fh)
print(json.dumps({key: data.get(key) for key in ('status','service','version','build_sha','checked_at')}, separators=(',', ':')))
PY
              echo '```' >> "$report"
            fi
          done

          probe_get portal_root https://app.agroai-pilot.com/

          preflight="$(curl -sS -o "${tmp}/preflight.body" -X OPTIONS \
            --connect-timeout 15 --max-time 60 \
            -H 'Origin: https://app.agroai-pilot.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            -w 'http=%{http_code} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total}' \
            https://api.agroai-pilot.com/v1/auth/login 2>&1 || true)"
          echo "- auth_preflight: \`${preflight}\`" >> "$report"

          echo >> "$report"
          echo '### Invalid-credential database path' >> "$report"
          payload='{"email":"auth-live-proof-20260802@agroai-pilot.com","password":"NotARealPassword-20260802"}'
          for i in 1 2 3 4 5; do
            timing="$(curl -sS -o "${tmp}/login-${i}.json" -X POST \
              --connect-timeout 15 --max-time 60 \
              -H 'Origin: https://app.agroai-pilot.com' \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              -w 'http=%{http_code} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total}' \
              https://api.agroai-pilot.com/v1/auth/login 2>&1 || true)"
            echo "- run ${i}: \`${timing}\`" >> "$report"
            sleep 1
          done

          live_sha="$(python3 - "${tmp}/public.json" <<'PY'
import json, sys
try:
    with open(sys.argv[1]) as fh:
        print(json.load(fh).get('build_sha') or '')
except Exception:
    print('')
PY
          )"
          echo >> "$report"
          if [[ "$live_sha" == "$EXPECTED_BUILD_SHA" ]]; then
            echo '### Result: DEPLOYED ✅' >> "$report"
          else
            echo "### Result: NOT YET DEPLOYED (live \`${live_sha:-unknown}\`)" >> "$report"
          fi

          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body-file "$report"

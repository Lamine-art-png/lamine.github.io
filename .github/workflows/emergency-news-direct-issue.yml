name: Direct Emergency News Publication

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: agroai-direct-news-publication
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event.issue.user.login == github.repository_owner && github.event.issue.title == '[ops] Direct publish AGRO-AI news' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check credentials and start
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            gh issue comment "$ISSUE_NUMBER" --body '❌ Direct runner started but Cloudflare repository credentials are unavailable.'
            exit 1
          fi
          gh issue comment "$ISSUE_NUMBER" --body '⏳ Direct Cloudflare publication started.'

      - name: Deploy the merged news Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.107.0 deploy --config cloudflare/field-intelligence-launch-worker/wrangler.toml

      - name: Verify both articles and newsroom cards live
        shell: bash
        run: |
          set -euo pipefail
          passed=0
          for attempt in $(seq 1 48); do
            bust="$(date +%s)-${attempt}"
            news_code="$(curl -sS -L -D news.headers -o news.html -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news?verify=${bust}" || true)"
            script_code="$(curl -sS -L -o cards.js -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news/agroai-news-card-restore.js?verify=${bust}" || true)"
            jd_code="$(curl -sS -L -o jd.html -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center?verify=${bust}" || true)"
            cover_code="$(curl -sS -L -D cover.headers -o cover.webp -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news/agro-ai-connected-john-deere-operations-center/cover.webp?verify=${bust}" || true)"
            fi_code="$(curl -sS -L -o fi.html -w '%{http_code}' --max-time 25 "https://agroai-pilot.com/news/introducing-agro-ai-field-intelligence?verify=${bust}" || true)"
            if [ "$news_code" = 200 ] && [ "$script_code" = 200 ] && [ "$jd_code" = 200 ] && [ "$cover_code" = 200 ] && [ "$fi_code" = 200 ] && \
               grep -F 'Introducing AGRO-AI Field Intelligence' cards.js >/dev/null && \
               grep -F '/news/introducing-agro-ai-field-intelligence' cards.js >/dev/null && \
               grep -F 'AGRO-AI connects with John Deere Operations Center™' cards.js >/dev/null && \
               grep -F '/news/agro-ai-connected-john-deere-operations-center' cards.js >/dev/null && \
               grep -F 'AGRO-AI connects with John Deere Operations Center™' jd.html >/dev/null && \
               grep -F 'Agricultural operations do not suffer from a shortage of data.' jd.html >/dev/null && \
               grep -F "Access is initiated through the user's Operations Center connection." jd.html >/dev/null && \
               grep -F 'Introducing AGRO-AI Field Intelligence' fi.html >/dev/null && \
               grep -Fi 'content-type: image/webp' cover.headers >/dev/null && \
               test "$(wc -c < cover.webp)" -gt 10000; then
              passed=1
              break
            fi
            sleep 5
          done
          test "$passed" = 1

      - name: Report success
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --body $'✅ **Published and verified live.**\n\nThe reviewed John Deere article and supplied cover are live. The Field Intelligence article is live and its newsroom card is restored.'

      - name: Report failure
        if: ${{ failure() }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --body '❌ Direct publication or live verification failed.'

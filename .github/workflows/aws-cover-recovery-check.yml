name: AWS Cover Delivery Diagnostic
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aws-cover-recovery-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect current AWS image delivery without modifying infrastructure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error
          urls = {
            "live_article": "https://agroai-pilot.com/news/agro-ai-platform-api-aws-marketplace",
            "live_svg": "https://agroai-pilot.com/news/agro-ai-platform-api-aws-marketplace/cover.svg",
            "raw_svg": "https://raw.githubusercontent.com/Lamine-art-png/lamine.github.io/main/client/public/news/agro-ai-platform-api-aws-marketplace/cover.svg",
            "live_png": "https://agroai-pilot.com/news/agro-ai-platform-api-aws-marketplace/cover.png",
            "newsroom_script": "https://agroai-pilot.com/news/agroai-news-card-restore.js",
          }
          for k,url in urls.items():
            for method in ["HEAD","GET"]:
              try:
                req = urllib.request.Request(url,method=method,headers={"User-Agent":"AGRO-AI-Cover-Diagnostic/1.0", "Cache-Control":"no-cache"})
                with urllib.request.urlopen(req,timeout=18) as resp:
                  body=resp.read() if method=="GET" else b""
                  print(f"{k} {method}: status={resp.status} type={resp.headers.get('content-type')} bytes={len(body)} url={resp.url} marker={resp.headers.get('x-agroai-asset-source')} head={body[:80]!r}")
              except urllib.error.HTTPError as e:
                print(f"{k} {method}: ERROR status={e.code} type={e.headers.get('content-type')} url={e.url} body={e.read(150)!r}")
              except Exception as e:
                print(f"{k} {method}: ERROR {type(e).__name__}: {str(e)[:200]}")
          PY

      - name: Verify restored AWS cover and article in production
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import time, urllib.request
          base='https://agroai-pilot.com/news/agro-ai-platform-api-aws-marketplace'
          urls={
            'image':base+'/cover.webp',
            'article':base,
            'newsroom_script':'https://agroai-pilot.com/news/agroai-news-card-restore.js',
            'newsroom':'https://agroai-pilot.com/news/',
          }
          for attempt in range(1,19):
            try:
              responses={}
              for name,url in urls.items():
                req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'AGRO-AI-AWS-Cover-Verification'})
                with urllib.request.urlopen(req, timeout=20) as r:
                  responses[name]=(r.status,r.headers.get('Content-Type',''),r.read())
              img=responses['image']
              article=responses['article'][2].decode('utf-8','replace')
              script=responses['newsroom_script'][2].decode('utf-8','replace')
              news=responses['newsroom'][2].decode('utf-8','replace')
              good=(img[0]==200 and 'image/webp' in img[1] and img[2][:4]==b'RIFF'
                and len(img[2])>20000 and len(img[2])<1000000
                and responses['article'][0]==200
                and '/news/agro-ai-platform-api-aws-marketplace/cover.webp' in article
                and 'October 7, 2026' in article
                and 'image:"/news/agro-ai-platform-api-aws-marketplace/cover.webp"' in script
                and 'AGRO-AI launches its Enterprise Portal globally' in news
                and 'introducing-agro-ai-academy' in script)
              print(f'Attempt {attempt}: image_status={img[0]}, image_type={img[1]}, bytes={len(img[2])}, success={good}')
              if good:
                print('AWS_COVER_WEBP_LIVE_AND_NEWSROOM_PRESERVED')
                break
            except Exception as e:
              print(f'Attempt {attempt}: {type(e).__name__} {str(e)[:160]}')
            time.sleep(6)
          else:
            raise SystemExit('Live AWS cover restoration not yet verified')
          PY

name = "agroai-form-notification-gateway"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = false

routes = [
  { pattern = "agroai-pilot.com/api/apply", zone_name = "agroai-pilot.com" },
  { pattern = "agroai-pilot.com/api/apply/*", zone_name = "agroai-pilot.com" },
  { pattern = "agroai-pilot.com/api/consultation-requests", zone_name = "agroai-pilot.com" },
  { pattern = "agroai-pilot.com/api/consultation-requests/*", zone_name = "agroai-pilot.com" },
  { pattern = "agroai-pilot.com/api/demo-request", zone_name = "agroai-pilot.com" },
  { pattern = "agroai-pilot.com/api/demo-request/*", zone_name = "agroai-pilot.com" }
]

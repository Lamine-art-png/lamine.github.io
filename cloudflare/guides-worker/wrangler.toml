name = "agroai-guides"
main = "src/index.ts"
compatibility_date = "2026-09-05"
workers_dev = false

[[routes]]
pattern = "agroai-pilot.com/guides"
zone_name = "agroai-pilot.com"

[[routes]]
pattern = "agroai-pilot.com/guides/*"
zone_name = "agroai-pilot.com"

[assets]
directory = "../../guides"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

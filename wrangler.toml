name = "agroai-api-edge"
main = "cloudflare/edge-gateway/src/edge-main-v3.ts"
compatibility_date = "2026-07-05"
workers_dev = false

[vars]
EDGE_ENVIRONMENT = "production"
UPSTREAM_API_ORIGIN = "https://api-preview.agroai-pilot.com"
ALLOWED_ORIGINS = "https://app.agroai-pilot.com,https://platform.agroai-pilot.com,https://agroai-pilot.com,https://www.agroai-pilot.com"

[ai]
binding = "AI"

[secrets]
required = [ "QUEUE_PUBLISH_TOKEN", "QUEUE_CONSUMER_TOKEN" ]

[[routes]]
pattern = "app.agroai-pilot.com/v1/*"
zone_name = "agroai-pilot.com"

# The standalone developer product uses the same authenticated backend through
# a same-origin Worker route. The public machine hostname remains the proxied
# Render custom domain because the production Cloudflare token deliberately has
# no DNS mutation permission.
[[routes]]
pattern = "platform.agroai-pilot.com/v1/*"
zone_name = "agroai-pilot.com"

[[queues.producers]]
binding = "CONNECTOR_TASKS"
queue = "agroai-connector-tasks"

[[queues.consumers]]
queue = "agroai-connector-tasks"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 5
retry_delay = 30
max_concurrency = 4
dead_letter_queue = "agroai-connector-tasks-dlq"

# Recovery polling must leave enough idle time for Neon Free to suspend.
# Normal task delivery remains event-driven through Cloudflare Queues; this
# hourly schedule is only the bounded recovery path for stranded outbox rows.
[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1.0
